name: CI

on:
  # R190 (trigger widening): EVERY push (any branch) and EVERY pull_request,
  # superseding the R134 main-only shape. Rationale: the repo is PUBLIC
  # (Actions minutes are free — the R122 verification), and the path-filter
  # cost gate below already skips the heavy jobs for docs-only pushes, so
  # widening branch coverage costs nothing a contributor cares about while
  # catching a regression on ANY branch at the push itself — before the PR
  # is even opened. push/PR keys carry no filters = all branches (the
  # documented GitHub Actions semantics).
  push:
  pull_request:
  # FH-A12 F-4/F-5: manual full run (October renewal smoke test) — bypasses
  # the path filters, so every job runs.
  workflow_dispatch: {}
  # FH-A12 F-5: weekly sweep — the audit job no longer installs on every
  # push (deps-gated below), so the schedule keeps CVE coverage current
  # even with no dependency changes.
  schedule:
    - cron: "17 4 * * 1"

# Cancel in-progress runs for the same ref when a newer push lands.
# event_name in the group keeps the weekly scheduled sweep uncancellable
# by a push (the e2e heartbeat must never be silently dropped).
# Saves runner time and prevents stale results from racing.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Default to read-only. Each job opts-in to anything stronger.
permissions:
  contents: read

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Secret scanning — gitleaks v8 with SARIF upload to the GitHub Security tab
  # ─────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Required for github/codeql-action/upload-sarif to publish findings
      # to the repo's Security → Code scanning tab.
      security-events: write

    steps:
      - name: Checkout (full history for diff scanning)
        # SHA-pinned (r110, 109-p P2): every uses: resolves to a full 40-hex
        # commit; the tag it was resolved from rides along as a comment.
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          # R127-L4 (B9 F3, zizmor artipacked): never persist the
          # 90-day token into the workspace git config — nothing after
          # this checkout needs repo credentials (gitleaks scans a public
          # repo's history; the SARIF upload uses the job token, not git).
          persist-credentials: false

      - name: Validate gitleaks config syntax
        run: |
          # Catch TOML parse errors (e.g. mixing [allowlist] with [[allowlist]])
          # before invoking gitleaks itself, so the failure message is obvious.
          python3 - <<'PY'
          import sys, tomllib
          try:
              with open(".gitleaks.toml", "rb") as f:
                  tomllib.load(f)
              print("✓ .gitleaks.toml parses as valid TOML")
          except Exception as e:
              print(f"::error file=.gitleaks.toml::Invalid TOML: {e}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Scan with gitleaks
        id: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # R112: the action defaults to gitleaks 8.24.3, which IGNORES
          # unscoped top-level [[allowlists]] (empirically verified — see
          # the mechanism matrix in .gitleaks.toml). 8.27+ propagates
          # global allowlists correctly. Pin the version so the gate is
          # reproducible and the config's full allowlist set engages.
          # R130 (A9-F1, corrected after the first dispatch run): push
          # events scan ONLY the pushed commit (--log-opts=-1) while
          # schedule/dispatch scan FULL history — where three historical
          # patches quote the public Firebase web key and the value
          # allowlist does not suppress them (verified on 8.27.2 AND
          # 8.28). They are commit-scoped allowlisted in .gitleaks.toml;
          # a NEW secret anywhere still fails the gate loudly.
          GITLEAKS_VERSION: "8.27.2"
          # Action is MIT-licensed; this opts out of the (paid) Pro tier prompts.
          GITLEAKS_LICENSE: "MIT"
          # Always emit a SARIF report — even when no leaks found — so the
          # Security tab upload step has a file to publish.
          GITLEAKS_ENABLE_SUMMARY: "true"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "true"

      - name: Upload SARIF to GitHub Security tab
        # Run even if the previous step failed — a "leaks found" failure must
        # still produce a Security-tab entry. The codeql-action gracefully
        # tolerates a missing or empty SARIF file.
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
          category: gitleaks
        # Don't fail the whole workflow if the upload service is briefly
        # unavailable — the scan itself is the source of truth.
        continue-on-error: true

  # ─────────────────────────────────────────────────────────────────────────
  # Path filter (cost gate) — FH-A12 F-4
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Docs-only pushes skip the heavy jobs (audit/checks/tests/build) via
  # job-level `if`
  # on the outputs below (~19 min → ~2 min). secret-scan stays ALWAYS-ON:
  # secrets get pasted into docs too, so a workflow-level paths-ignore
  # would be a coverage gap.
  filter:
    name: Path filter (cost gate)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Run path filters
        uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            code:
              - "backend/**"
              - "frontend/**"
              - "shared/**"
              - "scripts/**"
              # R191: the native Expo app joins the workspace — its source
              # must trip the heavy jobs just like backend/frontend (its
              # own `mobile` quality leg + the shared checks/build/tests).
              - "apps/mobile/**"
              - "config/**"
              - "deploy/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig*.json"
              - ".github/workflows/ci.yml"
              - "Dockerfile"
              - "docker-compose.yml"
              # R188-8 (F-F1): the remaining root toolchain/gate files — the
              # config that DEFINES the lint gate (eslint.config.mjs), the
              # pnpm behavior flags (.npmrc), and the build-context list
              # (.dockerignore) must themselves trip the heavy jobs.
              - "eslint.config.mjs"
              - ".npmrc"
              - ".dockerignore"
            deps:
              - "pnpm-lock.yaml"
              - "**/package.json"

  # ─────────────────────────────────────────────────────────────────────────
  # CVE scanning — pnpm audit on production deps only (CG-01 closure)
  # ─────────────────────────────────────────────────────────────────────────
  #
  # Closes audit Coverage Gap CG-01 (specs/004-security-audit/research.md
  # §6): "Full automated CVE scan on pnpm-lock.yaml" was a gap because
  # the audit relied on a manual top-15 sample. This job scans the full
  # production dependency tree on every push/PR that changes the dependency
  # tree, plus the weekly schedule and manual dispatch (FH-A12 F-5 — the
  # full pnpm install it runs only pays off when deps changed).
  #
  # Gating policy:
  #   - critical CVEs in `--prod` deps → BLOCK (job fails). Currently 0.
  #   - high CVEs in `--prod` deps     → INFORM (job continues, logs the list).
  #     Tracking each one and rotating it to BLOCK after triage is the
  #     follow-up — gating on every high today would block CI on transitive
  #     issues we have already triaged (e.g. path-to-regexp via express 5).
  #   - moderate / low / info → not enforced here; appear in the audit
  #     summary if anyone runs `pnpm audit` locally.
  #   - build-tool / dev-only deps (vite-plugin-pwa, orval, etc.) are NOT
  #     scanned — their CVEs do not ship to production. Use `pnpm audit`
  #     locally without `--prod` to see them.
  #
  # DEPENDABOT DECISION (R119-B5, audit A7-F8; premise corrected R122):
  # the original decision — "no dependabot while the private-repo CI
  # runner is dead (billing); revisit when a runner is funded" — rested
  # on a premise that no longer holds: the repo is PUBLIC and this CI
  # runs green on every push (R122 verification), so Actions minutes are
  # free and dependabot PRs would be fully CI-testable. The revisit
  # condition is therefore MET; whether to actually enable dependabot is
  # now a plain ops choice. Until then, this weekly pnpm-audit gate
  # remains the supply-chain watch.
  audit:
    name: CVE scanning (pnpm audit, prod deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [filter]
    # FH-A12 F-5: deps-gated — `deps` covers pnpm-lock.yaml and every
    # package.json (the inputs `pnpm audit` actually reads). Schedule and
    # manual dispatch keep CVE coverage alive without dep changes.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.deps == 'true'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # SHA = the commit the moving v4 tag actually tracks: the 2026-03-11
        # revert of "run the action on Node.js 24". v4 deliberately does NOT
        # follow the v4.4.0 tag (fc06bc12) — pinning the tag commit would
        # silently change the action runtime. Resolution table: worklog 110-I.
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          # No pnpm cache: audit resolves from pnpm-lock.yaml, not the store
          # (verified R146-F8 in a no-node_modules workspace clone).
          # v5 defaults package-manager-cache to TRUE when pnpm is on PATH —
          # with no install step the post-job save then fails hard
          # ("Path Validation Error"); disable it explicitly.
          package-manager-cache: false

      - name: CVE summary (informational — all severities)
        # Always succeeds — gives the audit job a one-line summary in
        # the CI log so reviewers can see the full picture without
        # opening artifacts.
        run: pnpm audit --prod || true

      - name: High-severity CVE inventory (informational)
        # Lists every high finding so a follow-up triage knows which
        # transitive deps need an upgrade. Continues on non-zero so a
        # high finding does not block the workflow.
        run: |
          set +e
          pnpm audit --prod --audit-level high
          rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::warning::High-severity CVEs in production deps. Triage: rotate the affected transitive to a fixed version, or document acceptance."
          fi
          exit 0

      - name: Block on critical-severity CVEs in production deps
        # The actual gate. Exits non-zero (and fails the job) if any
        # critical-severity advisory matches a `--prod` dep. Currently 0.
        # If you intentionally land a critical accept-the-risk override,
        # gate it through the security review process — do NOT relax
        # this step in a feature branch.
        run: pnpm audit --prod --audit-level critical

  # ─────────────────────────────────────────────────────────────────────────
  # Quality — split into three PARALLEL jobs (R127-L4, B9 W1). The old
  # monolithic `quality` job ran 8 serial steps on one runner (~13-17 min
  # per its own comment). lint/typecheck/drift, both vitest suites, and
  # the production build are mutually independent after the install, so
  # the critical path is now the slowest leg (~7-9 min). Cost: two extra
  # warm `pnpm install`s (~+1-2 min total runner time — free on a public
  # repo); the win is feedback latency. All three jobs keep the same
  # if/permissions/env contract the monolith had. If the repo ever gains
  # branch-protection required checks, they referenced the old
  # "Lint, typecheck, test, and build" job name — update them in Settings.
  # ─────────────────────────────────────────────────────────────────────────
  checks:
    name: Lint, typecheck, and drift gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan, filter]
    # FH-A12 F-4: skip the heavy gates on docs-only pushes (the filter
    # job decides). Schedule and manual dispatch force a full run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.code == 'true'
    permissions:
      contents: read
    env:
      # Synthetic values — these gates stub all DB/auth interactions.
      DATABASE_URL: postgres://ci:ci@localhost/ci
      # 32+ char synthetic value — jwt.ts rejects shorter secrets at module load.
      SESSION_SECRET: ci-test-secret-not-real-do-not-use-in-prod
      # Quiets the husky `prepare` script that runs on `pnpm install`.
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager` field (pnpm@10.17.0);
        # action SHA-pinned to the same v4 moving-tag commit as the audit job
        # (see the note there + worklog 110-I for why not the v4.4.0 tag).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: UI anti-pattern source gate (impeccable)
        # R127-L4 (B3 Phase 1): regex-mode scan of the frontend source for
        # AI-slop tells (bounce easings, slop gradients, glow shadows).
        # R134 (A5-F3): the engine is now a lockfile-pinned workspace
        # devDependency (impeccable@4.7.0 + its @impeccable/cli-*
        # platform binaries as optionalDependencies) resolved by the
        # `pnpm install --frozen-lockfile` step above — every tarball is
        # integrity-hash-verified against the committed lockfile. The old
        # `npx -y impeccable@4.1.0` shim fetched the artifact from the
        # public registry on every run: version-pinned but not
        # artifact-pinned, so a compromised package/mirror executed inside
        # this job. Exit semantics (impeccable's own): 0 = clean · 2 =
        # findings → this step FAILS (blocks the PR) · 1 = operational
        # error (the scan itself could not run) → also fails; NEVER
        # `|| true` — a masked 1 silently switches the gate off. Only
        # warning-severity findings affect the exit code (advisories
        # print, never block). Sanctioned exceptions carry inline
        # `impeccable-disable-line` waivers at the site
        # (frontend/src/index.css — the FINAL_UX_SYSTEM §2 spring
        # vocabulary); triage + kept findings:
        # docs/inspection-r127/B3-impeccable-ui.md. Verified exit 0 on the
        # R127 tree before this gate landed. Source mode only (no browser)
        # — rendered-mode scans stay a separate B3 Phase 2 decision.
        run: pnpm exec impeccable detect frontend/src/

      - name: Lint
        run: pnpm run lint

      - name: Prettier format gate
        # R188-8 (F-F3): prettier was enforced only at commit time
        # (lint-staged --write, opt-out with --no-verify) — format drift
        # shipped green, and the R187 CI round-1 failure (spec-truth pins
        # vs commit-time yaml-wrapping) demonstrated the bite. The repo was
        # fully reformatted in R188; this step keeps it at zero drift.
        # .prettierignore scopes it (md files are exempt).
        run: pnpm exec prettier --check .

      - name: Typecheck (project references + per-package)
        run: pnpm run typecheck

      - name: OpenAPI ↔ Express route contract gate
        # Round-92 B3 (F-01/F-10): 62% of the live /api surface was
        # undocumented, including the money-moving PATCH /admin/users/{id}
        # that landed without a spec entry. This gate diffs the Express
        # route tree against shared/api-spec/openapi.yaml so the gap can
        # never silently grow: new routes must be documented (or added to
        # the maintained KNOWN_UNDOCUMENTED allowlist for internal/
        # diagnostics surface) and documented routes must stay implemented.
        run: pnpm --filter @workspace/scripts exec tsx ../scripts/check-openapi-routes.ts

      - name: ErrorCode YAML ↔ const sync gate
        # R135 (SH-1): the ErrorCode enum lives in TWO places — the
        # round-3 single source of truth shared/error-codes/src/index.ts
        # and the ErrorCode schema enum in openapi.yaml — and drifted
        # THREE times before this gate (round-3's backend/frontend split,
        # round-92 B3/F-05's copilot family, round-93/94's
        # COPILOT_RATE_LIMITED/CSRF_CONFIG/PHASE_DISABLED/SECRET_LEAK
        # stragglers), each found by hand. This step diffs both
        # directions so a code added to one side without the other fails
        # CI loudly instead of lying to generated clients (and surfacing
        # raw English in Arabic toasts) until someone notices.
        run: pnpm --filter @workspace/scripts exec tsx ../scripts/check-error-code-sync.ts

      - name: OpenAPI header-param survival gate
        # R142 (N-1): the orval react-query client target DROPS every
        # spec header param (all 7 at R142 — Idempotency-Key on the six
        # money mutations + the Telegram webhook secret), so money paths
        # pass keys through per-call RequestInit headers on customFetch —
        # an escape hatch that lived nowhere until this gate's ledger.
        # The check fails when a spec header param silently vanishes from
        # codegen, when the ledger goes stale (orval starts emitting), or
        # when the zod mirror loses one the spec still declares.
        run: pnpm --filter @workspace/scripts exec tsx ../scripts/check-openapi-header-params.ts

      - name: Migration drift check
        # Regenerates Drizzle migrations from the schema, then verifies the
        # working tree is unchanged. If a dev edited the schema without
        # committing the regenerated SQL, this fails CI loudly. The diff
        # output is preserved on stderr so failures are debuggable.
        run: |
          set -euo pipefail
          pnpm --filter @workspace/db exec drizzle-kit generate
          if ! git diff --exit-code -- shared/db; then
            echo "::error::Drizzle migration drift detected. Run \`pnpm --filter @workspace/db exec drizzle-kit generate\` locally and commit the result."
            exit 1
          fi

      - name: Orval generated-code drift gate
        # R123-E2 (A6 P1): the codegen pipeline is reproducible again
        # (orval 8.40 + zod version:3 pin). The generated clients are
        # COMMITTED, so "edit openapi.yaml, forget codegen" must fail
        # CI exactly like the drizzle mirror above fails schema edits.
        # R191 fix (review R7-c P1): the diff now covers ALL THREE orval
        # targets — api-zod + the react twin + the native twin. The
        # codegen step always emitted all three; the gate only diffed
        # two, so native-twin drift (hand edits, emission changes) rode
        # green. The "three-target regen" claim is now literally true.
        run: |
          set -euo pipefail
          pnpm --filter @workspace/api-spec run codegen
          if ! git diff --exit-code -- shared/api-zod/src shared/api-client-react/src shared/api-client-native/src; then
            echo "::error::Orval drift detected. Run \`pnpm --filter @workspace/api-spec run codegen\` locally and commit the regenerated clients."
            exit 1
          fi

  # Mobile quality — R191's own CI leg (review R7-c P2): apps/mobile
  # carried ~35k lines with ZERO CI quality coverage while the path-
  # filter comment claimed parity ("its source must trip the heavy
  # jobs just like backend/frontend"). This leg makes the claim true:
  # typecheck + expo lint + the vitest suite, one job, same
  # if/permissions/env contract as the `tests` matrix. Runs after the
  # secret-scan/filter gates; needs nothing else (self-contained
  # install + the three scripts).
  mobile:
    name: Mobile quality (typecheck, lint, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan, filter]
    # Same docs-only skip contract as `checks`/`tests` — apps/mobile/**
    # is inside the `code` filter, so mobile pushes always run this leg.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.code == 'true'
    permissions:
      contents: read
    env:
      # Synthetic values — mirrors the sibling jobs (the mobile suite
      # stubs all network/DB interactions; the shared client's module
      # graph still reads these at import time).
      DATABASE_URL: postgres://ci:ci@localhost/ci
      SESSION_SECRET: ci-test-secret-not-real-do-not-use-in-prod
      HUSKY: "0"
      # Expo CLI hard requirements for CI: no telemetry, no prompts.
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck the mobile app
        run: pnpm --filter @workspace/mobile run typecheck

      - name: Lint the mobile app (expo lint)
        run: pnpm --filter @workspace/mobile run lint

      - name: Run the mobile vitest suite
        run: pnpm --filter @workspace/mobile run test:run

  # Unit tests — one matrix leg per suite (R127-L4 split). fail-fast:
  # false so a backend red does not cancel the frontend leg — both
  # results are signal. Same if/permissions/env contract as `checks`.
  tests:
    name: Unit tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan, filter]
    # FH-A12 F-4: skip the suites on docs-only pushes (the filter job
    # decides). Schedule and manual dispatch force a full run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.code == 'true'
    permissions:
      contents: read
    env:
      # Synthetic values — the test suites stub all DB/auth interactions.
      DATABASE_URL: postgres://ci:ci@localhost/ci
      # 32+ char synthetic value — jwt.ts rejects shorter secrets at module load.
      SESSION_SECRET: ci-test-secret-not-real-do-not-use-in-prod
      # Quiets the husky `prepare` script that runs on `pnpm install`.
      HUSKY: "0"
    strategy:
      fail-fast: false
      matrix:
        # R163: scripts joins the suite matrix — the seo-join harness
        # (R162's first @workspace/scripts tests) now runs in CI instead of
        # being a local-only gate.
        suite: [backend, frontend, scripts]

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager` field (pnpm@10.17.0);
        # action SHA-pinned to the same v4 moving-tag commit as the audit job
        # (see the note there + worklog 110-I for why not the v4.4.0 tag).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the ${{ matrix.suite }} suite (coverage)
        # Branch 007 heritage: both suites run the same vitest binary so CI
        # failures look identical regardless of which workspace introduced
        # the regression. R136 (TST-2): the suites now run the
        # test:coverage scripts — same binary, same failure shape, plus
        # the v8 report the artifact step below uploads. Coverage is
        # REPORT-ONLY BY STANDING DESIGN (R188-8, F-F4): the vitest
        # configs carry reporters only and thresholds are deliberately
        # NOT gated — the uploaded artifacts ARE the coverage record.
        # (The old "thresholds land in R137" promise never landed; it is
        # retired. Re-gating requires an explicit round decision.)
        # R163: the scripts workspace rides the same job — its harness is
        # plain `vitest run` (no coverage config; 6 tests, no DB).
        run: pnpm --filter ${{ matrix.suite == 'backend' && '@workspace/api-server' || matrix.suite == 'scripts' && '@workspace/scripts' || '@workspace/subnation' }} run ${{ matrix.suite == 'scripts' && 'test' || 'test:coverage' }}

      - name: Upload the ${{ matrix.suite }} coverage report
        # R136 (TST-2): the v8 json-summary/html report as a workflow
        # artifact — per-suite retention is 7 days (debugging aid, not a
        # compliance record). SHA-pinned like every other action here.
        # R163: scripts has no coverage output (plain vitest run) — the
        # upload step is skipped for that matrix leg.
        if: always() && matrix.suite != 'scripts'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-${{ matrix.suite }}
          path: ${{ matrix.suite == 'backend' && 'backend/coverage' || 'frontend/coverage' }}
          retention-days: 7
          if-no-files-found: warn

  # Production build — its own leg of the R127-L4 split (independent of
  # the suites; the api-server build script chains the Vite SPA build).
  build:
    name: Production build (API + Vite SPA)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [secret-scan, filter]
    # FH-A12 F-4: skip the build on docs-only pushes (the filter job
    # decides). Schedule and manual dispatch force a full run.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.code == 'true'
    permissions:
      contents: read
    env:
      # Synthetic values — mirrors the siblings (the build emits the
      # no-DSN bundle; the known CI-vs-prod budget delta is B4 NEW-1).
      DATABASE_URL: postgres://ci:ci@localhost/ci
      SESSION_SECRET: ci-test-secret-not-real-do-not-use-in-prod
      # Quiets the husky `prepare` script that runs on `pnpm install`.
      HUSKY: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup pnpm
        # Version pinned via package.json `packageManager` field (pnpm@10.17.0);
        # action SHA-pinned to the same v4 moving-tag commit as the audit job
        # (see the note there + worklog 110-I for why not the v4.4.0 tag).
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Production build (API + Vite SPA)
        # The api-server build script chains the frontend build via
        # `pnpm --dir .. --filter @workspace/subnation run build`,
        # so this single command builds the full deployable artifact.
        # The vite build embeds the bundle-budget + CSP inline-script gates.
        run: pnpm --filter @workspace/api-server run build

      - name: Boot smoke — the built shell must be bootable
        # M-2 (R142): the R141 dead shell shipped through green CI — no
        # push-time gate ever looked at the BUILT artifact (the e2e job is
        # dispatch/weekly-only). Browser-free, deterministic: assert the
        # module entry + entry stylesheet + PWA registerSW script are
        # present OUTSIDE HTML comments in the built index.html — the
        # shell-head-anchors.test.ts semantics (a swallowed tag is inert).
        run: |
          node -e '
            const { readFileSync } = require("fs");
            const live = readFileSync("frontend/dist/public/index.html", "utf8")
              .replace(/<!--[\s\S]*?-->/g, "");
            const failures = [];
            if (!/<script[^>]*type="module"[^>]*src="[^"]*\/index-[A-Za-z0-9-_]+\.js"/.test(live))
              failures.push("module entry script (index-*.js) not found outside HTML comments");
            const css = [...live.matchAll(/<link\b[^>]*>/g)].some((m) => {
              const rel = m[0].match(/\brel="([^"]*)"/)?.[1];
              const href = m[0].match(/\bhref="([^"]*)"/)?.[1];
              return rel === "stylesheet" && /\.css$/.test(href ?? "");
            });
            if (!css) failures.push("entry stylesheet link (.css) not found outside HTML comments");
            if (!/<script\b[^>]*src="\/registerSW\.js"/.test(live))
              failures.push("PWA registerSW script not found outside HTML comments");
            if (failures.length) {
              console.error("[boot-smoke] FAIL — the built shell cannot boot:");
              for (const f of failures) console.error("  - " + f);
              process.exit(1);
            }
            console.log("[boot-smoke] OK — entry module + stylesheet + registerSW live outside comments");
          '

  # ─────────────────────────────────────────────────────────────────────────
  # E2E smoke — R123-E2: the committed guest read-only Playwright suite
  # (frontend/e2e/*). Needs a RUNNING stack (E2E_BASE_URL), so the push/PR
  # gates never run it. Guest journeys only: no purchases, no topups, no
  # logins, no OTP, no admin.
  #
  # R128-IMP-4 (B5-3): the weekly schedule now includes this job — the
  # LIVE-prod leg of the guest contract had no automated heartbeat (the
  # suite was workflow_dispatch-only, and d604e67 proved the drift class
  # real: two stale contracts accumulated undetected "in rounds" until a
  # manual live run caught them). The heartbeat needs a reachable target:
  # set the repository variable E2E_BASE_URL (the guest suite is
  # production-safe by design — read-only + the documented session-scoped
  # cart-gate add). Unset, the default localhost:8080 fails the weekly
  # run loudly — configure the variable, don't silence the heartbeat.
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # R127-L4 (B9 F1/F9): this job used to hold the repo's only 3 mutable
    # action refs (@v4 moving tags) — a violation of the in-file r110 SHA
    # policy above. Now pinned to the exact SHAs the other jobs already
    # resolve to, with the siblings' permissions/HUSKY/cache hygiene.
    permissions:
      contents: read
    env:
      # Quiets the husky `prepare` script that runs on `pnpm install`
      # (same as the checks/tests/build jobs — B9 W3).
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @workspace/subnation exec playwright install --with-deps chromium
      - name: Run the guest smoke suite
        env:
          E2E_ENABLED: "1"
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || 'http://localhost:8080' }}
        run: pnpm --filter @workspace/subnation run test:e2e

  # ─────────────────────────────────────────────────────────────────────────
  # HERMETIC E2E — the guest smoke suite on EVERY push and PR
  # ─────────────────────────────────────────────────────────────────────────
  # R168-e2e: the e2e job above is the PRODUCTION heartbeat (dispatch/
  # schedule only — it probes the live deployment via vars.E2E_BASE_URL).
  # Until now NO browser-level gate ran on ordinary pushes/PRs: a runtime
  # regression could merge fully green and only surface at the weekly
  # heartbeat (the 2026-10-26 scheduled run was exactly that — red, with
  # the cart-drain label regression + the GA4 dataLayer poll flake, both
  # invisible to push CI).
  #
  # This job builds the SAME guest suite against a stack the runner owns:
  #   · a disposable postgres:16 service container;
  #   · the production build (API + Vite SPA, GA tag baked for the
  #     analytics specs, a valid-shaped BOGUS Sentry DSN — beacons 403
  #     silently; home.spec's documented transport-noise filter covers it);
  #   · APP_URL carries the PRODUCTION URL space (https://subnation.ly)
  #     so the origin-hardcoded SEO/JSON-LD assertions hold verbatim,
  #     while APP_ORIGINS also allows the localhost page origin;
  #   · the seed (scripts/src/seed.ts) mirrors the admin create flow:
  #     slugged products + deliverable inventory + one sold-out product
  #     + an enabled auth provider (SEED_ENABLE_AUTH_PROVIDERS=1).
  #
  # The suite is the SAME specs the heartbeat runs — zero forked
  # expectations. Local reproduction: the recipe is a straight script
  # (boot → wait /healthz → seed → playwright); verified end-to-end
  # before landing (144 tests × 3 projects green, incl. the re-pinned
  # cart-drain quantity + the GA4 dataLayer shape fix).
  e2e-hermetic:
    name: E2E hermetic (guest suite, local stack)
    needs: [secret-scan, filter]
    # Docs-only pushes skip (the filter job decides); dispatch and the
    # weekly schedule run it too — three chances to catch a runtime
    # regression, never zero.
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      needs.filter.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: e2e
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: subnation_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @workspace/subnation exec playwright install --with-deps chromium
      - name: Production build (GA tag baked, bogus Sentry DSN)
        env:
          # The GA4 activation surface the analytics specs pin (R168):
          # without the baked tag the loader no-ops and waitForResponse
          # times out. The Sentry DSN is valid-shaped but carries a
          # bogus key — ingest answers 403, the SDK swallows it, and
          # home.spec's transport-noise filter documents the class.
          VITE_GA_TRACKING_ID: G-RKRV3ZC3MF
          VITE_SENTRY_DSN: https://0123456789abcdef0123456789abcdef@o000000.ingest.sentry.io/0000000
        run: pnpm --filter @workspace/api-server run build
      - name: Boot the built stack (migrations run at boot)
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/subnation_e2e
          # Synthetic 32+ char secrets — jwt.ts/encryption.ts reject
          # shorter values at module load; these never leave the runner.
          SESSION_SECRET: ci-hermetic-session-secret-0123456789abcdef
          ADMIN_JWT_SECRET: ci-hermetic-admin-jwt-secret-0123456789abcd
          ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          # The production URL SPACE (canonical sitemap/JSON-LD/og URLs —
          # the specs assert these verbatim) while the runner serves on
          # localhost:8080; APP_ORIGINS admits the real page origin for
          # the CORS/CSRF gates.
          APP_URL: https://subnation.ly
          APP_ORIGINS: http://localhost:8080,https://subnation.ly
          PORT: "8080"
          NODE_ENV: production
        run: |
          cd backend
          node --enable-source-maps ./dist/index.mjs > "$RUNNER_TEMP/server.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/server.pid"
          cd ..
      - name: Wait for /healthz
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then
              echo "stack healthy after ${i}s"; exit 0
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null; then
              echo "server died during boot:"; cat "$RUNNER_TEMP/server.log"; exit 1
            fi
            sleep 1
          done
          echo "stack never became healthy:"; tail -50 "$RUNNER_TEMP/server.log"; exit 1
      - name: Seed the disposable catalog
        env:
          DATABASE_URL: postgresql://e2e:e2e@localhost:5432/subnation_e2e
          SEED_ENABLE_AUTH_PROVIDERS: "1"
          ADMIN_PASSWORD: E2eAdminPass@2026
        run: pnpm db:seed
      - name: Run the guest smoke suite (the heartbeat's own specs)
        env:
          E2E_ENABLED: "1"
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @workspace/subnation run test:e2e
      - name: Stop the stack
        if: always()
        run: kill "$(cat "$RUNNER_TEMP/server.pid")" 2>/dev/null || true
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-hermetic-failures
          path: |
            frontend/test-results/
            ${{ runner.temp }}/server.log
          retention-days: 7
          if-no-files-found: warn
