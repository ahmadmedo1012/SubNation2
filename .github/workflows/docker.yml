# R127-L4 truth pass (B9 F5 + B10): this workflow is the DISASTER-RECOVERY
# publisher for the SubNation image (linux/amd64 → GHCR
# ghcr.io/ahmadmedo1012/subnation2). It does NOT participate in production
# deploys: Coolify's push-to-deploy webhook builds every push on the VM
# itself, so nothing here runs on the per-push path.
#
# WHY IT EXISTS: the emergency rollback path pulls prebuilt, immutable
# per-commit images — FINAL_ROLLBACK_RUNBOOK.md §2: `docker pull
# ghcr.io/ahmadmedo1012/subnation2:sha-<short>`. This workflow is the only
# publisher of those tags; retiring it silently would strand the runbook.
#
# WHY AMD64-ONLY (R127-L4, B9 W2): the original R107 rationale — "the
# production target is Oracle Cloud Always Free Ampere A1 (ARM64)" — has
# been dead since the 2026-10 Contabo cutover (production host: Contabo,
# amd64 — FINAL_PRODUCTION_TOPOLOGY.md). Nothing consumes arm64 subnation2
# images, so the QEMU-emulated arm64 leg (~15-25 min per publish, the
# historically flaky leg the fail-fast:false matrix existed to contain) was
# dropped. Re-adding a platform = restore the matrix entry + the QEMU step
# below; the merge job's registry probe already handles a missing arch.
#
# TRIGGERS — deliberately NOT every push:
#   - workflow_dispatch (manual, from the Actions tab)
#   - version tags v* (release artifacts)
# R122 (premise corrected): this was originally written when the repo was
# PRIVATE with metered Actions minutes. The repo is PUBLIC now (minutes
# free), but the manual/tag-only trigger discipline stays: publishing on
# every push would add nothing over Coolify's own VM build.
#
# STRUCTURE (r110, closes R109 109-j P2-2 — one buildx invocation per
# platform, so a failed leg can no longer take the others' publish down):
#
#   build-and-push — builds and pushes arch-suffixed tags (docker/
#     metadata-action flavor suffix):
#       sha-<short>-amd64   (immutable, per-commit)
#       1.2.3-amd64, 1.2-amd64, latest-amd64, <branch>-amd64  (when
#       those semantic tags apply).
#
#   merge — needs the legs but runs `if: !cancelled()`, probes GHCR for the
#     arch tags that ACTUALLY landed, and assembles the canonical tags with
#     `docker buildx imagetools create -t <canonical> …`:
#       sha-<short>  1.2.3  1.2  latest  <branch>
#     amd64 is the primary publish target: if its image is missing the merge
#     fails and NO canonical tag is minted. Previously-published sha-<short>
#     tags are immutable and are never retro-fitted.
#
# STATUS (R127-L4, verified 2026-10-09 — replaces the standing "NOT YET
# VERIFIED" banner): NO completed publish is on record. The
# v0.0.1-coolify-test tag (2026-10-01, 47b304e) matched the v* trigger, but
# Actions was disabled at the time (FINAL_ROLLBACK_RUNBOOK.md §2,
# re-verified 2026-10-01: "NO subnation2 GHCR image exists for any
# commit"), and no manual dispatch has been recorded since the repo went
# public (R122). An anonymous registry probe on 2026-10-09 could neither
# confirm nor deny the package (403 on every tag — private-or-absent; the
# PUBLIC openwa package answers the same probe with 200). OPERATOR STEP
# before relying on the rollback runbook's §2 image path: dispatch this
# workflow once on main, then verify the sha-<short> tag landed in GHCR
# (needs a read:packages PAT — the package is private). Until then §2's
# image fallback is openwa-only, exactly as the runbook already documents.
name: Docker Image (GHCR, amd64)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to build (defaults to the selected branch)"
        required: false
        default: ""
  push:
    tags: ["v*"]

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

# R127-L4 (B9 F2, zizmor excessive-permissions): packages:write was
# workflow-level — any future job added to this file would have inherited
# registry write. Now granted ONLY on the two jobs that push/merge tags;
# the workflow-level default stays least-privilege read-only.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Repo owner/name in lowercase is required by GHCR image naming.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    name: Build and push (${{ matrix.arch }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      # R109 P2-2 heritage: legs publish independently so a failed platform
      # could never cancel the others. R127-L4: arm64 dropped (no consumer —
      # see the header); the matrix SHAPE stays so re-adding a platform is a
      # one-line change plus the QEMU step.
      fail-fast: false
      matrix:
        platform: [linux/amd64]
        include:
          - platform: linux/amd64
            arch: amd64
    steps:
      - name: Checkout
        # SHA-pinned (r110, 109-p P2); kept on the v4 line this job already
        # used — ci.yml is on v5.1.0, unify deliberately if desired.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          # R127-L4 (B9 F3, zizmor artipacked): the token never persists
          # into the workspace git config — GHCR login is its own step.
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag rules as always, but EVERY tag gets a -<arch> suffix here
      # (flavor): sha-<short>-<arch>, 1.2.3-<arch>, 1.2-<arch>,
      # latest-<arch>, <branch>-<arch>. The canonical un-suffixed tags are
      # minted by the merge job below.
      - name: Docker metadata (arch-suffixed tags + labels)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            suffix=-${{ matrix.arch }}
          tags: |
            # semantic tags: v1.2.3 → 1.2.3-<arch>, 1.2-<arch>, latest-<arch>
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            # manual runs tag with the short SHA
            type=sha,prefix=sha-
            # branch builds (manual dispatch on main)
            type=ref,event=branch

      - name: Build and push (${{ matrix.arch }} leg only)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # NOTE (single-origin contract): every VITE_* API/socket var stays
          # EMPTY — the image's SPA speaks relative /api paths to whatever
          # origin serves it. Public VITE_ vars (Sentry DSN, Firebase, GA)
          # are intentionally NOT baked here either: pass them in the
          # Coolify build environment when you want per-environment control,
          # or fork this step with the extra build-args.
          # Per-arch cache scope: keeps each platform's cache independent
          # if a second leg is ever restored (concurrent legs must not
          # thrash a single shared gha scope).
          cache-from: type=gha,scope=multi-arch-${{ matrix.arch }}
          cache-to: type=gha,scope=multi-arch-${{ matrix.arch }},mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Merge: assemble the canonical tags from whatever landed.
  # ─────────────────────────────────────────────────────────────────────────
  merge:
    name: Merge canonical tags (imagetools)
    needs: [build-and-push]
    # Run even when a leg failed — the merge decides from the REGISTRY which
    # platforms are available (race-free: the legs have finished by then).
    # !cancelled() so a manually cancelled run pushes no half tag set.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx (imagetools CLI)
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Identical tag rules to the legs but WITHOUT the arch suffix — these
      # are the canonical tags consumers pull: sha-<short>, 1.2.3, 1.2,
      # latest, <branch>.
      - name: Docker metadata (canonical tags)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern=latest
            type=sha,prefix=sha-
            type=ref,event=branch

      - name: Merge landed platforms into the canonical tags
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail

          # GHCR wants the lowercase image name for the source probes
          # (metadata-action already lowercases its own outputs).
          image="${REGISTRY}/${IMAGE_NAME,,}"

          # Per-commit arch tags pushed by the legs: sha-<short>-<arch>.
          sha_tag="$(printf '%s\n' "$TAGS" | grep -oE 'sha-[0-9a-f]+' | head -1)"
          if [ -z "$sha_tag" ]; then
            echo "::error::metadata produced no sha- tag; cannot locate the per-arch images."
            exit 1
          fi
          amd64_src="${image}:${sha_tag}-amd64"
          arm64_src="${image}:${sha_tag}-arm64"

          amd64_ok=0
          arm64_ok=0
          if docker buildx imagetools inspect "$amd64_src" >/dev/null 2>&1; then
            amd64_ok=1
          fi
          if docker buildx imagetools inspect "$arm64_src" >/dev/null 2>&1; then
            arm64_ok=1
          fi

          # amd64 is the primary publish target — without it there is nothing
          # canonical to publish. (The failed leg already turned the workflow
          # red; keep it red and leave previously-published tags untouched.)
          if [ "$amd64_ok" -ne 1 ]; then
            echo "::error::amd64 image ${amd64_src} is missing in GHCR — primary platform build failed; canonical tags NOT created."
            exit 1
          fi

          sources=("$amd64_src")
          if [ "$arm64_ok" -eq 1 ]; then
            sources+=("$arm64_src")
          else
            echo "::warning::arm64 image ${arm64_src} not present in GHCR — canonical tags below are amd64-only (expected while the arm64 leg is retired, R127-L4). It rejoins automatically on the next green arm64 build; immutable sha- tags are never retro-fitted."
          fi

          tag_args=()
          for t in $TAGS; do
            tag_args+=(-t "$t")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"

          echo "Canonical tags now point at:"
          docker buildx imagetools inspect "${image}:${sha_tag}" || true
