# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), add a short-lived
# `minimumReleaseAgeExclude` allowlist and remove it once the package ages out.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - backend
  - frontend
  - shared/*
  - scripts

catalog:
  "@tailwindcss/vite": ^4.3.3
  "@tanstack/react-query": ^5.104.4
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.4
  lucide-react: ^0.545.0
  # AUD103-7-C5 (r103): comment honesty — there is NO expo anywhere in
  # this workspace; the real reason for the exact pin is single-version
  # discipline across FE + shared packages (an unpinned react lets a
  # transitive dep silently drag a second copy into the bundle).
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.3.3
  tsx: ^4.21.0
  vite: ^7.3.7
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - esbuild

overrides:
  # ============================================================================
  # R119-B3 (audit A4 F-7): SINGLE HOME for every override. The mission W7
  # hardening (f717c6f) added its security floors to package.json
  # pnpm.overrides — which made pnpm 10 SILENTLY IGNORE this workspace file,
  # deactivating the four pre-existing pins below (esbuild-kit, esbuild,
  # websocket-driver, path-to-regexp). All overrides now live HERE and
  # package.json carries none.
  # ============================================================================
  #
  # ── Security floors (CI CVE gate blocks on critical --prod findings) ──
  #
  # postcss — R144-A2: 4 advisories (GHSA-class: 2× high file-read/info
  #   disclosure via source-map autoload + XSS stringify, 2× moderate) ride
  #   the vite chain (backend>vite>postcss, frontend paths). vite 7.3.7's
  #   own range is ^8.5.6, but the lockfile-first install kept the stale
  #   8.5.8 resolution; this floor forces >=8.5.23 (all four patched
  #   floors: 8.5.10/8.5.12/8.5.18/8.5.23), fully in-range for vite.
  "postcss": ">=8.5.23"
  # proxy-addr — GHSA-jqcg-44mw-7w3h (CRITICAL, R119-A4 F-1): crafted Fo:X
  #   forwarded-for chains poison req.ip when `trust proxy` is set (it is —
  #   app.ts), which keys every rate limiter → spoofing = limiter evasion.
  #   Transitive via express; the patched 2.0.8 is in-range (^2.0.7).
  "proxy-addr": ">=2.0.8"
  # qs — GHSA-q8mj / GHSA-x5fp / GHSA-4mjr (3× moderate, R119-A4 F-2): DoS
  #   class in the express query parser. Transitive via express; patched
  #   6.16.0 is in-range (^6.14.0).
  "qs": ">=6.16.0"
  # body-parser — GHSA-v422-hmwv-36x6 (low; not reachable with our valid
  #   "1mb" limit — free in-range floor anyway).
  "body-parser": ">=2.3.0"
  # ip-address — raised from W7's ^10.3.1: GHSA-j6r3 + GHSA-h3mg (2×
  #   moderate) are patched in 10.7.1, which W7's floor let slip through
  #   (R119-A4 F-5). Transitive via express-rate-limit.
  "ip-address": "^10.7.1"
  # @opentelemetry/core — GHSA-8988-4f7v-96qf (moderate) via @sentry/node's
  #   telemetry chain; 2.8.0 is inside the accepted peer range.
  "@opentelemetry/core": "^2.8.0"
  # ── R123-E5 (A5 P3-1): the CVE-2026-104872 / GHSA-qqmp-wf37-98f9 family ──
  # Six @opentelemetry/instrumentation-* DB drivers (pulled by @sentry/node's
  # @opentelemetry/instrumentation umbrella) expose the database username as
  # an unconditional `db.user` span attribute — with telemetry configured
  # (Sentry is), that ships the DB credential material to the telemetry
  # backend. Only instrumentation-pg is plausibly ACTIVE in this pg-only app
  # (the other five drivers never match a `pg`-only runtime), but all six
  # are pinned defensively per the audit. Fixed versions verified against
  # the r123-a5 pnpm-audit/trivy/osv artifacts; every pin was published
  # 2026-07-23, so minimumReleaseAge 1440 is satisfied naturally (no
  # allowlist entry needed). The two remaining --prod advisories are
  # accepted and documented: node-forge 1.4.0 CVE-2026-85393 (firebase-admin;
  # no fixed release exists, reachability verified NIL) and uuid
  # CVE-2026-41907 (google-gax; vulnerable API unused).
  "@opentelemetry/instrumentation-knex": "0.65.0"
  "@opentelemetry/instrumentation-mongoose": "0.67.0"
  "@opentelemetry/instrumentation-mysql": "0.67.0"
  "@opentelemetry/instrumentation-mysql2": "0.67.0"
  "@opentelemetry/instrumentation-pg": "0.73.0"
  "@opentelemetry/instrumentation-tedious": "0.40.0"
  # ── Mission W7 supply-chain floors (2026-10-05, restored here R119) ──
  # protobufjs 7.6.6 (prototype pollution), ws >=8.21 (DoS),
  # @fastify/busboy ^3.2.1 + form-data ^4.0.6 (multipart parsing),
  # brace-expansion ^2.1.6 (ReDoS), @grpc/grpc-js ^1.14.5.
  "@fastify/busboy": "^3.2.1"
  "@grpc/grpc-js": "^1.14.5"
  "brace-expansion": "^2.1.6"
  "form-data": "^4.0.6"
  "protobufjs": "^7.6.1"
  "ws": ">=8.21.0"
  # ── Pre-W7 pins (R109-era; were silently dead since f717c6f — restored) ──
  # R109 P0-2: the old platform-exclusion block ("local deployment target is
  # linux-x64") removed EVERY non-x64-linux optional native build from the
  # lockfile — including linux-arm64-gnu/musl and linux-x64-musl. The ARM64
  # target (originally the Oracle A1; live host since 2026-10 = a Contabo
  # VPS, per the R117 live probe — ARM64 variants stay in the lock as
  # multi-arch insurance) is ARM64 Alpine (musl): vite build + the backend
  # esbuild bundle had NO matching natives in the lock, so any arm64 (and
  # even x64-Alpine) docker build failed at the toolchain step. Removing the
  # exclusions lets pnpm-lock.yaml carry all platform variants again
  # (verified post-regen: @esbuild/linux-arm64, @rollup/rollup-linux-arm64-*
  # /musl, @tailwindcss/oxide-linux-arm64-*, lightningcss-linux-arm64-*, and
  # the x64-musl variants are all present).
  # drizzle-kit uses esbuild internally on an older version that's
  # vulnerable, this overrides it (R144-A2: exact pin raised 0.27.3 →
  # 0.27.7 alongside the backend direct dep — tsx ~0.27.0 and vite
  # ^0.27.0 || ^0.28.0 both accept it). R169: raised 0.27.7 → 0.28.2 —
  # GHSA-g7r4-m6w7-qqqr (low, arbitrary file read) patched >=0.28.1;
  # backend's direct devDep moves with it.
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.28.2"
  # websocket-driver — GHSA-xv26-6w52-cph6 (critical): message corruption
  #   via protocol length headers. Transitive via firebase → @firebase/
  #   database → faye-websocket; currently resolves 0.7.5 naturally — this
  #   floor keeps it pinned against range drift.
  "websocket-driver": ">=0.7.5"
  # ── R169 dev-chain CVE floors (all DEV-side; --prod audit was already
  # clean — these close the pnpm audit (dev) findings that are fixable
  # without a major jump; every pin is the minimal patched release and
  # each is verified by the gate that exercises its chain) ──
  # fast-uri — 7 high advisories (SSRF/host-confusion/path-traversal
  #   family) under vite-plugin-pwa>workbox-build>ajv; 3.1.0 → 3.1.8
  #   (in-range 3.x). Verified by: pnpm build (workbox SW generation).
  "fast-uri": "3.1.8"
  # source-map-js — high (event-loop DoS) under @vitest/coverage-v8>
  #   magicast; 1.2.1 → 1.2.2 (in-range 1.x). Verified by: vitest runs.
  "source-map-js": "1.2.2"
  # fflate — moderate (unzipSync infinite loop) under @vitest/ui;
  #   0.8.2 → 0.8.3. Verified by: vitest runs.
  "fflate": "0.8.3"
  # fast-copy — moderate (stack exhaustion) under pino-pretty;
  #   4.0.2 → 4.1.0 (in-range ^4). Verified by: install + typecheck
  #   (backend dev logging path).
  "fast-copy": "4.1.0"
  # lodash — high (Code Injection via _.template) + moderate (prototype
  #   pollution) under @lhci/cli>inquirer; 4.17.23 → 4.18.1 (in-range
  #   4.x, the 2026 patch line). @lhci/cli never runs on CI — local
  #   tooling only (R119 precedent: accepted-dev-risk class).
  "lodash": "4.18.1"
  # @babel/core — low (arbitrary file read via sourceMappingURL) under
  #   eslint-plugin-react-hooks; 7.29.0 → 7.29.6 (in-range 7.x — NOT
  #   8.x). Verified by: pnpm lint.
  "@babel/core": "7.29.6"
  # browserslist — 2 high (crash/prototype write + unbounded memory)
  #   + baseline-browser-mapping (moderate, process termination) under
  #   the eslint @babel chain; 4.28.1 → 4.28.7 and 2.10.0 → 2.11.0
  #   (in-range). Verified by: pnpm lint. (caniuse-lite DATA refresh
  #   rides update-browserslist-db, separate from this package floor.)
  "browserslist": "4.28.7"
  "baseline-browser-mapping": "2.11.0"
  # picomatch — 2 high (ReDoS extglob + method injection) under
  #   @sentry/vite-plugin>unplugin>chokidar 3; SCOPED to the ^2.3.1
  #   resolution only (the 4.x resolution elsewhere is current);
  #   2.3.1 → 2.3.2. Verified by: pnpm build (sentry plugin path).
  "picomatch@^2.3.1": "2.3.2"
  # postcss-selector-parser — moderate (quadratic-time flat selector
  #   parsing) under @tailwindcss/typography; 6.0.10 → 7.1.6 (the
  #   continued maintenance line — 7.x is what tailwindcss itself
  #   resolves). Verified by: pnpm build (CSS generation path).
  "postcss-selector-parser": "7.1.6"
  # NOTE (R119-B3): the historical "path-to-regexp": ">=8.4.0" override is
  # deliberately NOT restored: the express-5 chain already resolves the
  # patched 8.4.2 naturally (the override was written when 8.3.0 was
  # current), and forcing >=8.4.0 globally would break @lhci/cli's
  # express@4 (scripts/validate.ts check 43.2 — Lighthouse — depends on it;
  # the A4 "unused" claim was disproven by that usage). @lhci's dev-only
  # express@4 chain advisories are accepted risk: they never enter the
  # Docker runtime image (root devDeps are pruned by --prod --filter) and
  # never run on CI (no runner).
