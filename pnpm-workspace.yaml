# ============================================================================
# SECURITY: Minimum release age for npm packages (supply-chain attack defense)
# ============================================================================
#
# This setting requires that any npm package version must have been published
# for at least 1 day (1440 minutes) before pnpm will allow installing it.
# This is a critical defense against supply-chain attacks. In most cases,
# malicious npm releases are discovered and pulled within hours, so a 1-day
# delay provides a strong safety buffer.
#
# DO NOT DISABLE THIS SETTING. Removing or setting it to 0 is considered
# extremely dangerous and leaves the entire workspace vulnerable to supply-
# chain attacks, which have been the #1 vector for npm ecosystem compromises.
#
# If you absolutely need to install a package before the 1-day window has
# passed (e.g. an urgent security bugfix), add a short-lived
# `minimumReleaseAgeExclude` allowlist and remove it once the package ages out.
#
# Example:
#   minimumReleaseAgeExclude:
#     - react
#     - typescript
#
# ============================================================================
minimumReleaseAge: 1440

packages:
  - backend
  - frontend
  - shared/*
  - scripts

catalog:
  "@tailwindcss/vite": ^4.1.14
  "@tanstack/react-query": ^5.90.21
  "@types/node": ^25.3.3
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0
  "@vitejs/plugin-react": ^5.0.4
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  drizzle-orm: ^0.45.2
  lucide-react: ^0.545.0
  # AUD103-7-C5 (r103): comment honesty — there is NO expo anywhere in
  # this workspace; the real reason for the exact pin is single-version
  # discipline across FE + shared packages (an unpinned react lets a
  # transitive dep silently drag a second copy into the bundle).
  react: 19.1.0
  react-dom: 19.1.0
  tailwind-merge: ^3.3.1
  tailwindcss: ^4.1.14
  tsx: ^4.21.0
  vite: ^7.3.2
  wouter: ^3.3.5
  zod: ^3.25.76

autoInstallPeers: false

onlyBuiltDependencies:
  - "@swc/core"
  - esbuild
  - msw
  - unrs-resolver

overrides:
  # R109 P0-2: the old platform-exclusion block ("local deployment target is
  # linux-x64") removed EVERY non-x64-linux optional native build from the
  # lockfile — including linux-arm64-gnu/musl and linux-x64-musl. The Oracle
  # ARM64 target (originally the Oracle A1; live host since 2026-10 = a
  # Contabo VM, per the R117 live probe — ARM64 variants stay in the lock as
  # multi-arch insurance) is ARM64 Alpine (musl): vite build + the backend
  # esbuild bundle
  # had NO matching natives in the lock, so any arm64 (and even x64-Alpine)
  # docker build failed at the toolchain step. Removing the exclusions lets
  # pnpm-lock.yaml carry all platform variants again (verified post-regen:
  # @esbuild/linux-arm64, @rollup/rollup-linux-arm64-gnu/musl,
  # @tailwindcss/oxide-linux-arm64-*, lightningcss-linux-arm64-*, and the
  # x64-musl variants are all present).
  # Kept below: the version/security overrides that are unrelated to platforms.
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  # ── Security overrides (CI CVE gate blocks on critical --prod findings) ──
  # websocket-driver — GHSA-xv26-6w52-cph6 (critical): message corruption via
  #   protocol length headers. Transitive via firebase → @firebase/database →
  #   faye-websocket, whose own range (>=0.5.1) accepts the patched release.
  # path-to-regexp — DoS via sequential optional groups (high) in the express
  #   5 router chain; 8.3.0 was the only version in the tree, so nothing older
  #   is disturbed by forcing the patched line.
  "websocket-driver": ">=0.7.5"
  "path-to-regexp": ">=8.4.0"
