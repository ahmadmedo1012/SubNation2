services:
  - type: web
    name: subnation
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    # Deploys are gated on green CI via .github/workflows/deploy.yml
    # (workflow_run + conclusion check). Keep this false — Render's native
    # autodeploy would bypass the CI gate and ship red-CI commits.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render Dashboard (Neon / Postgres connection string). Do not commit secrets.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        value: "15"
      - key: DB_IDLE_TIMEOUT_MS
        value: "10000"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: SESSION_SECRET
        sync: false
      # F-001 (security audit 004) — admin JWT signing key MUST be a
      # distinct env var, not derived from SESSION_SECRET. Set in Render
      # dashboard with a value generated by `openssl rand -base64 64 | tr -d '\n'`
      # AND distinct from SESSION_SECRET (the boot validator rejects equal values).
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        value: "https://subnation.ly"
      - key: APP_ORIGINS
        # Canonical apex + www. Pre-launch state: no legacy origin
        # compatibility — the platform is still in development.
        value: "https://subnation.ly,https://www.subnation.ly"
      # Absolute origin used to build deep-links inside admin alerts and
      # copilot/enrichment/forecast panel references. Same value as APP_URL;
      # kept separate so alert links survive an APP_URL change.
      - key: APP_ORIGIN
        value: "https://subnation.ly"
      - key: VITE_API_URL
        value: "https://subnation.ly"
      - key: VITE_APP_ORIGIN
        value: "https://subnation.ly"
      - key: BASE_PATH
        value: /
      - key: VITE_APP_NAME
        value: SubNation
      # Google Search Console site-verification token (HTML tag method).
      # Operator-set in Render Dashboard: Settings → Environment → Add
      # Environment Variable → VITE_GSC_VERIFICATION = <token from
      # search.google.com/search-console>. Empty when unset = harmless;
      # Search Console simply fails ownership detection until set.
      - key: VITE_GSC_VERIFICATION
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: VITE_GOOGLE_CLIENT_ID
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: "subnation-2571e"
      - key: FIREBASE_AUTH_ENABLED
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VITE_FIREBASE_AUTH_ENABLED
        value: "true"
      # Firebase web client config: set in Dashboard (same values as local .env / Vite).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      # Google Analytics 4 Measurement ID. Public value (G-XXXXXXXXXX),
      # safe to commit, but kept sync:false so each environment (preview
      # vs production) can point at its own GA stream without forcing a
      # render.yaml edit. Empty value disables the GA loader entirely
      # (the no-op default in frontend/src/lib/analytics.ts).
      - key: VITE_GA_TRACKING_ID
        sync: false
      # ── WhatsApp OTP gateway (openwa-gateway service) ───────────────────
      # The gateway is a SEPARATE Render web service built from the
      # ahmadmedo1012/openwa repo:
      #   srv-da6piju7bikc739anbtg → https://openwa-gateway-7aaa.onrender.com
      # Its OPENWA_API_KEY must match WHATSAPP_OTP_API_KEY here. Session
      # credentials are persisted by the current gateway when its persistence
      # connection is configured; verify that setting on the gateway service
      # before relying on redeploy recovery. A keep-alive workflow in the
      # public github.com/ahmadmedo1012/keep-alive repo pings both services
      # every 10 minutes so free-tier instances never idle-spin-down.
      - key: WHATSAPP_OTP_BASE_URL
        sync: false
      - key: WHATSAPP_OTP_API_KEY
        sync: false
      - key: WHATSAPP_OTP_SESSION
        value: "subnation-otp"
      - key: WHATSAPP_OTP_AUTO_CREATE_SESSION
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Telegram approval-gateway webhook (port of the smart-menu pattern).
      # Secret must match the value passed to setWebhook's secret_token.
      # TELEGRAM_ADMIN_IDS = comma-separated personal Telegram IDs allowed to
      # press the approve/reject buttons (bootstrap: send /start to the bot,
      # it replies with your IDs).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: "false"
      # Backend Sentry DSN. Set in Render Dashboard → Environment with
      # the value from the Sentry project page:
      #   https://11936f1c161b16bd27a9439dd2ce30ca@o4511397349097472.ingest.de.sentry.io/4511414239559760
      # IMPORTANT: this MUST be sync:false (not generateValue:true) —
      # a Render-generated random string is not a valid Sentry DSN.
      - key: SENTRY_DSN
        sync: false
      # Trace sampling rate. Production default is 0.1 (10% of
      # transactions). Bump to 1.0 for a release window when investigating
      # regressions; revert immediately to avoid burning quota.
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0.1"
      # Slow-query threshold in ms. Queries above this are warn-logged +
      # surface in pg_query_duration_seconds histogram with slow="1".
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "250"
      - key: VITE_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: METRICS_ADMIN_TOKEN
        sync: false
      - key: ALERTING_ENABLED
        value: "false"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: GENERIC_ALERT_WEBHOOK_URL
        sync: false
      # --- AI Admin Copilot (010) + Catalog Enrichment (012) --------------
      # The LLM client speaks the OpenAI-compatible protocol (OpenRouter /
      # NVIDIA / any compatible gateway). All four keys below are REQUIRED
      # as a set for the admin copilot UI and for the enrichment runner to
      # produce drafts; leaving them unset keeps both features cleanly
      # disabled (copilot replies "unavailable", runner refuses to start).
      # Set them in the Render Dashboard when enabling AI features.
      - key: COPILOT_PROVIDER
        sync: false
      - key: COPILOT_API_KEY
        sync: false
      - key: COPILOT_MODEL
        sync: false
      - key: COPILOT_BASE_URL
        sync: false
      # Enrichment cron (012). The runner additionally refuses to run unless
      # WORKER_TIER=true — i.e. only after the subnation-worker tier below is
      # actually provisioned AND carries WORKER_TIER=true (see its comment).
      # Until then these placeholders are inert documentation.
      - key: ENRICHMENT_RUNNER_ENABLED
        value: "false"
      - key: ENRICHMENT_DAILY_TOKEN_CAP
        sync: false
      - key: ENRICHMENT_PER_RUN_CAP
        sync: false
      # Inventory demand forecast cron (011). Same tier rule as enrichment.
      - key: FORECAST_RUNNER_ENABLED
        value: "false"
      # Migration switch for the worker tier. Today the web process runs
      # the heartbeat + alerting evaluator + cron under a Redis-backed
      # leader lock. To split tiers you must do BOTH of these together:
      #   1. Provision `subnation-worker` below (Render Dashboard →
      #      Apply Blueprint / create from yaml), then set on the WEB
      #      service: DISABLE_WEB_SCHEDULERS=true.
      #   2. Set on the WORKER service: WORKER_TIER=true (+ its own
      #      SENTRY_DSN / TELEGRAM_* / DISCORD_WEBHOOK_URL so alerting
      #      works from the worker tier too).
      # Flipping only one side either stops all crons (no worker running
      # them) or double-runs them (both tiers racing under the leader
      # lock — harmless but wasteful).
      - key: DISABLE_WEB_SCHEDULERS
        value: "false"
      # Operator escape hatch for the boot-time migration runner. When
      # `true`, server.ts skips runMigrations() entirely on cold start.
      # Use ONLY for emergency rollbacks where the migration shipped in
      # a release is broken and you need to bring up the previous binary
      # against the newer schema. Default `false` — every cold start
      # reconciles schema (idempotent, lock-protected). Owner sets this
      # transiently in the dashboard, redeploys, then unsets it.
      - key: DISABLE_BOOT_MIGRATIONS
        value: "false"
      - key: REDIS_URL
        fromService:
          type: redis
          name: subnation-redis
          property: connectionString

  - type: redis
    name: subnation-redis
    plan: free
    ipAllowList: []
    maxmemoryPolicy: allkeys-lru

  - type: worker
    name: subnation-worker
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: "pnpm --filter @workspace/api-server start:worker"
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # DORMANT BY DESIGN: this service only takes over cron + alerting when
      # BOTH of the following are true (see the DISABLE_WEB_SCHEDULERS comment
      # on the web service for the full flip procedure):
      #   - here: WORKER_TIER=true (+ WORKER_TIER_ID=worker for run records)
      #   - web:  DISABLE_WEB_SCHEDULERS=true
      # While the worker is not provisioned, the web tier owns all schedulers.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: subnation-redis
          property: connectionString
