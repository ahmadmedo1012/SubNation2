services:
  # 2026-09-20 (free-infrastructure round): plan pinned to FREE.
  # Render Free spins the web service down after ~15 min without
  # inbound traffic — this is ACCEPTED by design (no keep-alive, no
  # self-ping, no external pingers; the early-bind gate answers 503
  # "starting" during cold-start bootstrap and the frontend retries).
  # NOTE: switching an EXISTING Render service from a paid plan to free
  # is a dashboard action (Settings → Instance Type → Free); this
  # blueprint entry keeps `Apply Blueprint` from ever re-creating a
  # paid instance.
  - type: web
    name: subnation
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    # Deploys are gated on green CI via .github/workflows/deploy.yml
    # (workflow_run + conclusion check). Keep this false — Render's native
    # autodeploy would bypass the CI gate and ship red-CI commits.
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      # Set in the Render Dashboard (Neon / Postgres connection string). Do not commit secrets.
      - key: DATABASE_URL
        sync: false
      - key: DB_POOL_MAX
        # 2026-09-20: 15 → 8. Neon Free compute is 0.25 CU — a 15-connection
        # burst on a freshly-woken compute queues behind a fraction of that
        # capacity. 8 covers peak request concurrency comfortably while
        # halving the cold-start connection storm.
        value: "8"
      - key: DB_IDLE_TIMEOUT_MS
        value: "10000"
      - key: DB_CONNECTION_TIMEOUT_MS
        value: "30000"
      - key: SESSION_SECRET
        sync: false
      # F-001 (security audit 004) — admin JWT signing key MUST be a
      # distinct env var, not derived from SESSION_SECRET. Set in Render
      # dashboard with a value generated by `openssl rand -base64 64 | tr -d '\n'`
      # AND distinct from SESSION_SECRET (the boot validator rejects equal values).
      - key: ADMIN_JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        value: "https://subnation.ly"
      - key: APP_ORIGINS
        # Canonical apex + www. Pre-launch state: no legacy origin
        # compatibility — the platform is still in development.
        value: "https://subnation.ly,https://www.subnation.ly"
      # Add the deployed Vercel origin here (or in FRONTEND_ORIGINS) before
      # switching browser traffic to Vercel. Keep exact origins only; do not
      # use a wildcard. These values are read by CORS, CSRF and Socket.IO.
      # sync:true is safe here — this is a public URL (CORS allow-list), not
      # a secret. sync:false would make the value disappear on every blueprint
      # re-apply; the deploy hook would then see an empty origin and CORS
      # would 403 the Vercel SPA. Keep secrets (API keys, tokens) on
      # sync:false — those live in the Render dashboard only.
      - key: VERCEL_FRONTEND_ORIGIN
        value: "https://subnation-seven.vercel.app"
        sync: true
      - key: FRONTEND_ORIGINS
        sync: false
      # Required when the browser origin differs from the Render API origin.
      # Secure is enforced automatically in production.
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      # Absolute origin used to build deep-links inside admin alerts and
      # copilot/enrichment/forecast panel references. Same value as APP_URL;
      # kept separate so alert links survive an APP_URL change.
      - key: APP_ORIGIN
        value: "https://subnation.ly"
      - key: VITE_API_BASE_URL
        value: "https://subnation2.onrender.com"
      - key: VITE_SOCKET_URL
        value: "https://subnation2.onrender.com"
      # Backward-compatible alias for older frontend bundles.
      - key: VITE_API_URL
        value: "https://subnation2.onrender.com"
      - key: VITE_APP_ORIGIN
        value: "https://subnation.ly"
      - key: BASE_PATH
        value: /
      - key: VITE_APP_NAME
        value: SubNation
      # Google Search Console site-verification token (HTML tag method).
      # Operator-set in Render Dashboard: Settings → Environment → Add
      # Environment Variable → VITE_GSC_VERIFICATION = <token from
      # search.google.com/search-console>. Empty when unset = harmless;
      # Search Console simply fails ownership detection until set.
      - key: VITE_GSC_VERIFICATION
        sync: false
      - key: GOOGLE_CLIENT_ID
        value: ""
      - key: VITE_GOOGLE_CLIENT_ID
        value: ""
      - key: FIREBASE_PROJECT_ID
        value: "subnation-2571e"
      - key: FIREBASE_AUTH_ENABLED
        value: "true"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: VITE_FIREBASE_AUTH_ENABLED
        value: "true"
      # Firebase web client config: set in Dashboard (same values as local .env / Vite).
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_MEASUREMENT_ID
        sync: false
      - key: VITE_FIREBASE_DATABASE_URL
        sync: false
      # Google Analytics 4 Measurement ID. Public value (G-XXXXXXXXXX),
      # safe to commit, but kept sync:false so each environment (preview
      # vs production) can point at its own GA stream without forcing a
      # render.yaml edit. Empty value disables the GA loader entirely
      # (the no-op default in frontend/src/lib/analytics.ts).
      - key: VITE_GA_TRACKING_ID
        sync: false
      # ── WhatsApp OTP gateway (openwa-gateway service) ───────────────────
      # The gateway is a SEPARATE Render web service built from the
      # ahmadmedo1012/openwa repo:
      #   srv-da6piju7bikc739anbtg → https://openwa-gateway-7aaa.onrender.com
      # Its OPENWA_API_KEY must match WHATSAPP_OTP_API_KEY here. Session
      # credentials are persisted in Neon when PERSISTENCE_URL is configured
      # on that separate gateway service (use the same Neon URL as DATABASE_URL)
      # and OPENWA_API_KEY is set. Verify those two settings before relying on
      # redeploy recovery.
      #
      # 2026-09-20 (free-infrastructure round): the gateway self-ping and
      # ALL external keep-alive pings (GitHub Actions / in-process cron)
      # are REMOVED everywhere. The gateway sleeps when idle — the first
      # user-driven WhatsApp request wakes it (session auto-restore from
      # persistence runs at boot inside the gateway; the OTP path retries
      # within its bounded budget and the frontend surfaces an honest
      # «جاري تجهيز الاتصال…» state with retry).
      - key: WHATSAPP_OTP_BASE_URL
        sync: false
      - key: WHATSAPP_OTP_API_KEY
        sync: false
      - key: WHATSAPP_OTP_SESSION
        value: "subnation-otp"
      - key: WHATSAPP_OTP_AUTO_CREATE_SESSION
        value: "true"
      # 97 (round-97, operator-activated 2026-09-11): the operator's own
      # linked WhatsApp number in E.164 digits (no '+'). 2026-09-20 note:
      # the 6-hourly warm-up self-message loop was REMOVED — the warm-up
      # self-check now runs ONE-SHOT per pairing epoch, triggered by the
      # first REAL ready observation (a user's readiness probe or OTP
      # attempt). Still the number the pairing code is issued for when
      # re-linking is needed. Not a secret (it is the OTP sender
      # identity anyway).
      - key: WHATSAPP_OTP_OPERATOR_E164
        value: "218910089975"
        sync: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # Telegram approval-gateway webhook (port of the smart-menu pattern).
      # Secret must match the value passed to setWebhook's secret_token.
      # TELEGRAM_ADMIN_IDS = comma-separated personal Telegram IDs allowed to
      # press the approve/reject buttons (bootstrap: send /start to the bot,
      # it replies with your IDs).
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_RESET_PASSWORD
        value: "false"
      # Backend Sentry DSN. Set in Render Dashboard → Environment with
      # the value from the Sentry project page:
      #   https://11936f1c161b16bd27a9439dd2ce30ca@o4511397349097472.ingest.de.sentry.io/4511414239559760
      # IMPORTANT: this MUST be sync:false (not generateValue:true) —
      # a Render-generated random string is not a valid Sentry DSN.
      - key: SENTRY_DSN
        sync: false
      # Trace sampling rate. Production default is 0.1 (10% of
      # transactions). Bump to 1.0 for a release window when investigating
      # regressions; revert immediately to avoid burning quota.
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - key: SENTRY_PROFILES_SAMPLE_RATE
        value: "0.1"
      # Slow-query threshold in ms. Queries above this are warn-logged +
      # surface in pg_query_duration_seconds histogram with slow="1".
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "250"
      - key: VITE_SENTRY_DSN
        sync: false
      - key: SENTRY_AUTH_TOKEN
        sync: false
      - key: SENTRY_ORG
        sync: false
      - key: SENTRY_PROJECT
        sync: false
      - key: METRICS_ADMIN_TOKEN
        sync: false
      - key: ALERTING_ENABLED
        # Was "false" (dark launch) — flipped 2026-09-06 after the deep
        # audit: with alerting dark, a dead checkout / Redis crash-loop /
        # Neon outage would page NOBODY. Channel creds (Telegram bot
        # token, Discord webhook, generic webhook) remain env-synced
        # secrets; unset channels degrade per-channel, never silently.
        value: "true"
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: GENERIC_ALERT_WEBHOOK_URL
        sync: false
      # --- AI Admin Copilot (010) + Catalog Enrichment (012) --------------
      # The LLM client speaks the OpenAI-compatible protocol (OpenRouter /
      # NVIDIA / any compatible gateway). All four keys below are REQUIRED
      # as a set for the admin copilot UI and for the enrichment runner to
      # produce drafts; leaving them unset keeps both features cleanly
      # disabled (copilot replies "unavailable", runner refuses to start).
      # Set them in the Render Dashboard when enabling AI features.
      - key: COPILOT_PROVIDER
        sync: false
      - key: COPILOT_API_KEY
        sync: false
      - key: COPILOT_MODEL
        sync: false
      - key: COPILOT_BASE_URL
        sync: false
      # Enrichment cron (012). The runner additionally refuses to run unless
      # WORKER_TIER=true — i.e. only after the subnation-worker tier below is
      # actually provisioned AND carries WORKER_TIER=true (see its comment).
      # Until then these placeholders are inert documentation.
      - key: ENRICHMENT_RUNNER_ENABLED
        value: "false"
      - key: ENRICHMENT_DAILY_TOKEN_CAP
        sync: false
      - key: ENRICHMENT_PER_RUN_CAP
        sync: false
      # Inventory demand forecast cron (011). Same tier rule as enrichment.
      - key: FORECAST_RUNNER_ENABLED
        value: "false"
      # Migration switch kept for a FUTURE dedicated worker tier (if one
      # is ever provisioned MANUALLY on a paid plan — the 2026-09-20
      # free-infrastructure round REMOVED the `subnation-worker` service
      # from this blueprint so `Apply Blueprint` can never create a paid
      # worker). Today the web process runs the heartbeat + alerting
      # evaluator + daily retention cron under the leader lock. To split
      # tiers you must do BOTH of these together:
      #   1. Create the worker service manually in the Render Dashboard,
      #      then set on the WEB service: DISABLE_WEB_SCHEDULERS=true.
      #   2. Set on the WORKER service: WORKER_TIER=true (+ its own
      #      SENTRY_DSN / TELEGRAM_* / DISCORD_WEBHOOK_URL so alerting
      #      works from the worker tier too).
      # Flipping only one side either stops all crons (no worker running
      # them) or double-runs them (both tiers racing under the leader
      # lock — harmless but wasteful).
      - key: DISABLE_WEB_SCHEDULERS
        value: "false"
      # Operator escape hatch for the boot-time migration runner. When
      # `true`, server.ts skips runMigrations() entirely on cold start.
      # Use ONLY for emergency rollbacks where the migration shipped in
      # a release is broken and you need to bring up the previous binary
      # against the newer schema. Default `false` — every cold start
      # reconciles schema (idempotent, lock-protected). Owner sets this
      # transiently in the dashboard, redeploys, then unsets it.
      - key: DISABLE_BOOT_MIGRATIONS
        value: "false"
      # 2026-09-20 final audit: REDIS_URL is intentionally ABSENT from this
      # blueprint. Production runs on the PG-lease scheduler fallback
      # (lib/pg-leader-lease.ts) — no Redis service is provisioned and the
      # system is fully functional without one (rate-limit store, cache,
      # idempotency middleware and Socket.IO all degrade to in-process
      # fallbacks by design). The code-level fallback stays; only the
      # blueprint definition was removed so `Apply Blueprint` can never
      # create a Redis the deployment does not use.

  # 2026-09-20 (free-infrastructure round): the `subnation-worker`
  # service (plan: starter — a PAID worker Render would auto-create on
  # every Apply Blueprint) is REMOVED. The web tier owns the daily
  # retention cron + heartbeat + alerting under the leader lock; the
  # interval watchers are gone (event-driven sweeps instead — see
  # backend/src/lib/opportunistic.ts). The system must run WITHOUT any
  # dedicated worker on the free tier — no essential function may
  # depend on a separate worker existing. A paid worker tier can be
  # re-added manually later if the operator ever chooses to.
