openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SubNation Digital Subscriptions Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product catalog
  - name: orders
    description: Orders and checkout
  - name: cart
    description: Server-side cart (cart_items rows; snake_case product_id contract)
  - name: coupons
    description: Coupon validation (user) and coupon management (admin, finance scope)
  - name: wallet
    description: Wallet and top-ups
  - name: loyalty
    description: Loyalty points, tiers, and referral rewards
  - name: support
    description: User support tickets
  - name: notifications
    description: In-app notifications
  - name: admin
    description: Admin operations
  - name: copilot
    description: AI Admin Copilot — natural-language commands, structured previews, gated execution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the current user's active session rows
      responses:
        "200":
          description: Session rows written at each login
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all active products
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: available_only
          in: query
          schema:
            type: ["boolean", "null"]
        - name: sort
          in: query
          schema:
            type: ["string", "null"]
            enum: ["price_asc", "price_desc", "popular", "newest", null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/recommendations:
    get:
      operationId: getProductRecommendations
      tags: [products]
      summary: Get recommended products related to a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recommended products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRecommendation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/stats:
    get:
      operationId: getCatalogStats
      tags: [products]
      summary: Get catalog summary stats
      responses:
        "200":
          description: Catalog stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStats"

  /flash-sale:
    get:
      operationId: getFlashSale
      tags: [products]
      summary: Get active flash sale
      responses:
        "200":
          description: Active flash sale or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashSaleResponse"

  # ── Orders ──────────────────────────────────────────────────────────────────
  /products/by-slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Product detail by slug (SEO route + crawler hits)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail (same shape as /products/{id}, plus faq)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user's orders
      parameters:
        - name: limit
          in: query
          description: |
            Page size cap. The storefront home passes 4 (it renders four
            recent-order cards); the profile page uses the default 200.
            Clamped server-side to [1, 200].
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: User's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Purchase a product
      description: |
        THE customer charge path (atomic wallet deduction + inventory
        claim). Mounted behind the idempotency middleware — send a fresh
        Idempotency-Key per purchase (checkout generates one per unit) so a
        network retry or double-click cannot double-charge.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Client-generated idempotency key. The middleware only engages
            when the key is at least 8 characters; shorter (or absent) keys
            pass through (transitional). With a valid key, duplicate
            submissions of the same body replay the cached response for
            24h (per user + route), the same key re-sent with a different
            body returns 409 IDEMPOTENCY_KEY_REUSE, and the same key while
            the original request is still executing returns 409
            IDEMPOTENCY_IN_FLIGHT.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          headers:
            Idempotent-Replayed:
              description: |
                "true" when this body is a cached replay of the original
                request (same Idempotency-Key + body).
              schema:
                type: string
                enum: ["true"]
            Idempotent-Original-At:
              description: |
                ISO-8601 completion timestamp of the original request —
                present on idempotent replays.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Insufficient balance, invalid coupon, or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or out of stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Conflict — inventory claimed by another buyer, coupon
            exhausted by a concurrent purchase, wallet-deduction
            concurrency loss, or an idempotency-key mismatch (same key
            re-used with a different body / same key still in flight —
            those bodies carry success:false and a legacy `message`
            alias alongside `error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/IdempotencyConflictResponse"
        "500":
          description: |
            Price data-integrity failure (INVALID_PRICE guard — non-finite
            or non-positive computed price). Not client-fixable; contact
            support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderCode}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details by order code
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet info
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/topups:
    get:
      operationId: listTopups
      tags: [wallet]
      summary: List user's top-up requests
      responses:
        "200":
          description: Top-up history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topup"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Submit a top-up request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopupBody"
      responses:
        "201":
          description: Top-up request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topup"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Too many pending top-up requests — max 3 concurrent pending
            per user (TOPUP_LIMIT_EXCEEDED). Body carries pending_count
            and limit extras beyond the standard error envelope. Note:
            serial abusers (≥3 previously rejected topups) still get a
            201, with the row auto-rejected (admin_note explains).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupLimitErrorResponse"

  # ── Cart ─────────────────────────────────────────────────────────────────
  # Server-side cart (cart_items rows). NOTE: the body/response field for
  # product references is snake_case `product_id` — the frontend local
  # cart store uses camelCase `productId` and only consumes GET /cart and
  # DELETE /cart today; wire mutations carefully before adopting them.
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current user's cart with live pricing
      description: |
        Items ordered by insertion; pricing snapshot uses the flash-sale
        stage from a 30s in-process cache. Empty cart →
        {items: [], total: 0}.
      responses:
        "200":
          description: Cart items and total (sum of subtotals, 2dp)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
                  total:
                    type: number
                required: [items, total]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear all cart rows for the current user
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart (upsert — merges into an existing line)
      description: |
        If the user already has a line for the product, quantity becomes
        min(existing + quantity, 99) and the merged row is returned —
        still 201. No idempotency middleware and no route-specific rate
        limit (global limiters only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemBody"
      responses:
        "201":
          description: Cart item created (or merged — see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          description: Missing/invalid product_id or out-of-range quantity (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found (or inactive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Replace a cart item's quantity (REPLACE, not increment)
      description: Ownership-scoped — another user's cart item id is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          description: Invalid id or quantity (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCartItem
      tags: [cart]
      summary: Remove one cart item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Coupons ──────────────────────────────────────────────────────────────
  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon against an order amount (checkout screen)
      description: |
        Runs on the product page for every coupon apply. `code` is trimmed
        and uppercased for lookup; `order_amount` is the effective product
        price (sale_price ?? price).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCouponBody"
      responses:
        "200":
          description: Coupon valid — discount computed for this order amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatedCoupon"
        "400":
          description: |
            Invalid body, or the coupon exists but is not applicable:
            inactive, expired, max-uses reached, or order below
            min_order_amount (all INVALID_DATA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown coupon code (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/admin:
    get:
      operationId: listAdminCoupons
      tags: [coupons]
      summary: List all coupons (requireAdmin + finance scope)
      description: Newest first; includes inactive/soft-deactivated rows.
      responses:
        "200":
          description: All coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCoupon
      tags: [coupons]
      summary: Create a coupon (requireAdmin + finance scope)
      description: |
        zod-validated (CreateCouponBody in routes/coupons.ts). `code` is
        uppercased before insert. Percentage coupons must have value ≤ 100
        (checked after parse); fixed coupons are bounded at 10,000 LYD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponBody"
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Validation error, or percentage value above 100 (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Coupon code already exists (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/admin/{id}:
    patch:
      operationId: updateCoupon
      tags: [coupons]
      summary: Update coupon mutable fields (requireAdmin + finance scope)
      description: Strict zod body — unknown keys are a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCouponBody"
      responses:
        "200":
          description: Updated coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Invalid id or body (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coupon not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      summary: Soft-deactivate a coupon (requireAdmin + finance scope)
      description: Sets is_active=false — the row is kept for audit history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coupon not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Loyalty ──────────────────────────────────────────────────────────────
  /loyalty:
    get:
      operationId: getLoyalty
      tags: [loyalty]
      summary: Loyalty summary — points, tier, referral stats, conversion rate
      responses:
        "200":
          description: Loyalty summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltySummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User row vanished (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loyalty/convert-points:
    post:
      operationId: convertPoints
      tags: [loyalty]
      summary: Convert loyalty points to wallet credit (money-creation path)
      description: |
        Points must be ≥ 100 and a multiple of 100 (POINTS_PER_LYD).
        Runs in a DB transaction: fresh read inside the tx, optimistic
        lock on both mutated columns, and a wallet_ledger row
        (type=adjustment, referenceType=loyalty_conversion). Concurrent
        mutations lose the optimistic lock → 409 CONFLICT (retry-safe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertPointsBody"
      responses:
        "200":
          description: Points converted and wallet credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertPointsResult"
        "400":
          description: |
            Below the 100-point minimum, not a multiple of 100, or
            insufficient points balance (all INVALID_DATA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Points/balance changed concurrently (CONFLICT — retry with fresh state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loyalty/referrals:
    get:
      operationId: listReferrals
      tags: [loyalty]
      summary: List the current user's referral events (≤200, newest first)
      responses:
        "200":
          description: Referral events with masked referee phones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralEventItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Support ──────────────────────────────────────────────────────────────
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List the current user's tickets (≤200, newest first)
      description: Each row carries the latest reply (first 80 chars) when present.
      responses:
        "200":
          description: Ticket summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: "Open a support ticket (rate-limited: 5/hour/user)"
      description: |
        The message becomes the first reply (author_type=user). An
        unknown category silently falls back to "other". 429 bodies are
        the standard {error, code: RATE_LIMITED} envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketBody"
      responses:
        "201":
          description: Ticket created with status "open"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketCreated"
        "400":
          description: Missing title/message or title over 255 chars (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Ticket creation rate limit (5/hour/user, RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}:
