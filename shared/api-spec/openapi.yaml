openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: |
    SubNation Digital Subscriptions Platform API.

    ## Authentication (round-93 / 93-A8 F-1 — contract truth)

    Two session mechanisms, both documented as security schemes and
    attached per operation family:

    - **User routes** (auth, orders, wallet, cart, coupons/validate,
      loyalty, referrals, support, notifications): an `auth_token`
      httpOnly cookie (primary) OR an `Authorization: Bearer <token>`
      header (fallback).
    - **Admin routes** (/admin/*, /coupons/admin*, the copilot family):
      an `admin_token` httpOnly cookie (8h, issued by POST
      /admin/login) OR its Bearer equivalent. POST /admin/login itself
      is the credential endpoint and needs no prior session.

    ## CSRF gate (applies to every state-changing request)

    Every POST/PUT/PATCH/DELETE under /api — regardless of cookie or
    Bearer authentication — must carry an Origin (or Referer) header
    matching the deployment's allow-list (CSRF_ALLOWED_ORIGINS /
    APP_ORIGINS / APP_URL); otherwise the request is rejected with
    403 FORBIDDEN before the route runs. Requests with neither Origin
    nor Referer are also rejected. Exemptions:
    /api/auth/firebase/session, /api/auth/firebase/refresh, /api/cwv,
    /api/webhook/*, and /health. Non-browser clients must therefore
    send a browser-like Origin header on mutations.

    ## Deployment-conditional behavior

    Idempotency-Key semantics (the 409 replay/reuse conflicts and
    Idempotent-* response headers) are backed by the DURABLE in-transaction
    `idempotency_keys` DB guard (round-94 F10) — they engage on EVERY
    deployment, with or without Redis. When REDIS_URL is additionally
    provided, the Redis claim layer (fast pre-check + cross-instance
    coordination) fronts the same durable guard; without it, dedup
    relies on the DB-level claim alone (correct, marginally slower on
    the conflict path). /auth/me and /auth/probe send
    `Cache-Control: private, max-age=30`; catalog routes send
    `public, max-age=0, s-maxage=60, stale-while-revalidate=300`.
servers:
  - url: /api
    description: Base API path
# Default security for every documented operation: user session
# (auth_token cookie OR Bearer). Operations that differ override this
# at the operation level — public catalog/health/webhook/login routes
# declare `security: []`, and the admin + copilot families declare
# adminCookieAuth/adminBearerAuth (round-93 / 93-A8 F-1).
security:
  - cookieAuth: []
    bearerAuth: []
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product catalog
  - name: orders
    description: Orders and checkout
  - name: cart
    description: Server-side cart (cart_items rows; snake_case product_id contract)
  - name: coupons
    description: Coupon validation (user) and coupon management (admin, finance scope)
  - name: wallet
    description: Wallet and top-ups
  - name: loyalty
    description: Loyalty points, tiers, and referral rewards
  - name: support
    description: User support tickets
  - name: notifications
    description: In-app notifications
  - name: admin
    description: Admin operations
  - name: copilot
    description: AI Admin Copilot — natural-language commands, structured previews, gated execution
  - name: webhook
    description: Inbound machine-to-machine webhooks (secret-token auth, non-{error,code} ack envelopes)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      security: []
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the current user's active session rows
      responses:
        "200":
          description: Session rows written at each login
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
        "401":
          description: Not authenticated (requireUser guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authenticated (requireUser guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Auth mint family (round-98 contract — the primary Libyan sign-in surface) ─
  # Shapes below are field-exact with routes/auth-whatsapp.ts, routes/auth-settings.ts
  # and routes/auth.ts. Every mint route returns `token: "__cookie_session__"`, a
  # truthy SENTINEL: the httpOnly auth_token cookie is the sole session transport
  # (round-98 F3 closed the raw-JWT-in-body XSS surface); clients must NOT treat
  # the token field as a credential.
  /auth/whatsapp/start:
    post:
      operationId: startWhatsappOtp
      tags: [auth]
      summary: Send a WhatsApp OTP to the given phone (registration purpose)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  description: Libyan or international phone; normalized server-side.
                referral_code:
                  type: string
                  maxLength: 16
                  description: Optional referral code applied on first verify.
      responses:
        "200":
          description: OTP queued — never the code itself, only its expiry.
          content:
            application/json:
              schema:
                type: object
                required: [success, expires_at]
                properties:
                  success:
                    type: boolean
                  expires_at:
                    type: string
                    description: ISO timestamp when the code expires (5 minutes).
        "400":
          description: Missing/invalid phone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Cooldown (60s resend) / hourly or attempt caps — retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: >-
            WhatsApp channel not ready: details.reason = whatsapp_settling
            (freshly linked channel warming up — details.retry_after_sec
            present + Retry-After header) or store_failed (delivery store
            failure, 30s retry hint).
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - type: object
                    properties:
                      details:
                        type: object
                        properties:
                          reason:
                            type: string
                            enum: [whatsapp_settling, store_failed]
                          retry_after_sec:
                            type: integer
          headers:
            Retry-After:
              description: Seconds until the channel is expected to accept sends.
              schema:
                type: integer

  /auth/whatsapp/verify:
    post:
      operationId: verifyWhatsappOtp
      tags: [auth]
      summary: Verify the WhatsApp OTP — mints the session (cookie) on success
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone:
                  type: string
                code:
                  type: string
                  description: 6-digit code as typed (Arabic-Indic digits accepted).
                referral_code:
                  type: string
                  maxLength: 16
      responses:
        "200":
          description: Session minted (httpOnly auth_token cookie set).
          content:
            application/json:
              schema:
                type: object
                required: [token, is_new_user]
                properties:
                  token:
                    type: string
                    description: The "__cookie_session__" sentinel — not a credential.
                  is_new_user:
                    type: boolean
        "400":
          description: Missing fields / malformed code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong code (5 attempts per code, consume-on-success)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/providers:
    get:
      operationId: listPublicAuthProviders
      tags: [auth]
      summary: Public sign-in provider catalog (enabled flags + non-secret config)
      security: []
      responses:
        "200":
          description: Provider list — only renderable providers are included.
          content:
            application/json:
              schema:
                type: object
                required: [providers, whatsapp_status]
                properties:
                  providers:
                    type: array
                    items:
                      type: object
                      required: [id, label, enabled, has_config, auth_type]
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        color:
                          type: ["string", "null"]
                        icon:
                          type: ["string", "null"]
                        auth_type:
                          type: string
                        enabled:
                          type: boolean
                        has_config:
                          type: boolean
                        client_id:
                          type: ["string", "null"]
                        app_id:
                          type: ["string", "null"]
                        bot_username:
                          type: ["string", "null"]
                        bot_id:
                          type: ["string", "null"]
                          description: Numeric Telegram bot id (parsed server-side; the token never leaves the DB).
                  whatsapp_status:
                    type: string
                    enum: [ready, settling, unavailable]
                    description: Live OTP channel readiness (round-96/97 settling contract).

  /auth/telegram:
    post:
      operationId: authTelegramWidget
      tags: [auth]
      summary: Verify Telegram Login Widget data — mints the session cookie
      security: []
      description: >-
        Body carries the Telegram widget fields (id, first_name,
        auth_date, hash, …). The hash is verified against the bot token
        (HMAC) with auth_date freshness + a replay claim. 409 when the
        Telegram identity is already linked to a different account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Session minted — returns token sentinel + is_new_user"
          content:
            application/json:
              schema:
                type: object
                required: [token, is_new_user]
                properties:
                  token:
                    type: string
                    description: The "__cookie_session__" sentinel.
                  is_new_user:
                    type: boolean
        "401":
          description: Invalid hash / stale auth_date / replayed assertion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Identity already linked to another account (link_token in details)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/telegram/webapp:
    post:
      operationId: authTelegramWebApp
      tags: [auth]
      summary: Verify Telegram WebApp initData — mints the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [initData]
              properties:
                initData:
                  type: string
                  description: Raw Telegram WebApp initData query string (HMAC-verified server-side, 25h replay TTL).
      responses:
        "200":
          description: "Session minted — returns token sentinel + is_new_user"
          content:
            application/json:
              schema:
                type: object
                required: [token, is_new_user]
                properties:
                  token:
                    type: string
                    description: The "__cookie_session__" sentinel.
                  is_new_user:
                    type: boolean
        "401":
          description: Invalid signature / replay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/telegram/callback:
    get:
      operationId: authTelegramCallback
      tags: [auth]
      summary: Redirect-mode Telegram login (widget verification then 302)
      security: []
      parameters:
        - name: hash
          in: query
          required: true
          schema:
            type: string
          description: Widget fields arrive as query params; verified then redirected.
      responses:
        "302":
          description: Verified → redirect to /auth/callback (session cookie set); failure → /auth/callback?error=...
        "400":
          description: Malformed widget payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/firebase/session:
    post:
      operationId: authFirebaseSession
      tags: [auth]
      summary: Exchange a Firebase Google ID token for the session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
                  description: Firebase ID token (signature verified server-side).
                referral_code:
                  type: string
                  maxLength: 16
                link_consent_token:
                  type: string
                  description: One-time consent token from a prior 409 account-link response.
      responses:
        "200":
          description: "Session minted — returns token sentinel + is_new_user"
          content:
            application/json:
              schema:
                type: object
                required: [token, is_new_user]
                properties:
                  token:
                    type: string
                    description: The "__cookie_session__" sentinel.
                  is_new_user:
                    type: boolean
        "401":
          description: Invalid/expired ID token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Google identity already linked to another account (link_consent_token flow)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/firebase/refresh:
    post:
      operationId: authFirebaseRefresh
      tags: [auth]
      summary: Rotate the session from a fresh Firebase ID token (already-bound session required)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id_token]
              properties:
                id_token:
                  type: string
      responses:
        "200":
          description: "Session rotated — returns token sentinel"
          content:
            application/json:
              schema:
                type: object
                required: [token]
                properties:
                  token:
                    type: string
                    description: The "__cookie_session__" sentinel.
        "401":
          description: Invalid token / no existing bound session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/probe:
    get:
      operationId: probeAuth
      tags: [auth]
      summary: Boot probe — 200 always; body carries authenticated state (never 401)
      security: []
      responses:
        "200":
          description: >-
            {authenticated, user?, linked_identities?, csrf_token} — the
            SPA uses this on boot to restore state; unauthenticated is
            still 200 (never 401, so probes never trip auth error UI).
          content:
            application/json:
              schema:
                type: object
                required: [authenticated]
                properties:
                  authenticated:
                    type: boolean
                  user:
                    $ref: "#/components/schemas/User"
                  linked_identities:
                    type: array
                    items:
                      $ref: "#/components/schemas/LinkedIdentity"

  # ── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      security: []
      summary: List all active products
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: available_only
          in: query
          schema:
            type: ["boolean", "null"]
        - name: sort
          in: query
          schema:
            type: ["string", "null"]
            enum: ["price_asc", "price_desc", "popular", "newest", null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      security: []
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/recommendations:
    get:
      operationId: getProductRecommendations
      tags: [products]
      security: []
      summary: Get recommended products related to a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recommended products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRecommendation"
        "400":
          description: Invalid (non-integer) id — intParam guard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/stats:
    get:
      operationId: getCatalogStats
      tags: [products]
      security: []
      summary: Get catalog summary stats
      responses:
        "200":
          description: Catalog stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStats"

  /flash-sale:
    get:
      operationId: getFlashSale
      tags: [products]
      security: []
      summary: Get active flash sale
      responses:
        "200":
          description: Active flash sale or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashSaleResponse"

  # ── Orders ──────────────────────────────────────────────────────────────────
  /products/by-slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      security: []
      summary: Product detail by slug (SEO route + crawler hits)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail (same shape as /products/{id}, plus faq)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown slug (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user's orders
      parameters:
        - name: limit
          in: query
          description: |
            Page size cap. The storefront home passes 4 (it renders four
            recent-order cards); the profile page uses the default 200.
            Clamped server-side to [1, 200].
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
      responses:
        "200":
          description: User's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Purchase a product
      description: |
        THE customer charge path (atomic wallet deduction + inventory
        claim). Mounted behind the idempotency middleware — send a fresh
        Idempotency-Key per purchase (checkout generates one per unit) so a
        network retry or double-click cannot double-charge. Round-94 (F10):
        the key ALSO engages the durable in-transaction guard
        (idempotency_keys) — a retry after a Redis flush / TTL expiry / TTL
        boundary replays the original ORDER (200 + Idempotent-Replayed:
        true) instead of re-charging, and a purchase that raced a same-key
        winner surfaces the winner's order, never a second charge.
        Round-94 (F1): a risk soft_block-tagged buyer is refused 423 until
        they re-authenticate (friction, not lockout).
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Client-generated idempotency key. The middleware only engages
            when the key is at least 8 characters; shorter (or absent) keys
            pass through (transitional). With a valid key, duplicate
            submissions of the same body replay the cached response for
            24h (per user + route), the same key re-sent with a different
            body returns 409 IDEMPOTENCY_KEY_REUSE, and the same key while
            the original request is still executing returns 409
            IDEMPOTENCY_IN_FLIGHT.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          headers:
            Idempotent-Replayed:
              description: |
                "true" when this body is a cached replay of the original
                request (same Idempotency-Key + body).
              schema:
                type: string
                enum: ["true"]
            Idempotent-Original-At:
              description: |
                ISO-8601 completion timestamp of the original request —
                present on idempotent replays.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "200":
          description: |
            Round-94 (F10): durable idempotent REPLAY — this call returned
            the order a previous request with the same Idempotency-Key
            already created (nothing charged/claimed now). Distinguished
            from 201 by the status code and the Idempotent-Replayed
            header; new-order notifications are not re-fired.
          headers:
            Idempotent-Replayed:
              description: Always "true" on this response.
              schema:
                type: string
                enum: ["true"]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Insufficient balance, invalid coupon, or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or out of stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Conflict — inventory claimed by another buyer, coupon
            exhausted by a concurrent purchase, wallet-deduction
            concurrency loss, product data (price/active/archive) changed
            mid-purchase (round-94 F4: re-price and retry at the current
            price), or an idempotency-key mismatch (same key re-used with
            a different body / same key still in flight — those bodies
            carry success:false and a legacy `message` alias alongside
            `error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/IdempotencyConflictResponse"
        "423":
          description: |
            Round-94 (F1): risk soft-block refusal — the buyer is tagged
            with a live soft_block risk event; re-authenticate and retry
            (the refusal wipes the current sessions).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            Price data-integrity failure (INVALID_PRICE guard — non-finite
            or non-positive computed price). Not client-fixable; contact
            support.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderCode}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details by order code
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet info
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/ledger:
    get:
      operationId: getWalletLedger
      tags: [wallet]
      summary: Wallet statement — every LYD movement from wallet_ledger (R115)
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Newest-first ledger entries (topup, purchase, refund, adjustment, referral_credit)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    type: { type: string, enum: [topup, purchase, refund, adjustment, referral_credit] }
                    type_label: { type: string, description: Arabic label }
                    amount: { type: number }
                    balance_after: { type: number }
                    reference_type: { type: [string, "null"] }
                    description: { type: [string, "null"] }
                    created_at: { type: string, format: date-time }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/topups:
    get:
      operationId: listTopups
      tags: [wallet]
      summary: List user's top-up requests
      responses:
        "200":
          description: Top-up history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topup"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Submit a top-up request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopupBody"
      responses:
        "201":
          description: Top-up request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topup"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Too many pending top-up requests — max 3 concurrent pending
            per user (TOPUP_LIMIT_EXCEEDED). Body carries pending_count
            and limit extras beyond the standard error envelope. Note:
            serial abusers (≥3 previously rejected topups) still get a
            201, with the row auto-rejected (admin_note explains).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopupLimitErrorResponse"
        "423":
          description: |
            Round-94 (F1): risk soft-block refusal — the user is tagged
            with a live soft_block risk event; re-authenticate and retry
            (the refusal wipes the current sessions).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Cart ─────────────────────────────────────────────────────────────────
  # Server-side cart (cart_items rows). NOTE: the body/response field for
  # product references is snake_case `product_id` — the frontend local
  # cart store uses camelCase `productId` and only consumes GET /cart and
  # DELETE /cart today; wire mutations carefully before adopting them.
  /cart:
    get:
      operationId: getCart
      tags: [cart]
      summary: Get the current user's cart with live pricing
      description: |
        Items ordered by insertion; pricing snapshot uses the flash-sale
        stage from a 30s in-process cache. Empty cart →
        {items: [], total: 0}.
      responses:
        "200":
          description: Cart items and total (sum of subtotals, 2dp)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CartItem"
                  total:
                    type: number
                required: [items, total]
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: clearCart
      tags: [cart]
      summary: Clear all cart rows for the current user
      responses:
        "200":
          description: Cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items:
    post:
      operationId: addCartItem
      tags: [cart]
      summary: Add a product to the cart (upsert — merges into an existing line)
      description: |
        If the user already has a line for the product, quantity becomes
        min(existing + quantity, 99) and the merged row is returned —
        still 201. No idempotency middleware and no route-specific rate
        limit (global limiters only).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddCartItemBody"
      responses:
        "201":
          description: Cart item created (or merged — see description)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          description: Missing/invalid product_id or out-of-range quantity (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found (or inactive)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /cart/items/{id}:
    patch:
      operationId: updateCartItem
      tags: [cart]
      summary: Replace a cart item's quantity (REPLACE, not increment)
      description: Ownership-scoped — another user's cart item id is a 404.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCartItemBody"
      responses:
        "200":
          description: Updated cart item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CartItem"
        "400":
          description: Invalid id or quantity (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCartItem
      tags: [cart]
      summary: Remove one cart item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Cart item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Coupons ──────────────────────────────────────────────────────────────
  /coupons/validate:
    post:
      operationId: validateCoupon
      tags: [coupons]
      summary: Validate a coupon against an order amount (checkout screen)
      description: |
        Runs on the product page for every coupon apply. `code` is trimmed
        and uppercased for lookup; `order_amount` is the effective product
        price (sale_price ?? price).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ValidateCouponBody"
      responses:
        "200":
          description: Coupon valid — discount computed for this order amount
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidatedCoupon"
        "400":
          description: |
            Invalid body, or the coupon exists but is not applicable:
            inactive, expired, max-uses reached, or order below
            min_order_amount (all INVALID_DATA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Unknown coupon code (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/admin:
    get:
      operationId: listAdminCoupons
      tags: [coupons]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: List all coupons (requireAdmin + finance scope)
      description: Newest first; includes inactive/soft-deactivated rows.
      responses:
        "200":
          description: All coupons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Coupon"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createCoupon
      tags: [coupons]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Create a coupon (requireAdmin + finance scope)
      description: |
        zod-validated (CreateCouponBody in routes/coupons.ts). `code` is
        uppercased before insert. Percentage coupons must have value ≤ 100
        (checked after parse); fixed coupons are bounded at 10,000 LYD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCouponBody"
      responses:
        "201":
          description: Coupon created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Validation error, or percentage value above 100 (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Coupon code already exists (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /coupons/admin/{id}:
    patch:
      operationId: updateCoupon
      tags: [coupons]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Update coupon mutable fields (requireAdmin + finance scope)
      description: Strict zod body — unknown keys are a 400.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchCouponBody"
      responses:
        "200":
          description: Updated coupon
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Coupon"
        "400":
          description: Invalid id or body (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coupon not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCoupon
      tags: [coupons]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Soft-deactivate a coupon (requireAdmin + finance scope)
      description: Sets is_active=false — the row is kept for audit history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Coupon not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Loyalty ──────────────────────────────────────────────────────────────
  /loyalty:
    get:
      operationId: getLoyalty
      tags: [loyalty]
      summary: Loyalty summary — points, tier, referral stats, conversion rate
      responses:
        "200":
          description: Loyalty summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoyaltySummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User row vanished (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loyalty/convert-points:
    post:
      operationId: convertPoints
      tags: [loyalty]
      summary: Convert loyalty points to wallet credit (money-creation path)
      description: |
        Points must be ≥ 100 and a multiple of 100 (POINTS_PER_LYD).
        Runs in a DB transaction: fresh read inside the tx, optimistic
        lock on both mutated columns, and a wallet_ledger row
        (type=adjustment, referenceType=loyalty_conversion). Concurrent
        mutations lose the optimistic lock → 409 CONFLICT (retry-safe).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConvertPointsBody"
      responses:
        "200":
          description: Points converted and wallet credited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConvertPointsResult"
        "400":
          description: |
            Below the 100-point minimum, not a multiple of 100, or
            insufficient points balance (all INVALID_DATA).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Points/balance changed concurrently (CONFLICT — retry with fresh state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loyalty/ledger:
    get:
      operationId: getLoyaltyLedger
      tags: [loyalty]
      summary: Points history — every point movement attributed (R115)
      description: |
        The user-facing points_ledger view: purchase awards, referral
        credits, conversions out, refund reversals, admin corrections —
        newest first. Makes the balance explainable ("why do I have
        exactly 750 points?" is a list).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: Newest-first points_ledger entries
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer }
                    type: { type: string, enum: [purchase_award, refund_reversal, referral_credit, conversion_out, admin_set, correction] }
                    type_label: { type: string, description: Arabic label }
                    points_delta: { type: integer }
                    points_after: { type: integer }
                    lyd_credited: { type: [number, "null"] }
                    created_at: { type: string, format: date-time }
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /loyalty/referrals:
    get:
      operationId: listReferrals
      tags: [loyalty]
      summary: List the current user's referral events (≤200, newest first)
      responses:
        "200":
          description: Referral events with masked referee phones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReferralEventItem"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Support ──────────────────────────────────────────────────────────────
  /support/tickets:
    get:
      operationId: listSupportTickets
      tags: [support]
      summary: List the current user's tickets (≤200, newest first)
      description: Each row carries the latest reply (first 80 chars) when present.
      responses:
        "200":
          description: Ticket summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SupportTicketSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createSupportTicket
      tags: [support]
      summary: "Open a support ticket (rate-limited: 5/hour/user)"
      description: |
        The message becomes the first reply (author_type=user). An
        unknown category silently falls back to "other". 429 bodies are
        the standard {error, code: RATE_LIMITED} envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSupportTicketBody"
      responses:
        "201":
          description: Ticket created with status "open"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketCreated"
        "400":
          description: Missing title/message or title over 255 chars (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Ticket creation rate limit (5/hour/user, RATE_LIMITED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}:
    get:
      operationId: getSupportTicket
      tags: [support]
      summary: Ticket detail with the full reply thread
      description: Ownership-scoped — replies ordered oldest first.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Ticket with full replies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportTicketDetail"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /support/tickets/{id}/reply:
    post:
      operationId: replySupportTicket
      tags: [support]
      summary: "Reply to one of the caller's tickets (side-effect: status → in_progress)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplySupportTicketBody"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketReply"
        "400":
          description: Invalid id, missing message, or ticket closed (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Ticket not found (or not owned by the caller)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Reply rate limit — 30 replies/hour per user on this ticket
            family (ticketReplyLimiter, body code RATE_LIMITED;
            93-A8 F-13: implemented since round-92, previously
            undocumented here).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Notifications ─────────────────────────────────────────────────────────
  /notifications:
    get:
      operationId: listNotifications
