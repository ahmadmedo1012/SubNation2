      properties:
        severity:
          type: string
          enum: [warn, error]
        code:
          type: string
        message:
          type: string
        affected_id:
          type: ["integer", "null"]
      required: [severity, code, message]

    CopilotHandoff:
      type: object
      properties:
        target_url:
          type: string
        rationale:
          type: string
      required: [target_url, rationale]

    CopilotChange:
      type: object
      properties:
        field:
          type: string
        before:
          description: Previous value (any JSON-encodable shape)
        after:
          description: Proposed new value (any JSON-encodable shape)
      required: [field]

    CopilotSinglePreviewPayload:
      type: object
      properties:
        kind:
          type: string
          enum: [single]
        intent_summary:
          type: string
        side_effects:
          type: array
          items:
            type: string
        validation_warnings:
          type: array
          items:
            $ref: "#/components/schemas/CopilotValidationWarning"
        irreversible:
          type: boolean
        handoff:
          oneOf:
            - $ref: "#/components/schemas/CopilotHandoff"
            - type: "null"
        entity_type:
          type: string
        entity_id:
          type: integer
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CopilotChange"
      required:
        [
          kind,
          intent_summary,
          side_effects,
          validation_warnings,
          irreversible,
          entity_type,
          entity_id,
          changes,
        ]

    CopilotBulkSampleRow:
