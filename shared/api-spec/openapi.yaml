        description:
          type: ["string", "null"]
        description_long:
          type: ["string", "null"]
        faq:
          type: ["array", "null"]
          items:
            type: object
        image_url:
          type: ["string", "null"]
        price:
          type: number
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        usage_terms:
          type: ["string", "null"]
        stock_count:
          type: integer
        is_available:
          type: boolean
        sale_price:
          type: ["number", "null"]
        discount_percent:
          type: ["number", "null"]
        order_count:
          type: integer
      required: [id, name, price, is_active, stock_count, is_available, order_count]

    ProductRecommendation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        image_url:
          type: ["string", "null"]
        price:
          type: number
      required: [id, name, price]

    CatalogStats:
      type: object
      properties:
        total_products:
          type: integer
        available_products:
          type: integer
        total_units:
          type: integer
        lowest_price:
          type: ["number", "null"]
        has_flash_sale:
          type: boolean
      required: [total_products, available_products, total_units, has_flash_sale]

    FlashSaleResponse:
      type: object
      properties:
        flash_sale:
          type: ["object", "null"]
          properties:
            id:
              type: integer
            title:
              type: string
            discount_percent:
              type: number
            ends_at:
              type: string
          required: [id, title, discount_percent, ends_at]
      required: [flash_sale]

    # ── Orders ────────────────────────────────────────────────────────────────
    CreateOrderBody:
      type: object
      properties:
        product_id:
          type: integer
        coupon_code:
          type: ["string", "null"]
      required: [product_id]

    Order:
      type: object
      properties:
        id:
          type: integer
        order_code:
          type: string
        product_id:
          type: integer
        product_name:
          type: string
        product_image_url:
          type: ["string", "null"]
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        delivered_extra_details:
          type: ["string", "null"]
        delivered_usage_terms:
          type: ["string", "null"]
        delivered_at:
          type: ["string", "null"]
        coupon_code:
          type: ["string", "null"]
        discount_amount:
          type: number
        wallet_balance_before:
          type: number
        wallet_balance_after:
          type: number
        created_at:
          type: string
      required: [id, order_code, product_id, product_name, amount, status, created_at]

    UserSession:
      type: object
      properties:
        id:
          type: string
        device:
          type: string
        ip:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        expires_at:
          type: ["string", "null"]
        lastActive:
          type: string
        current:
          type: boolean

    # ── Wallet ────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      properties:
        balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        pending_topups_count:
          type: integer
        recent_orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required: [balance, loyalty_points, loyalty_tier, pending_topups_count, recent_orders]

    CreateTopupBody:
      type: object
      properties:
        amount:
          type: number
        payment_method:
          type: string
          enum: [mobile_transfer, lypay]
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
      required: [amount]

    Topup:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        payment_method:
          type: string
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
        reviewed_at:
          type: ["string", "null"]
      required: [id, amount, payment_method, status, created_at]

    # ── Admin ─────────────────────────────────────────────────────────────────
    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        display_name:
          type: string
        requires_2fa:
          type: boolean
        temp_token:
          type: string

    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        total_orders:
          type: integer
        total_revenue:
          type: number
        pending_topups:
          type: integer
        today_orders:
          type: integer
        today_revenue:
          type: number
        available_stock:
          type: integer
        total_wallet_balance:
          type: number
      required:
        [
          total_users,
          total_orders,
          total_revenue,
          pending_topups,
          today_orders,
          today_revenue,
          available_stock,
          total_wallet_balance,
        ]

    AdminOrder:
      type: object
      properties:
        id:
          type: integer
        order_code:
          type: string
        user_phone:
          type: string
        product_name:
          type: string
        amount:
          type: number
        status:
          type: string
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, order_code, user_phone, product_name, amount, status, created_at]

    AdminTopup:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_phone:
          type: string
        amount:
          type: number
        payment_network:
          type: string
        sender_phone:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, user_id, user_phone, amount, payment_network, status, created_at]

    AdminTopupActionBody:
      type: object
      properties:
        admin_note:
          type: ["string", "null"]

    AdminProduct:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
        cost_price:
          type: ["number", "null"]
          description: |
            Operator's procurement cost per unit. Used by the admin
            pricing calculator to compute margin. Nullable for products
            created before this field existed.
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        is_archived:
          type: boolean
        stock_count:
          type: integer
        order_count:
          type: integer
        usage_terms:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, name, price, is_active, is_archived, stock_count, order_count, created_at]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
        cost_price:
          type: ["number", "null"]
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: boolean
      required: [name, price]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
        cost_price:
          type: ["number", "null"]
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: ["boolean", "null"]

    AdminUser:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        lifetime_spend:
          type: number
        order_count:
          type: integer
        referral_code:
          type: ["string", "null"]
        created_at:
          type: string
      required:
        [
          id,
          phone,
          wallet_balance,
          loyalty_points,
          loyalty_tier,
          lifetime_spend,
          order_count,
          created_at,
        ]

    # ──────────────────────────────────────────────────────────────────────
    # AI Admin Copilot schemas (010-ai-admin-copilot)
    # ──────────────────────────────────────────────────────────────────────
    CopilotAskContext:
      type: object
      properties:
        route:
          type: string
        focus_entity_type:
          type: string
        focus_entity_id:
          type: integer

    CopilotValidationWarning:
      type: object
      properties:
        severity:
          type: string
          enum: [warn, error]
        code:
          type: string
        message:
          type: string
        affected_id:
          type: ["integer", "null"]
      required: [severity, code, message]

    CopilotHandoff:
      type: object
      properties:
        target_url:
          type: string
        rationale:
          type: string
      required: [target_url, rationale]

    CopilotChange:
      type: object
      properties:
        field:
          type: string
        before:
          description: Previous value (any JSON-encodable shape)
        after:
          description: Proposed new value (any JSON-encodable shape)
      required: [field]

    CopilotSinglePreviewPayload:
      type: object
      properties:
        kind:
          type: string
          enum: [single]
        intent_summary:
          type: string
        side_effects:
          type: array
          items:
            type: string
        validation_warnings:
          type: array
          items:
            $ref: "#/components/schemas/CopilotValidationWarning"
        irreversible:
          type: boolean
        handoff:
          oneOf:
            - $ref: "#/components/schemas/CopilotHandoff"
            - type: "null"
        entity_type:
          type: string
        entity_id:
          type: integer
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CopilotChange"
      required:
        [
          kind,
          intent_summary,
          side_effects,
          validation_warnings,
          irreversible,
          entity_type,
          entity_id,
          changes,
        ]

    CopilotBulkSampleRow:
      type: object
      properties:
        entity_type:
          type: string
        entity_id:
          type: integer
        changes:
          type: array
          items:
            $ref: "#/components/schemas/CopilotChange"
      required: [entity_type, entity_id, changes]

    CopilotPredictedFailure:
      type: object
      properties:
        entity_id:
          type: integer
        reason:
          type: string
      required: [entity_id, reason]

    CopilotBulkPreviewPayload:
      type: object
      properties:
        kind:
          type: string
          enum: [bulk]
        intent_summary:
          type: string
        side_effects:
          type: array
          items:
            type: string
        validation_warnings:
          type: array
          items:
            $ref: "#/components/schemas/CopilotValidationWarning"
        irreversible:
          type: boolean
        total_affected:
          type: integer
          minimum: 1
          maximum: 500
        sample:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CopilotBulkSampleRow"
        aggregate_impact:
          type: ["object", "null"]
          additionalProperties: true
        predicted_failures:
          type: array
          items:
            $ref: "#/components/schemas/CopilotPredictedFailure"
      required:
        [
          kind,
          intent_summary,
          side_effects,
          validation_warnings,
          irreversible,
          total_affected,
          sample,
          predicted_failures,
        ]

    CopilotPreviewView:
      type: object
      properties:
        id:
          type: string
        admin_id:
          type: integer
        intent_text:
          type: string
        intent_summary:
          type: string
        action_class:
          type: string
        risk_tier:
          type: string
          enum: [low, high, no_execute]
        payload:
          oneOf:
            - $ref: "#/components/schemas/CopilotSinglePreviewPayload"
            - $ref: "#/components/schemas/CopilotBulkPreviewPayload"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        confirmed_once_at:
          type: ["string", "null"]
          format: date-time
        cooldown_starts_at:
          type: ["string", "null"]
          format: date-time
        confirmed_twice_at:
          type: ["string", "null"]
          format: date-time
      required:
        [
          id,
          admin_id,
          intent_text,
          intent_summary,
          action_class,
          risk_tier,
          payload,
          created_at,
          expires_at,
        ]

    CopilotDraftResponse:
      type: object
      properties:
        preview_id:
          type: string
        preview:
          $ref: "#/components/schemas/CopilotPreviewView"
      required: [preview_id, preview]

    CopilotConfirmItem:
      type: object
      properties:
        entity_id:
          type: integer
        outcome:
          type: string
          enum: [success, failure, skipped]
        failure_reason:
          type: ["string", "null"]
      required: [entity_id, outcome]

    CopilotConfirmResponse:
      type: object
      properties:
        outcome:
          type: string
          enum: [success, partial, failure, awaiting_double_confirm]
        action_id:
          type: ["integer", "null"]
        cooldown_seconds:
          type: ["integer", "null"]
        items:
          oneOf:
            - type: array
              items:
                $ref: "#/components/schemas/CopilotConfirmItem"
            - type: "null"
        result_url:
          type: ["string", "null"]
      required: [outcome]

    CopilotRefusalResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        reasons:
          type: array
          items:
            type: string
        suggested_narrowing:
          type: ["string", "null"]
      required: [code, message, reasons]

    CopilotHistoryEntry:
      type: object
      properties:
        id:
          type: integer
        admin_id:
          type: integer
        intent_text:
          type: string
        action_class:
          type: string
        risk_tier:
          type: string
          enum: [low, high, no_execute]
        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        executed_at:
          type: ["string", "null"]
          format: date-time
        failure_reason:
          type: ["string", "null"]
      required: [id, admin_id, intent_text, action_class, risk_tier, outcome, created_at]
