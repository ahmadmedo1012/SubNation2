  /admin/flash-sales:
    get:
      operationId: listAdminFlashSales
      tags: [admin]
      summary: List flash sales — active + historical (requireAdmin + inventory scope)
      description: |
        ≤100 rows, newest first. `is_currently_active` is derived
        (is_active AND ends_at in the future).
      responses:
        "200":
          description: Flash sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  flash_sales:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminFlashSale"
                required: [flash_sales]
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing inventory permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFlashSale
      tags: [admin]
      summary: Create a flash sale (activates immediately; requireAdmin + inventory scope)
      description: |
        One ACTIVE sale at a time (DB partial unique index). 400 bodies
        carry details: {field} naming the rejected input. Discount is
        capped at 95% so a stacked fixed coupon can never reach free
        goods — use a coupon for deeper discounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFlashSaleBody"
      responses:
        "201":
          description: Flash sale created and active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlashSale"
        "400":
          description: |
            Validation error (INVALID_DATA + details {field} — discount
            out of 0..95, ends_at not 5min..30d in the future, bad title).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing inventory permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Another active sale exists (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/flash-sales/{id}:
    patch:
      operationId: updateFlashSale
      tags: [admin]
      summary: Update a flash sale (requireAdmin + inventory scope)
      description: |
        At least one field required. Activating a sale while another is
        active hits the singleton index → 409 ALREADY_EXISTS.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFlashSaleBody"
      responses:
        "200":
          description: Updated flash sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlashSale"
        "400":
          description: Invalid id or body (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing inventory permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Flash sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Activation conflicts with another active sale (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteFlashSale
      tags: [admin]
      summary: Soft-deactivate a flash sale (requireAdmin + inventory scope)
      description: |
        Sets is_active=false and returns the row — the row is kept for
        audit history. Reactivate via PATCH (subject to the singleton
        constraint).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deactivated flash sale (current state)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFlashSale"
        "400":
          description: Invalid id (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing inventory permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Flash sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/referrals/{id}/credit:
    post:
      operationId: creditReferral
      tags: [admin]
      summary: Credit the referrer +50 loyalty points for a referral event (requireAdmin + users scope)
      description: |
        Status-guarded in a transaction (WHERE status='pending') — a
        concurrent credit loses the race and gets 409 ALREADY_EXISTS
        instead of double-granting. Mounted behind the idempotency
        middleware (routeKey admin.referrals.credit). A loyalty
        notification is created for the referrer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: referral_events.id
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Idempotency key (≥ 8 chars to engage; 24h dedup per admin +
            route) — dedupes admin double-clicks.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Points granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  points_credited:
                    type: integer
                    description: Points granted (POINTS_PER_REFERRAL = 50).
                required: [success, points_credited]
        "400":
          description: Event already credited (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing users permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referral event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Concurrent credit race (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction failure (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

