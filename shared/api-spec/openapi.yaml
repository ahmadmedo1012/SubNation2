        admin_id:
          type: integer
        intent_text:
          type: string
        intent_summary:
          type: string
        action_class:
          type: string
        risk_tier:
          type: string
          enum: [low, high, no_execute]
        payload:
          oneOf:
            - $ref: "#/components/schemas/CopilotSinglePreviewPayload"
            - $ref: "#/components/schemas/CopilotBulkPreviewPayload"
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        confirmed_once_at:
          type: ["string", "null"]
          format: date-time
        cooldown_starts_at:
          type: ["string", "null"]
          format: date-time
        confirmed_twice_at:
          type: ["string", "null"]
          format: date-time
      required:
        [
