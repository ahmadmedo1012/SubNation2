  /admin/referrals/{id}/credit:
    post:
      operationId: creditReferral
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Credit the referrer +50 loyalty points for a referral event (requireAdmin + users scope)
      description: |
        Status-guarded in a transaction (WHERE status='pending') — a
        concurrent credit loses the race and gets 409 ALREADY_EXISTS
        instead of double-granting. Mounted behind the idempotency
        middleware (routeKey admin.referrals.credit). A loyalty
        notification is created for the referrer.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: referral_events.id
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Idempotency key (≥ 8 chars to engage; 24h dedup per admin +
            route) — dedupes admin double-clicks.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Points granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  points_credited:
                    type: integer
                    description: Points granted (POINTS_PER_REFERRAL = 50).
                required: [success, points_credited]
        "400":
          description: Event already credited (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing users permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Referral event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Concurrent credit race (ALREADY_EXISTS)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Transaction failure (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

