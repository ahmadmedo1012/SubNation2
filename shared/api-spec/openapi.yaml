  # ──────────────────────────────────────────────────────────────────────────
  # AI Admin Copilot (010-ai-admin-copilot)
  #
  # All routes require an authenticated admin session and are subject to the
  # per-admin copilot rate limit (30/min, 200/hour, sliding windows). Mutation
  # paths (/confirm, /double-confirm) are the ONLY ones that change domain
  # state via the copilot — the LLM never proposes execution.
  # ──────────────────────────────────────────────────────────────────────────
  /admin/copilot/ask:
    post:
      operationId: copilotAsk
      tags: [copilot]
      summary: Read-only natural-language query (Phase 1 — no writes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: SSE stream of token / tool_use / tool_result / done events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Copilot phase disabled or LLM unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/draft:
    post:
      operationId: copilotDraft
      tags: [copilot]
      summary: Draft an action and return a preview (Phase 2+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: Draft accepted; preview persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotDraftResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "409":
          description: Validation rejected the proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "422":
          description: Bulk row cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}:
    get:
      operationId: copilotGetPreview
      tags: [copilot]
      summary: Fetch a pending preview the requesting admin owns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotPreviewView"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or owned by another admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/cancel:
    post:
      operationId: copilotCancelPreview
      tags: [copilot]
      summary: Cancel a pending preview without executing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled (copilot_actions row written with outcome=cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or owned by another admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/confirm:
    post:
      operationId: copilotConfirm
      tags: [copilot]
      summary: Single confirmation; executes low-risk or starts high-risk cooldown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executed (low-risk) or first-confirm recorded (high-risk)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConfirmResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope, ownership mismatch, or no_execute tier (wallet handoff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale record or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/double-confirm:
    post:
      operationId: copilotDoubleConfirm
      tags: [copilot]
      summary: Second confirmation for high-risk; executes after 3-second cooldown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConfirmResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope or ownership mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale, already consumed, or first-confirm missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "425":
          description: Cooldown not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/history:
    get:
      operationId: copilotHistory
      tags: [copilot]
      summary: Browse the requesting admin's copilot action history
      parameters:
        - name: action_class
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - partial
              - failure
              - refused
              - validation_rejected
              - rate_limited
              - stale
              - expired
              - cancelled
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: integer
        - name: since_iso
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page of history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CopilotHistoryEntry"
                  next_cursor:
                    type: ["string", "null"]
                required: [entries]
        "400":
          description: Invalid query (e.g. entity_id without entity_type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # Standard error envelope. Every non-2xx /api response carries
    # {error, code} — createErrorResponse (backend/src/lib/errors.ts), the
    # rate limiters, mapServiceErrorToCode and the global handler all
    # produce it. Zod-backed ValidationError bodies may additionally carry
    # `details` (zod issue arrays) or other extra keys, but the guaranteed
    # contract is {error, code}.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        details:
          type: object
          additionalProperties: true
          description: |
            Optional structured context — zod `issues` on validation
            failures, `{field}` hints on flash-sale validation errors,
            `{skipped_duplicates}` on inventory uploads.
      required: [error, code]

    # Machine-readable error codes — mirrors the shared ErrorCode enum
    # in @workspace/error-codes (shared/error-codes/src/index.ts), the
    # single source both backend and frontend re-export.
    ErrorCode:
      type: string
      enum:
        - INVALID_DATA
        - INVALID_PHONE
        - INVALID_PASSWORD_LENGTH
        - INVALID_PASSWORD_WEAK
        - INVALID_OTP
        - INVALID_CREDENTIAL
        - UNAUTHORIZED
        - INVALID_TOKEN
        - SESSION_EXPIRED
        - ACCOUNT_LOCKED
        - ACCOUNT_NOT_FOUND
        - PHONE_ALREADY_REGISTERED
        - FEATURE_DISABLED
        - FORBIDDEN
        - INSUFFICIENT_PERMISSIONS
        - NOT_FOUND
        - ALREADY_EXISTS
        - CONFLICT
        - OUT_OF_STOCK
        - PRODUCT_UNAVAILABLE
        - INSUFFICIENT_BALANCE
        - INVALID_AMOUNT
        - TOPUP_LIMIT_EXCEEDED
        - ORDER_NOT_FOUND
        - ORDER_ALREADY_COMPLETED
        - ORDER_CANNOT_CANCEL
        - GOOGLE_TOKEN_INVALID
        - GOOGLE_VERIFICATION_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - RATE_LIMITED
        - IDEMPOTENCY_IN_FLIGHT
        - IDEMPOTENCY_KEY_REUSE
        - COPILOT_INVALID_INPUT
        - COPILOT_LLM_ERROR
        - COPILOT_NO_ADMIN_SESSION
        - COPILOT_BAD_METHOD

    # 409 body returned by the idempotency middleware
    # (backend/src/middlewares/idempotency.ts): the same Idempotency-Key
    # re-sent with a different body (IDEMPOTENCY_KEY_REUSE) or the same
    # key while the original request is still executing
    # (IDEMPOTENCY_IN_FLIGHT). `message` is a legacy alias kept for older
    # clients — `error` is the canonical field.
    IdempotencyConflictResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always false on these conflicts.
        error:
          type: string
        message:
          type: string
        code:
          type: string
          enum: [IDEMPOTENCY_IN_FLIGHT, IDEMPOTENCY_KEY_REUSE]
      required: [success, error, message, code]

    # 429 body from POST /wallet/topups — the standard {error, code}
    # envelope plus pending-count context (wallet.ts MAX_PENDING guard;
    # not produced by createErrorResponse).
    TopupLimitErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [TOPUP_LIMIT_EXCEEDED]
        pending_count:
          type: integer
          description: The user's current pending top-up request count.
        limit:
          type: integer
          description: Max concurrent pending top-ups per user (3).
      required: [error, code, pending_count, limit]

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        referral_code:
          type: ["string", "null"]
      required: [phone, password]

    LoginBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required: [phone, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        lifetime_spend:
          type: number
        referral_code:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, phone, wallet_balance, loyalty_points, loyalty_tier, lifetime_spend]

    # ── Products ──────────────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        description_long:
          type: ["string", "null"]
        faq:
          type: ["array", "null"]
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
            required: [question, answer]
        image_url:
          type: ["string", "null"]
        price:
          type: number
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        usage_terms:
          type: ["string", "null"]
        stock_count:
          type: integer
        is_available:
          type: boolean
        sale_price:
          type: ["number", "null"]
        discount_percent:
          type: ["number", "null"]
        order_count:
          type: integer
      required: [id, name, price, is_active, stock_count, is_available, order_count]

    ProductRecommendation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        image_url:
          type: ["string", "null"]
        price:
          type: number
      required: [id, name, price]

    CatalogStats:
      type: object
      properties:
        total_products:
          type: integer
        available_products:
          type: integer
        total_units:
          type: integer
        lowest_price:
          type: ["number", "null"]
        has_flash_sale:
          type: boolean
      required: [total_products, available_products, total_units, has_flash_sale]

    FlashSaleResponse:
      type: object
      properties:
        flash_sale:
          type: ["object", "null"]
          properties:
            id:
              type: integer
            title:
              type: string
            discount_percent:
              type: number
            ends_at:
              type: string
          required: [id, title, discount_percent, ends_at]
      required: [flash_sale]

    # ── Orders ────────────────────────────────────────────────────────────────
    CreateOrderBody:
      type: object
      properties:
        product_id:
          type: integer
        coupon_code:
          type: ["string", "null"]
      required: [product_id]

    Order:
      type: object
      properties:
        id:
          type: integer
        order_code:
          type: string
        product_id:
          type: integer
        product_name:
          type: string
        product_image_url:
          type: ["string", "null"]
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        delivered_extra_details:
          type: ["string", "null"]
        delivered_usage_terms:
          type: ["string", "null"]
        delivered_at:
          type: ["string", "null"]
        coupon_code:
          type: ["string", "null"]
        discount_amount:
          type: number
        wallet_balance_before:
          type: number
        wallet_balance_after:
          type: number
        created_at:
          type: string
      required: [id, order_code, product_id, product_name, amount, status, created_at]

    UserSession:
      type: object
      properties:
        id:
          type: string
        device:
          type: string
        ip:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        expires_at:
          type: ["string", "null"]
        lastActive:
          type: string
        current:
          type: boolean

    # ── Wallet ────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      properties:
        balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        pending_topups_count:
          type: integer
        recent_orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required: [balance, loyalty_points, loyalty_tier, pending_topups_count, recent_orders]

    CreateTopupBody:
      type: object
      description: |
        Conditional requirements enforced by the handler (all 400
        INVALID_DATA): payment_network is required when payment_method is
        mobile_transfer; sender_account is required for lypay;
        sender_phone, when present with mobile_transfer, must be a valid
        Libyan phone number.
      properties:
        amount:
          type: number
          description: Top-up amount in LYD (0.01 .. 10,000).
          minimum: 0.01
          maximum: 10000
        payment_method:
          type: string
          enum: [mobile_transfer, lypay]
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
          maxLength: 255
      required: [amount]

    Topup:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        payment_method:
          type: string
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
        reviewed_at:
          type: ["string", "null"]
      required: [id, amount, payment_method, status, created_at]

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      description: |
        Cart line with a pricing snapshot (flash-sale values come from a
        30s in-process cache). `subtotal` = effective price × quantity,
        2dp. product_name is "منتج محذوف" (deleted product) when the row
        outlives its product.
      properties:
        id:
          type: integer
        product_id:
          type: integer
        product_name:
          type: string
        product_slug:
          type: ["string", "null"]
        product_image_url:
          type: ["string", "null"]
        price:
          type: number
          description: Base price.
        sale_price:
          type: ["number", "null"]
          description: Flash-sale price (2dp) — null when no active sale.
        discount_percent:
          type: ["number", "null"]
          description: Flash-sale percent — null when 0.
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        subtotal:
          type: number
        created_at:
          type: string
      required: [id, product_id, product_name, price, quantity, subtotal, created_at]

    AddCartItemBody:
      type: object
      description: |
        NOTE: the field is snake_case `product_id` — the frontend local
        cart store uses camelCase productId and does not call this
        endpoint today.
      properties:
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Defaults to 1 when omitted (MAX_QUANTITY cap is 99).
      required: [product_id]

    UpdateCartItemBody:
      type: object
      description: Replaces the quantity (not an increment).
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [quantity]

    # ── Coupons ──────────────────────────────────────────────────────────────
    ValidateCouponBody:
      type: object
      properties:
        code:
          type: string
          description: Trimmed + uppercased for lookup.
        order_amount:
          type: number
          description: The order total the coupon is validated against (must be > 0).
          exclusiveMinimum: 0
      required: [code, order_amount]

    ValidatedCoupon:
      type: object
      properties:
        valid:
          type: boolean
          description: Always true on 200.
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        discount_amount:
          type: number
        final_amount:
          type: number
        description:
          type: ["string", "null"]
      required: [valid, code, type, value, discount_amount, final_amount]

    Coupon:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        min_order_amount:
          type: number
        max_uses:
          type: ["integer", "null"]
        used_count:
          type: integer
        expires_at:
          type: ["string", "null"]
        is_active:
          type: boolean
        description:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, code, type, value, used_count, is_active, created_at]

    CreateCouponBody:
      type: object
      description: |
        `code` is uppercased before insert. Percentage coupons must have
        value ≤ 100 (checked after parse with a specific message); fixed
        values are bounded at 10,000 LYD — a direct wallet-debit magnitude
        at checkout.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        min_order_amount:
          type: number
          minimum: 0
          maximum: 1000000
          description: Defaults to 0.
        max_uses:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000000
        expires_at:
          type: ["string", "null"]
          description: ISO date or date-time string; null = never expires.
        description:
          type: ["string", "null"]
          maxLength: 200
      required: [code, type, value]

    PatchCouponBody:
      type: object
      description: Strict body — unknown keys are a 400 (zod .strict()).
      properties:
        is_active:
          type: boolean
        max_uses:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000000
        expires_at:
          type: ["string", "null"]
          description: ISO date or date-time string; null = never expires.
        description:
          type: ["string", "null"]
          maxLength: 200

    # ── Loyalty ──────────────────────────────────────────────────────────────
    LoyaltySummary:
      type: object
      description: |
        Constants: POINTS_PER_LYD = 100, POINTS_PER_REFERRAL = 50; tiers
        silver=500 / gold=2000 / platinum=5000 lifetime spend. NOTE:
        points_value_lyd is a STRING (toFixed(2)).
      properties:
        points:
          type: integer
        tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        lifetime_spend:
          type: number
        referral_code:
          type: string
          description: "Empty string when unset."
        referral_link:
          type: string
        referred_by:
          type: ["string", "null"]
        referrals_total:
          type: integer
        referrals_credited:
          type: integer
        referrals_pending:
          type: integer
        points_value_lyd:
          type: string
          description: points / 100, formatted with 2 decimals (e.g. "12.00").
        next_tier:
          type: ["object", "null"]
          description: null at platinum.
          properties:
            tier:
              type: string
            label:
              type: string
              description: Arabic tier label ("فضي" / "ذهبي" / "بلاتيني").
            remaining:
              type: number
              description: Lifetime spend still needed for the next tier.
          required: [tier, label, remaining]
        tier_thresholds:
          type: object
          properties:
            silver:
              type: number
            gold:
              type: number
            platinum:
              type: number
          required: [silver, gold, platinum]
        points_rate:
          type: object
          properties:
            points_per_referral:
              type: integer
            points_per_lyd:
              type: integer
          required: [points_per_referral, points_per_lyd]
      required:
        [
          points,
          tier,
          lifetime_spend,
          referral_code,
          referral_link,
          referrals_total,
          referrals_credited,
          referrals_pending,
          points_value_lyd,
          next_tier,
          tier_thresholds,
          points_rate,
        ]

    ConvertPointsBody:
      type: object
      description: |
        The handler parseInt()s the raw body value, so a numeric string
        ("500") is also accepted — a JSON number is the documented shape.
        Values below 100 or not a multiple of 100 → 400 INVALID_DATA.
      properties:
        points:
          oneOf:
            - type: integer
              minimum: 100
              multipleOf: 100
            - type: string
              description: Numeric string, coerced via parseInt.
      required: [points]

    ConvertPointsResult:
      type: object
      properties:
        success:
          type: boolean
        points_spent:
          type: integer
        lyd_credited:
          type: number
        new_points:
          type: integer
        new_balance:
          type: number
        message:
          type: string
          description: Arabic success message with the converted amount.
      required: [success, points_spent, lyd_credited, new_points, new_balance, message]

    ReferralEventItem:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, credited]
        phone_masked:
          type: string
          description: Referee phone masked ("091****789").
        created_at:
          type: string
        credited_at:
          type: ["string", "null"]
        points_earned:
          type: integer
          description: 50 when credited, else 0.
      required: [id, status, phone_masked, created_at, credited_at, points_earned]

    # ── Support ──────────────────────────────────────────────────────────────
    SupportTicketSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [billing, technical, order, account, other]
        status:
          type: string
          enum: [open, in_progress, closed]
        created_at:
          type: string
        last_reply:
          type: ["object", "null"]
          description: Most recent reply (first 80 chars) — null when the ticket has no replies.
          properties:
            author_type:
              type: string
              enum: [user, admin]
            message:
              type: string
            created_at:
              type: string
          required: [author_type, message, created_at]
      required: [id, title, category, status, created_at, last_reply]

    CreateSupportTicketBody:
      type: object
      description: |
        title and message are trimmed; an unknown category silently
        falls back to "other".
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
          description: Becomes the first reply (author_type=user).
        category:
          type: string
          enum: [billing, technical, order, account, other]
      required: [title, message]

    SupportTicketCreated:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [open]
        created_at:
          type: string
      required: [id, title, status, created_at]

    SupportTicketDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [billing, technical, order, account, other]
        status:
          type: string
          enum: [open, in_progress, closed]
        created_at:
          type: string
        replies:
          type: array
          description: Full messages, oldest first.
          items:
            $ref: "#/components/schemas/TicketReply"
      required: [id, title, category, status, created_at, replies]

    ReplySupportTicketBody:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required: [message]

    TicketReply:
      type: object
      properties:
        id:
          type: integer
        author_type:
          type: string
          enum: [user, admin]
        message:
          type: string
        created_at:
          type: string
      required: [id, author_type, message, created_at]

    # ── Notifications ─────────────────────────────────────────────────────────
    NotificationItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          description: e.g. "order" | "loyalty" | "system".
        title:
          type: string
        message:
          type: ["string", "null"]
        link:
          type: ["string", "null"]
        is_read:
          type: boolean
        created_at:
          type: string
      required: [id, type, title, is_read, created_at]

    # ── Admin ─────────────────────────────────────────────────────────────────
    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        display_name:
          type: string
        requires_2fa:
          type: boolean
        temp_token:
          type: string

    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        total_orders:
          type: integer
        total_revenue:
          type: number
        pending_topups:
          type: integer
        today_orders:
          type: integer
        today_revenue:
          type: number
        available_stock:
          type: integer
        total_wallet_balance:
          type: number
      required:
        [
          total_users,
          total_orders,
          total_revenue,
          pending_topups,
          today_orders,
          today_revenue,
          available_stock,
          total_wallet_balance,
        ]

    # Identity-enrichment fields (user_display_name … user_has_whatsapp)
    # feed the admin display helper (frontend lib/admin/user-display.ts):
    # best human-readable name + provider badges.
    AdminOrder:
      type: object
      properties:
        id:
          type: integer
        order_code:
          type: string
        user_phone:
          type: string
        user_display_name:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        user_auth_provider:
          type: ["string", "null"]
        user_has_google:
          type: boolean
        user_has_telegram:
          type: boolean
        user_has_firebase:
          type: boolean
        user_has_whatsapp:
          type: boolean
        product_name:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        delivered_extra_details:
          type: ["string", "null"]
        coupon_code:
          type: ["string", "null"]
        discount_amount:
          type: number
        created_at:
          type: string
      required: [id, order_code, user_phone, product_name, amount, status, created_at]

    # Identity-enrichment fields (user_display_name … user_has_whatsapp)
    # feed the admin display helper — same pattern as AdminOrder.
    AdminTopup:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_phone:
          type: string
        user_display_name:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        user_auth_provider:
          type: ["string", "null"]
        user_has_google:
          type: boolean
        user_has_telegram:
          type: boolean
        user_has_firebase:
          type: boolean
        user_has_whatsapp:
          type: boolean
        amount:
          type: number
        payment_method:
          type: string
          enum: [mobile_transfer, lypay]
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, user_id, user_phone, amount, payment_method, status, created_at]

    AdminTopupActionBody:
      type: object
      properties:
        admin_note:
          type: ["string", "null"]

    AdminProduct:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
        cost_price:
          type: ["number", "null"]
          description: |
            Operator's procurement cost per unit. Used by the admin
            pricing calculator to compute margin. Nullable for products
            created before this field existed.
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        is_archived:
          type: boolean
        stock_count:
          type: integer
        order_count:
          type: integer
        usage_terms:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, name, price, is_active, is_archived, stock_count, order_count, created_at]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
          # Money-perimeter bound (audit M1): an unbounded price is the
          # deepest money hole in the API — a negative price makes
          # checkout CREDIT the wallet on every purchase (finalPrice
          # negated flips the balance comparison), and Infinity/NaN
          # corrupts every storefront aggregate. 0.01 .. 1,000,000 LYD
          # covers every real product in the catalog with orders of
          # magnitude to spare.
          minimum: 0.01
          maximum: 1000000
        cost_price:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: boolean
      required: [name, price]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
          # Same money-perimeter bounds as CreateProductBody (audit M1).
          minimum: 0.01
          maximum: 1000000
        cost_price:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: ["boolean", "null"]

    # Identity fields (display_name … last_auth_at) let the admin users
    # page render provider badges and search by name when the phone is a
    # placeholder (e.g. tg_<id> for Telegram-first accounts).
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        display_name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_provider:
          type: string
          description: |
            "firebase_phone" | "firebase_google" | "firebase" |
            "telegram" | "whatsapp_phone" | "legacy_password".
        has_google:
          type: boolean
        has_telegram:
          type: boolean
        has_firebase:
          type: boolean
        has_whatsapp:
          type: boolean
        last_auth_at:
          type: ["string", "null"]
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        lifetime_spend:
          type: number
        order_count:
          type: integer
          description: Completed-order count for this user.
        referral_code:
          type: ["string", "null"]
        created_at:
          type: string
      required:
        [
          id,
          phone,
          wallet_balance,
          loyalty_points,
          loyalty_tier,
          lifetime_spend,
          order_count,
          created_at,
        ]

    # ── Admin flash sales ─────────────────────────────────────────────────
    AdminFlashSale:
      type: object
      description: |
        `is_currently_active` is derived (is_active AND ends_at in the
        future) — the admin UI can show historical rows without
        recomputing.
      properties:
        id:
          type: integer
        title:
          type: string
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
        is_active:
          type: boolean
        is_currently_active:
          type: boolean
        created_at:
          type: string
      required: [id, title, discount_percent, ends_at, is_active, is_currently_active, created_at]

    CreateFlashSaleBody:
      type: object
      description: |
        95% ceiling rationale: prevents a "free goods" state when a
        fixed-amount coupon stacks on the sale — use a coupon for deeper
        discounts.
      properties:
        title:
          type: string
          maxLength: 255
          description: Defaults to "Flash Sale" when omitted.
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
          description: ISO date-time — between 5 minutes and 30 days in the future.
      required: [discount_percent, ends_at]

    UpdateFlashSaleBody:
      type: object
      description: At least one field required — an empty body is a 400.
      properties:
        title:
          type: string
          maxLength: 255
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
          description: ISO date-time — at least 5 minutes in the future.
        is_active:
          type: boolean

    # ── Admin bulk order status ────────────────────────────────────────────
    BulkUpdateOrderStatusBody:
      type: object
      description: |
        `ids` accepts numbers or numeric strings (coerced via Number());
        invalid entries and duplicates are dropped and reported
        (skipped_invalid on the 200 response).
      properties:
        ids:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: integer
              - type: string
                description: Numeric string, coerced via Number().
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        note:
          type: string
          description: Optional audit note (stored on refund ledger entries).
      required: [ids, status]

    BulkUpdateOrderStatusResult:
      type: object
      properties:
        success:
          type: boolean
        updated:
          type: integer
          description: Count of orders transitioned (or successfully refunded).
        skipped_invalid:
          type: integer
          description: |
            Count of non-numeric / duplicate ids dropped from the request
            — present only when non-zero.
      required: [success, updated]

    BulkUpdateOrderStatusPartial:
      type: object
      description: 207 (Multi-Status) body — refund batch with per-order failures.
      properties:
        success:
          type: boolean
          description: false — at least one refund failed.
        updated:
          type: integer
          description: Count of orders successfully refunded.
        failed:
          type: array
          items:
            type: object
            properties:
              orderId:
                type: integer
              code:
                type: string
                description: RefundError code for the failed order.
              message:
                type: string
            required: [orderId, code, message]
      required: [success, updated, failed]

    # ──────────────────────────────────────────────────────────────────────
    # AI Admin Copilot schemas (010-ai-admin-copilot)
    # ──────────────────────────────────────────────────────────────────────
    CopilotAskContext:
