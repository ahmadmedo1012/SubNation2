    CopilotBulkPreviewPayload:
      type: object
      properties:
        kind:
          type: string
          enum: [bulk]
        intent_summary:
          type: string
        side_effects:
          type: array
          items:
            type: string
        validation_warnings:
          type: array
          items:
            $ref: "#/components/schemas/CopilotValidationWarning"
        irreversible:
          type: boolean
        total_affected:
          type: integer
          minimum: 1
          maximum: 500
        sample:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/CopilotBulkSampleRow"
        aggregate_impact:
          type: ["object", "null"]
          additionalProperties: true
        predicted_failures:
          type: array
          items:
            $ref: "#/components/schemas/CopilotPredictedFailure"
      required:
        [
          kind,
          intent_summary,
          side_effects,
          validation_warnings,
          irreversible,
          total_affected,
          sample,
          predicted_failures,
        ]

    CopilotPreviewView:
