        outcome:
          type: string
        created_at:
          type: string
          format: date-time
        executed_at:
          type: ["string", "null"]
          format: date-time
        failure_reason:
          type: ["string", "null"]
      required: [id, admin_id, intent_text, action_class, risk_tier, outcome, created_at]
