      summary: List users (requireAdmin + users scope; paginated)
      parameters:
        - name: search
          in: query
          description: Phone substring filter (LIKE %search%).
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          description: |
            1-based page number (offset = (page-1)*limit).
            Round-93 (A8 F-2): this parameter was documented but never
            implemented until this round — every request used to return
            the identical first 100 rows.
          schema:
            type: ["integer", "null"]
            minimum: 1
            default: 1
        - name: limit
          in: query
