openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: SubNation Digital Subscriptions Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: products
    description: Product catalog
  - name: orders
    description: Orders and checkout
  - name: wallet
    description: Wallet and top-ups
  - name: admin
    description: Admin operations
  - name: copilot
    description: AI Admin Copilot — natural-language commands, structured previews, gated execution
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Auth ────────────────────────────────────────────────────────────────────
  /auth/sessions:
    get:
      operationId: listSessions
      tags: [auth]
      summary: List the current user's active session rows
      responses:
        "200":
          description: Session rows written at each login
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserSession"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current user
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user profile
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Products ────────────────────────────────────────────────────────────────
  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List all active products
      parameters:
        - name: category
          in: query
          schema:
            type: ["string", "null"]
        - name: available_only
          in: query
          schema:
            type: ["boolean", "null"]
        - name: sort
          in: query
          schema:
            type: ["string", "null"]
            enum: ["price_asc", "price_desc", "popular", "newest", null]
        - name: search
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get product by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}/recommendations:
    get:
      operationId: getProductRecommendations
      tags: [products]
      summary: Get recommended products related to a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of recommended products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductRecommendation"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /catalog/stats:
    get:
      operationId: getCatalogStats
      tags: [products]
      summary: Get catalog summary stats
      responses:
        "200":
          description: Catalog stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogStats"

  /flash-sale:
    get:
      operationId: getFlashSale
      tags: [products]
      summary: Get active flash sale
      responses:
        "200":
          description: Active flash sale or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlashSaleResponse"

  # ── Orders ──────────────────────────────────────────────────────────────────
  /products/by-slug/{slug}:
    get:
      operationId: getProductBySlug
      tags: [products]
      summary: Product detail by slug (SEO route + crawler hits)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Product detail (same shape as /products/{id}, plus faq)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders:
    get:
      operationId: listOrders
      tags: [orders]
      summary: List current user's orders
      responses:
        "200":
          description: User's orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Order"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Purchase a product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderBody"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Insufficient balance or validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Product not found or out of stock
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Concurrent conflict — inventory claimed by another buyer, or coupon exhausted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /orders/{orderCode}:
    get:
      operationId: getOrder
      tags: [orders]
      summary: Get order details by order code
      parameters:
        - name: orderCode
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Wallet ──────────────────────────────────────────────────────────────────
  /wallet:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get wallet info
      responses:
        "200":
          description: Wallet info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletInfo"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /wallet/topups:
    get:
      operationId: listTopups
      tags: [wallet]
      summary: List user's top-up requests
      responses:
        "200":
          description: Top-up history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Topup"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createTopup
      tags: [wallet]
      summary: Submit a top-up request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTopupBody"
      responses:
        "201":
          description: Top-up request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Topup"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Admin ───────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: List all orders
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/topups:
    get:
      operationId: listAdminTopups
      tags: [admin]
      summary: List all top-up requests
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: All topups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTopup"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/topups/{id}/approve:
    post:
      operationId: approveTopup
      tags: [admin]
      summary: Approve a top-up request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopupActionBody"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/topups/{id}/reject:
    post:
      operationId: rejectTopup
      tags: [admin]
      summary: Reject a top-up request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopupActionBody"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      summary: List all products (including inactive)
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createProduct
      tags: [admin]
      summary: Create a new product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductBody"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/{id}:
    patch:
      operationId: updateProduct
      tags: [admin]
      summary: Update a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductBody"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminProduct"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [admin]
      summary: Archive/delete a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all users
      parameters:
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        "200":
          description: All users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminUser"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────────────────────────────────────────────────────────────────────
  # AI Admin Copilot (010-ai-admin-copilot)
  #
  # All routes require an authenticated admin session and are subject to the
  # per-admin copilot rate limit (30/min, 200/hour, sliding windows). Mutation
  # paths (/confirm, /double-confirm) are the ONLY ones that change domain
  # state via the copilot — the LLM never proposes execution.
  # ──────────────────────────────────────────────────────────────────────────
  /admin/copilot/ask:
    post:
      operationId: copilotAsk
      tags: [copilot]
      summary: Read-only natural-language query (Phase 1 — no writes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: SSE stream of token / tool_use / tool_result / done events
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Copilot phase disabled or LLM unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/draft:
    post:
      operationId: copilotDraft
      tags: [copilot]
      summary: Draft an action and return a preview (Phase 2+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: Draft accepted; preview persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotDraftResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "409":
          description: Validation rejected the proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "422":
          description: Bulk row cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}:
    get:
      operationId: copilotGetPreview
      tags: [copilot]
      summary: Fetch a pending preview the requesting admin owns
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Preview body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotPreviewView"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or owned by another admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/cancel:
    post:
      operationId: copilotCancelPreview
      tags: [copilot]
      summary: Cancel a pending preview without executing
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cancelled (copilot_actions row written with outcome=cancelled)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found or owned by another admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/confirm:
    post:
      operationId: copilotConfirm
      tags: [copilot]
      summary: Single confirmation; executes low-risk or starts high-risk cooldown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executed (low-risk) or first-confirm recorded (high-risk)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConfirmResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope, ownership mismatch, or no_execute tier (wallet handoff)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale record or already consumed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/previews/{id}/double-confirm:
    post:
      operationId: copilotDoubleConfirm
      tags: [copilot]
      summary: Second confirmation for high-risk; executes after 3-second cooldown
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Executed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotConfirmResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient scope or ownership mismatch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Stale, already consumed, or first-confirm missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: Preview expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "425":
          description: Cooldown not elapsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/history:
    get:
      operationId: copilotHistory
      tags: [copilot]
      summary: Browse the requesting admin's copilot action history
      parameters:
        - name: action_class
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - partial
              - failure
              - refused
              - validation_rejected
              - rate_limited
              - stale
              - expired
              - cancelled
        - name: entity_type
          in: query
          schema:
            type: string
        - name: entity_id
          in: query
          schema:
            type: integer
        - name: since_iso
          in: query
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page of history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CopilotHistoryEntry"
                  next_cursor:
                    type: ["string", "null"]
                required: [entries]
        "400":
          description: Invalid query (e.g. entity_id without entity_type)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        referral_code:
          type: ["string", "null"]
      required: [phone, password]

    LoginBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required: [phone, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    User:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        lifetime_spend:
          type: number
        referral_code:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, phone, wallet_balance, loyalty_points, loyalty_tier, lifetime_spend]

    # ── Products ──────────────────────────────────────────────────────────────
    Product:
      type: object
