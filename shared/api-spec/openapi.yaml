  /admin/copilot/history:
    get:
      operationId: copilotHistory
      tags: [copilot]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Browse the requesting admin's copilot action history
      parameters:
        - name: action_class
          in: query
          schema:
            type: string
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - success
              - partial
              - failure
              - refused
              - validation_rejected
              - rate_limited
              - stale
              - expired
              - cancelled
        - name: entity_type
          in: query
          deprecated: true
          description: |
            Deprecated (round-94 A5-06): never implemented — the history
            table has no entity columns to filter on (entity data lives on
            the preview rows, not the action rows). Kept as deprecated
            for client compatibility; the filter is a no-op server-side.
          schema:
            type: string
        - name: since_iso
          in: query
          description: |
            Inclusive lower bound on created_at (ISO-8601). The legacy
            `since` alias is still accepted for pre-94 callers; an
            unparseable value now 400s instead of being silently ignored.
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Page of history entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  entries:
                    type: array
                    items:
                      $ref: "#/components/schemas/CopilotHistoryEntry"
                  next_cursor:
                    type: ["string", "null"]
                required: [entries]
        "400":
          description: Unparseable since_iso date value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/diagnostics/inventory-health:
    get:
      operationId: adminDiagnosticsInventoryHealth
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Inventory deliverability health — per-product blast radius of undecryptable/empty units
      description: |
        R93-DATA endpoint (round-94 A5-01: it shipped in 508652d without
        a spec entry and broke the OpenAPI contract gate). Scans up to
        500 unsold inventory units and reports, per product, how many
        have credentials that cannot be delivered: ciphertext that fails
        GCM authentication with the current ENCRYPTION_KEY (wrong or
        rotated key), or units with no deliverable fields at all. The
        checkout guard refuses to sell such units (INVENTORY_CORRUPT);
        this endpoint gives the operator the re-upload worklist in one
        call. Never exposes plaintext.
      responses:
        "200":
          description: Per-product undeliverability report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminInventoryHealthReport"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────────────────────────────────────────────────────────────────────
  # Inbound webhooks — machine-to-machine callers (Telegram), secret-token
  # auth, {ok: boolean} ack envelopes (outside the {error, code} envelope
  # contract that governs human-facing /api JSON responses).
  # ──────────────────────────────────────────────────────────────────────────
  /webhook/telegram:
    post:
      operationId: telegramWebhook
      tags: [webhook]
      security: []
      summary: Telegram bot webhook — executes topup approve/reject callback decisions (money-moving)
      description: |
        Telegram's server-to-server callback endpoint. Mounted at
        /api/webhook/telegram (the /api/webhook prefix is CSRF-skipped —
        Telegram cannot send Origin headers).

        Auth: the `x-telegram-bot-api-secret-token` header must match
        the configured TELEGRAM_WEBHOOK_SECRET (constant-time compare).

        Semantics: when a user submits a wallet topup, the backend posts
        an approval message with inline buttons into the admin Telegram
        group (callback_data `topup_app:{id}` / `topup_rej:{id}`). This
        webhook receives the button taps and executes
        TopupService.approve/reject — gated by the TELEGRAM_ADMIN_IDS
        allowlist (non-allowlisted tappers get an "no permission"
        callback answer and no state change). The tapped message is
        edited with the outcome and its keyboard stripped so a stale
        button cannot be re-tapped.

        Always acks 200 {ok: true} on any auth-accepted update —
        including processing failures — because Telegram aggressively
        retries non-200 responses. Non-JSON content types (setWebhook
        probes) are acked 200 without processing. A plain `/start`
        message gets a reply with the sender's chat/user ids (bootstrap
        for building the TELEGRAM_ADMIN_IDS allowlist).
      parameters:
        - name: x-telegram-bot-api-secret-token
          in: header
          required: true
          description: |
            Shared secret configured on the Telegram setWebhook call;
            compared against TELEGRAM_WEBHOOK_SECRET in constant time.
            (The secret value itself never appears in this spec.)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramWebhookUpdate"
      responses:
        "200":
          description: |
            Update accepted (or non-JSON probe acked). Processing errors
            inside an accepted update also return 200 — Telegram retries
            non-200s, which would re-execute button actions.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookAck"
        "403":
          description: "Missing or wrong secret-token header — body is the non-envelope {ok: false}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookAck"
        "503":
          description: |
            TELEGRAM_WEBHOOK_SECRET not configured on the server — body is
            the non-envelope {ok: false}.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramWebhookAck"

components:
  securitySchemes:
    # Round-93 (93-A8 F-1): the spec previously documented zero security
    # definitions while the middleware reality is cookie-first with a
    # Bearer fallback on user routes, and a separate admin cookie (8h)
    # plus Bearer on admin routes. Both alternatives are expressed per
    # operation via `security: [{ schemeA: [], schemeB: [] }]` (same
    # object = OR).
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: |
        User session — httpOnly cookie set by the auth routes (Google /
        Telegram / WhatsApp-OTP sign-in). SameSite=lax in production
        (single-origin deployment — the backend serves the SPA itself;
        the historical split-era SameSite=None is retired). Primary
        mechanism for browser clients.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        User-session Bearer fallback — `Authorization: Bearer <token>`
        accepted wherever cookieAuth is (requireUser checks the cookie
        first, then the header).
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: |
        Admin session — separate httpOnly cookie (8h) issued by POST
        /admin/login (and verify-2fa when TOTP is enabled).
    adminBearerAuth:
      type: http
      scheme: bearer
      description: |
        Admin-session Bearer alternative — the token returned in the
        POST /admin/login JSON body, accepted wherever adminCookieAuth
        is (requireAdmin accepts either).
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    # Standard error envelope. Every non-2xx /api response carries
    # {error, code} — createErrorResponse (backend/src/lib/errors.ts), the
    # rate limiters, mapServiceErrorToCode and the global handler all
    # produce it. Zod-backed ValidationError bodies may additionally carry
    # `details` (zod issue arrays) or other extra keys, but the guaranteed
    # contract is {error, code}.
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          $ref: "#/components/schemas/ErrorCode"
        details:
          type: object
          additionalProperties: true
          description: |
            Optional structured context — zod `issues` on validation
            failures, `{field}` hints on flash-sale validation errors,
            `{skipped_duplicates}` on inventory uploads.
      required: [error, code]

    # Machine-readable error codes — mirrors the shared ErrorCode enum
    # in @workspace/error-codes (shared/error-codes/src/index.ts), the
    # single source both backend and frontend re-export. The copilot
    # preview/execution family (round-92 B3/F-05) closes the gap where
    # backend/src/routes/admin/copilot/* returned codes outside the enum.
    ErrorCode:
      type: string
      enum:
        - INVALID_DATA
        - INVALID_PHONE
        - INVALID_PASSWORD_LENGTH
        - INVALID_PASSWORD_WEAK
        - INVALID_OTP
        - INVALID_CREDENTIAL
        - UNAUTHORIZED
        - INVALID_TOKEN
        - SESSION_EXPIRED
        - ACCOUNT_LOCKED
        - ACCOUNT_NOT_FOUND
        - PHONE_ALREADY_REGISTERED
        - FEATURE_DISABLED
        - FORBIDDEN
        - INSUFFICIENT_PERMISSIONS
        - NOT_FOUND
        - ALREADY_EXISTS
        - CONFLICT
        - OUT_OF_STOCK
        - PRODUCT_UNAVAILABLE
        - INSUFFICIENT_BALANCE
        - INVALID_AMOUNT
        - TOPUP_LIMIT_EXCEEDED
        - ORDER_NOT_FOUND
        - ORDER_ALREADY_COMPLETED
        - ORDER_CANNOT_CANCEL
        - GOOGLE_TOKEN_INVALID
        - GOOGLE_VERIFICATION_FAILED
        - INTERNAL_ERROR
        - SERVICE_UNAVAILABLE
        - RATE_LIMITED
        - IDEMPOTENCY_IN_FLIGHT
        - IDEMPOTENCY_KEY_REUSE
        - COPILOT_INVALID_INPUT
        - COPILOT_LLM_ERROR
        - COPILOT_NO_ADMIN_SESSION
        - COPILOT_BAD_METHOD
        - COPILOT_PREVIEW_NOT_FOUND
        - COPILOT_PREVIEW_CONSUMED
        - COPILOT_PREVIEW_EXPIRED
        - COPILOT_HANDOFF_REQUIRED
        - COPILOT_HIGH_RISK_DISABLED
        - COPILOT_STALE_RECORD
        - COPILOT_UNEXPECTED_STATE
        - COPILOT_EXECUTE_FAILED
        - COPILOT_NOT_HIGH_RISK
        - COPILOT_FIRST_CONFIRM_MISSING
        - COPILOT_COOLDOWN_NOT_ELAPSED
        - COPILOT_LLM_UNAVAILABLE
        - COPILOT_OUT_OF_SCOPE
        - COPILOT_INVALID_FLAGS
        # Round-93 (93-A8 F-8/F-15): two emitted codes that previously
        # lived outside the whole code contract — the copilot rate
        # limiter's 429 body and the CSRF gate's fail-closed
        # misconfiguration branch. The enum stays exhaustive over what
        # the backend actually emits.
        - COPILOT_RATE_LIMITED
        - CSRF_CONFIG
        # Round-94 (A5-05): the last two emitted-but-unenumerated codes —
        # the copilot phase-gate 503 (requireCopilotPhase) and the
        # outbound secret-scan 502 abort (ask/draft routes).
        - COPILOT_PHASE_DISABLED
        - COPILOT_SECRET_LEAK

    # 409 body returned by the idempotency middleware
    # (backend/src/middlewares/idempotency.ts): the same Idempotency-Key
    # re-sent with a different body (IDEMPOTENCY_KEY_REUSE) or the same
    # key while the original request is still executing
    # (IDEMPOTENCY_IN_FLIGHT). `message` is a legacy alias kept for older
    # clients — `error` is the canonical field.
    IdempotencyConflictResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Always false on these conflicts.
        error:
          type: string
        message:
          type: string
        code:
          type: string
          enum: [IDEMPOTENCY_IN_FLIGHT, IDEMPOTENCY_KEY_REUSE]
      required: [success, error, message, code]

    # 429 body from POST /wallet/topups — the standard {error, code}
    # envelope plus pending-count context (wallet.ts MAX_PENDING guard;
    # not produced by createErrorResponse).
    TopupLimitErrorResponse:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          enum: [TOPUP_LIMIT_EXCEEDED]
        pending_count:
          type: integer
          description: The user's current pending top-up request count.
        limit:
          type: integer
          description: Max concurrent pending top-ups per user (3).
      required: [error, code, pending_count, limit]

    # 429 body from the copilot rate limiter
    # (backend/src/lib/copilot/rate-limit.ts — 30/min + 200/h sliding
    # windows per admin). Round-93 (93-A8 F-8): the emitted
    # COPILOT_RATE_LIMITED code and these extras were previously
    # undocumented; the Retry-After response header carries the same
    # value as retry_after_seconds.
    CopilotRateLimitResponse:
      type: object
      properties:
        error:
          type: string
          description: Arabic human-readable message.
        code:
          type: string
          enum: [COPILOT_RATE_LIMITED]
        retry_after_seconds:
          type: integer
          description: Seconds until the sliding window admits the admin again.
        window:
          type: string
          enum: ["1m", "1h"]
          description: Which window tripped — per-minute (30) or per-hour (200).
      required: [error, code, retry_after_seconds, window]

    # ── Auth ──────────────────────────────────────────────────────────────────
    RegisterBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
        referral_code:
          type: ["string", "null"]
      required: [phone, password]

    LoginBody:
      type: object
      properties:
        phone:
          type: string
        password:
          type: string
      required: [phone, password]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required: [user, token]

    User:
      type: object
      description: >
        /auth/me and /auth/probe additionally return the linked_identities
        array (see LinkedIdentity). (Fields email…onboarding_step added
        round-98 to match what formatUser has serialized all along — the
        spec gap forced local re-declarations in profile/checkout.)
      properties:
        id:
          type: integer
        phone:
          type: string
        email:
          type: ["string", "null"]
        email_verified:
          type: boolean
        phone_verified:
          type: boolean
        display_name:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_provider:
          type: string
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        lifetime_spend:
          type: number
        referral_code:
          type: ["string", "null"]
        onboarded_at:
          type: ["string", "null"]
        onboarding_step:
          type: integer
        created_at:
          type: string
        linked_identities:
          type: array
          description: Present on /auth/me and /auth/probe responses only.
          items:
            $ref: "#/components/schemas/LinkedIdentity"
      required: [id, phone, wallet_balance, loyalty_points, loyalty_tier, lifetime_spend]

    LinkedIdentity:
      type: object
      description: A social/provider identity linked to the account (provider-linking flows).
      properties:
        provider:
          type: string
        provider_uid:
          type: string
        email:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        linked_at:
          type: ["string", "null"]
        last_seen_at:
          type: ["string", "null"]
      required: [provider, provider_uid]

    # ── Products ──────────────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        description_long:
          type: ["string", "null"]
        faq:
          type: ["array", "null"]
          items:
            type: object
            properties:
              question:
                type: string
              answer:
                type: string
            required: [question, answer]
        features:
          type: ["array", "null"]
          items:
            type: string
          description: >
            Marketing feature bullets (Arabic). Returned on the detail
            endpoints (/products/:id and /products/by-slug/:slug) — the
            list endpoint may omit it. (Contract added round-98: the
            backend serialized features from the start; the spec gap
            forced a local `any` cast in the storefront.)
        seo_title:
          type: ["string", "null"]
          description: Operator override for the product page <title>.
        seo_description:
          type: ["string", "null"]
          description: Operator override for the meta description.
        image_url:
          type: ["string", "null"]
        price:
          type: number
          description: >
            Cheapest active variant's LYD price when variants exist
            (MIN(variants.price) — the storefront "تبدأ من" number),
            otherwise the product-level LYD price.
        price_from:
          type: boolean
          description: True when multiple active variants exist (card renders "تبدأ من").
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        usage_terms:
          type: ["string", "null"]
        stock_count:
          type: integer
        is_available:
          type: boolean
        sale_price:
          type: ["number", "null"]
        discount_percent:
          type: ["number", "null"]
        order_count:
          type: integer
        variants:
          type: array
          description: >
            Catalog sellable options (Plan × Duration). PUBLIC DTO by
            design — carries labels, LYD price and availability ONLY.
            Internal fields (cost_price, sku, supplier identity) are
            never serialized here.
          items:
            $ref: "#/components/schemas/ProductVariant"
      required:
        [id, name, price, price_from, is_active, stock_count, is_available, order_count, variants]

    ProductVariant:
      type: object
      description: >
        Public catalog variant DTO. Deliberately excludes every internal
        field (cost_price, sku, provider identity) — those exist in the
        database and admin APIs only.
      properties:
        id:
          type: integer
        plan_label:
          type: ["string", "null"]
          description: Tier axis label (e.g. "فردي", "عائلي", "أساسي") — null when the product only varies by duration.
        duration_label:
          type: ["string", "null"]
          description: Validity axis label (e.g. "1 شهر", "سنة", "مدى الحياة").
        label:
          type: string
          description: 'Joined display label "plan — duration" (single axis: the axis itself).'
        price:
          type: number
          description: Retail price in LYD.
        sale_price:
          type: ["number", "null"]
        discount_percent:
          type: ["number", "null"]
        is_available:
          type: boolean
      required: [id, label, price, is_available]

    ProductRecommendation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        image_url:
          type: ["string", "null"]
        price:
          type: number
      required: [id, name, price]

    CatalogStats:
      type: object
      properties:
        total_products:
          type: integer
        available_products:
          type: integer
        total_units:
          type: integer
        lowest_price:
          type: ["number", "null"]
        has_flash_sale:
          type: boolean
      required: [total_products, available_products, total_units, has_flash_sale]

    FlashSaleResponse:
      type: object
      properties:
        flash_sale:
          type: ["object", "null"]
          properties:
            id:
              type: integer
            title:
              type: string
            discount_percent:
              type: number
            ends_at:
              type: string
          required: [id, title, discount_percent, ends_at]
      required: [flash_sale]

    # ── Orders ────────────────────────────────────────────────────────────────
    CreateOrderBody:
      type: object
      properties:
        product_id:
          type: integer
        variant_id:
          type: ["integer", "null"]
          description: >
            The selected catalog variant (product_variants.id). Optional:
            when omitted and the product has active variants, the cheapest
            active one is charged (matching the storefront display price).
        coupon_code:
          type: ["string", "null"]
      required: [product_id]

    Order:
      type: object
      description: |
        Delivered-credential fields (delivered_email, delivered_password,
        delivered_extra_details, delivered_usage_terms) are non-null ONLY
        while status is "completed" (B2-03 round-92 + P0-sim round-93):
        refund nulls email/password/extra_details in the refund
        transaction and the API gate nulls every other non-completed
        state. Encrypted-at-rest fields are decrypted at the boundary;
        usage terms are catalog text (present for completed orders).
      properties:
        id:
          type: integer
        order_code:
          type: string
        product_id:
          type: integer
        variant_id:
          type: ["integer", "null"]
          description: The purchased catalog variant (null for legacy pre-2026-09-20 orders).
        variant_label:
          type: ["string", "null"]
          description: Immutable historical copy of the purchased option's display label.
        product_name:
          type: string
        product_image_url:
          type: ["string", "null"]
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        delivered_extra_details:
          type: ["string", "null"]
        delivered_usage_terms:
          type: ["string", "null"]
        delivered_at:
          type: ["string", "null"]
        coupon_code:
          type: ["string", "null"]
        discount_amount:
          type: number
        created_at:
          type: string
      required: [id, order_code, product_id, product_name, amount, status, created_at]

    UserSession:
      type: object
      properties:
        id:
          type: string
        device:
          type: string
        ip:
          type: ["string", "null"]
        created_at:
          type: ["string", "null"]
        expires_at:
          type: ["string", "null"]
        lastActive:
          type: string
        current:
          type: boolean

    # ── Wallet ────────────────────────────────────────────────────────────────
    WalletInfo:
      type: object
      properties:
        balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
        pending_topups_count:
          type: integer
        recent_orders:
          type: array
          items:
            $ref: "#/components/schemas/Order"
      required: [balance, loyalty_points, loyalty_tier, pending_topups_count, recent_orders]

    CreateTopupBody:
      type: object
      description: |
        Conditional requirements enforced by the handler (all 400
        INVALID_DATA): payment_network is required when payment_method is
        mobile_transfer; sender_account is required for lypay;
        sender_phone, when present with mobile_transfer, must be a valid
        Libyan phone number. payment_reference, when present, is trimmed
        by the handler and rejected when longer than 100 chars after trim
        (F-03 round-93: one approved topup per non-blank reference — the
        duplicate-transfer guard).
      properties:
        amount:
          type: number
          description: Top-up amount in LYD (0.01 .. 10,000).
          minimum: 0.01
          maximum: 10000
        payment_method:
          type: string
          enum: [mobile_transfer, lypay]
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
          maxLength: 100
          description: |
            Bank transfer receipt / transaction id (optional). Stored
            trimmed; an approved topup permanently claims a non-blank
            reference (409 on reuse — the same transfer cannot be
            credited twice), and approving a referenced topup whose
            (amount, network, sender) matches another approved one
            within 24h returns 409 DUPLICATE_PAYMENT_REFERENCE.
      required: [amount]

    Topup:
      type: object
      properties:
        id:
          type: integer
        amount:
          type: number
        payment_method:
          type: string
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
        reviewed_at:
          type: ["string", "null"]
      required: [id, amount, payment_method, status, created_at]

    # ── Cart ─────────────────────────────────────────────────────────────────
    CartItem:
      type: object
      description: |
        Cart line with a pricing snapshot (flash-sale values come from a
        30s in-process cache). `subtotal` = effective price × quantity,
        2dp. product_name is "منتج محذوف" (deleted product) when the row
        outlives its product.
      properties:
        id:
          type: integer
        product_id:
          type: integer
        variant_id:
          type: ["integer", "null"]
          description: Selected catalog variant for this line (null = legacy/variant-less).
        variant_label:
          type: ["string", "null"]
        product_name:
          type: string
        product_slug:
          type: ["string", "null"]
        product_image_url:
          type: ["string", "null"]
        price:
          type: number
          description: Base price (variant price when a variant is selected).
        sale_price:
          type: ["number", "null"]
          description: Flash-sale price (2dp) — null when no active sale.
        discount_percent:
          type: ["number", "null"]
          description: Flash-sale percent — null when 0.
        quantity:
          type: integer
          minimum: 1
          maximum: 99
        subtotal:
          type: number
        created_at:
          type: string
      required: [id, product_id, product_name, price, quantity, subtotal, created_at]

    AddCartItemBody:
      type: object
      description: |
        NOTE: the field is snake_case `product_id` — the frontend local
        cart store uses camelCase productId and does not call this
        endpoint today. variant_id is optional: when the product has
        variants, the line's variant is set (replace semantics if the
        product is already in the cart).
      properties:
        product_id:
          type: integer
        variant_id:
          type: ["integer", "null"]
        quantity:
          type: integer
          minimum: 1
          maximum: 99
          description: Defaults to 1 when omitted (MAX_QUANTITY cap is 99).
      required: [product_id]

    UpdateCartItemBody:
      type: object
      description: Replaces the quantity (not an increment).
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 99
      required: [quantity]

    # ── Coupons ──────────────────────────────────────────────────────────────
    ValidateCouponBody:
      type: object
      properties:
        code:
          type: string
          description: Trimmed + uppercased for lookup.
        order_amount:
          type: number
          description: The order total the coupon is validated against (must be > 0).
          exclusiveMinimum: 0
      required: [code, order_amount]

    ValidatedCoupon:
      type: object
      properties:
        valid:
          type: boolean
          description: Always true on 200.
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        discount_amount:
          type: number
        final_amount:
          type: number
        description:
          type: ["string", "null"]
      required: [valid, code, type, value, discount_amount, final_amount]

    Coupon:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
        min_order_amount:
          type: number
        max_uses:
          type: ["integer", "null"]
        used_count:
          type: integer
        expires_at:
          type: ["string", "null"]
        is_active:
          type: boolean
        description:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, code, type, value, used_count, is_active, created_at]

    CreateCouponBody:
      type: object
      description: |
        `code` is uppercased before insert. Percentage coupons must have
        value ≤ 100 (checked after parse with a specific message); fixed
        values are bounded at 10,000 LYD — a direct wallet-debit magnitude
        at checkout.
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
        type:
          type: string
          enum: [percentage, fixed]
        value:
          type: number
          exclusiveMinimum: 0
          maximum: 10000
        min_order_amount:
          type: number
          minimum: 0
          maximum: 1000000
          description: Defaults to 0.
        max_uses:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000000
        expires_at:
          type: ["string", "null"]
          description: ISO date or date-time string; null = never expires.
        description:
          type: ["string", "null"]
          maxLength: 200
      required: [code, type, value]

    PatchCouponBody:
      type: object
      description: Strict body — unknown keys are a 400 (zod .strict()).
      properties:
        is_active:
          type: boolean
        max_uses:
          type: ["integer", "null"]
          minimum: 1
          maximum: 1000000
        expires_at:
          type: ["string", "null"]
          description: ISO date or date-time string; null = never expires.
        description:
          type: ["string", "null"]
          maxLength: 200

    # ── Loyalty ──────────────────────────────────────────────────────────────
    LoyaltySummary:
      type: object
      description: |
        Constants: POINTS_PER_LYD = 100, POINTS_PER_REFERRAL = 50; tiers
        silver=500 / gold=2000 / platinum=5000 lifetime spend. NOTE:
        points_value_lyd is a STRING (toFixed(2)).
      properties:
        points:
          type: integer
        tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        lifetime_spend:
          type: number
        referral_code:
          type: string
          description: "Empty string when unset."
        referral_link:
          type: string
        referred_by:
          type: ["string", "null"]
        referrals_total:
          type: integer
        referrals_credited:
          type: integer
        referrals_pending:
          type: integer
        points_value_lyd:
          type: string
          description: points / 100, formatted with 2 decimals (e.g. "12.00").
        next_tier:
          type: ["object", "null"]
          description: null at platinum.
          properties:
            tier:
              type: string
            label:
              type: string
              description: Arabic tier label ("فضي" / "ذهبي" / "بلاتيني").
            remaining:
              type: number
              description: Lifetime spend still needed for the next tier.
          required: [tier, label, remaining]
        tier_thresholds:
          type: object
          properties:
            silver:
              type: number
            gold:
              type: number
            platinum:
              type: number
          required: [silver, gold, platinum]
        points_rate:
          type: object
          properties:
            points_per_referral:
              type: integer
            points_per_lyd:
              type: integer
          required: [points_per_referral, points_per_lyd]
      required:
        [
          points,
          tier,
          lifetime_spend,
          referral_code,
          referral_link,
          referrals_total,
          referrals_credited,
          referrals_pending,
          points_value_lyd,
          next_tier,
          tier_thresholds,
          points_rate,
        ]

    ConvertPointsBody:
      type: object
      description: |
        The handler parseInt()s the raw body value, so a numeric string
        ("500") is also accepted — a JSON number is the documented shape.
        Values below 100 or not a multiple of 100 → 400 INVALID_DATA.
      properties:
        points:
          oneOf:
            - type: integer
              minimum: 100
              multipleOf: 100
            - type: string
              description: Numeric string, coerced via parseInt.
      required: [points]

    ConvertPointsResult:
      type: object
      properties:
        success:
          type: boolean
        points_spent:
          type: integer
        lyd_credited:
          type: number
        new_points:
          type: integer
        new_balance:
          type: number
        message:
          type: string
          description: Arabic success message with the converted amount.
      required: [success, points_spent, lyd_credited, new_points, new_balance, message]

    ReferralEventItem:
      type: object
      properties:
        id:
          type: integer
        status:
          type: string
          enum: [pending, credited]
        phone_masked:
          type: string
          description: Referee phone masked ("091****789").
        created_at:
          type: string
        credited_at:
          type: ["string", "null"]
        points_earned:
          type: integer
          description: 50 when credited, else 0.
      required: [id, status, phone_masked, created_at, credited_at, points_earned]

    # ── Support ──────────────────────────────────────────────────────────────
    SupportTicketSummary:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [billing, technical, order, account, other]
        status:
          type: string
          enum: [open, in_progress, closed]
        created_at:
          type: string
        last_reply:
          type: ["object", "null"]
          description: Most recent reply (first 80 chars) — null when the ticket has no replies.
          properties:
            author_type:
              type: string
              enum: [user, admin]
            message:
              type: string
            created_at:
              type: string
          required: [author_type, message, created_at]
      required: [id, title, category, status, created_at, last_reply]

    CreateSupportTicketBody:
      type: object
      description: |
        title and message are trimmed; an unknown category silently
        falls back to "other".
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 255
        message:
          type: string
          minLength: 1
          description: Becomes the first reply (author_type=user).
        category:
          type: string
          enum: [billing, technical, order, account, other]
      required: [title, message]

    SupportTicketCreated:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [open]
        created_at:
          type: string
      required: [id, title, status, created_at]

    SupportTicketDetail:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        category:
          type: string
          enum: [billing, technical, order, account, other]
        status:
          type: string
          enum: [open, in_progress, closed]
        created_at:
          type: string
        replies:
          type: array
          description: Full messages, oldest first.
          items:
            $ref: "#/components/schemas/TicketReply"
      required: [id, title, category, status, created_at, replies]

    ReplySupportTicketBody:
      type: object
      properties:
        message:
          type: string
          minLength: 1
      required: [message]

    TicketReply:
      type: object
      properties:
        id:
          type: integer
        author_type:
          type: string
          enum: [user, admin]
        message:
          type: string
        created_at:
          type: string
      required: [id, author_type, message, created_at]

    # ── Notifications ─────────────────────────────────────────────────────────
    NotificationItem:
      type: object
      properties:
        id:
          type: integer
        type:
          type: string
          description: e.g. "order" | "loyalty" | "system".
        title:
          type: string
        message:
          type: ["string", "null"]
        link:
          type: ["string", "null"]
        is_read:
          type: boolean
        created_at:
          type: string
      required: [id, type, title, is_read, created_at]

    # ── Admin ─────────────────────────────────────────────────────────────────
    AdminLoginBody:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required: [username, password]

    # Two 200 variants: the plain login emits
    # {token, display_name, role, permissions}; when the admin has TOTP
    # enabled the response is {requires_2fa: true, temp_token} and the
    # real session comes from POST /admin/login/verify-2fa. role /
    # permissions drive the SPA layout RBAC ("all" | scoped arrays).
    AdminAuthResponse:
      type: object
      properties:
        token:
          type: string
        display_name:
          type: string
        role:
          type: string
          description: Admin role (e.g. "super_admin", "operator").
        permissions:
          type: array
          items:
            type: string
          description: |
            RBAC scopes granted to this admin (e.g. ["all"] or
            ["orders", "finance"]). Emitted on the non-2FA variant;
            absent on the requires_2fa variant.
        requires_2fa:
          type: boolean
        temp_token:
          type: string

    AdminStats:
      type: object
      properties:
        total_users:
          type: integer
        total_orders:
          type: integer
        total_revenue:
          type: number
        pending_topups:
          type: integer
        today_orders:
          type: integer
        today_revenue:
          type: number
        available_stock:
          type: integer
        total_wallet_balance:
          type: number
      required:
        [
          total_users,
          total_orders,
          total_revenue,
          pending_topups,
          today_orders,
          today_revenue,
          available_stock,
          total_wallet_balance,
        ]

    # Identity-enrichment fields (user_display_name … user_has_whatsapp)
    # feed the admin display helper (frontend lib/admin/user-display.ts):
    # best human-readable name + provider badges.
    AdminOrder:
      type: object
      properties:
        id:
          type: integer
        order_code:
          type: string
        user_phone:
          type: string
        user_display_name:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        user_auth_provider:
          type: ["string", "null"]
        user_has_google:
          type: boolean
        user_has_telegram:
          type: boolean
        user_has_firebase:
          type: boolean
        user_has_whatsapp:
          type: boolean
        product_name:
          type: string
        amount:
          type: number
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        delivered_email:
          type: ["string", "null"]
        delivered_password:
          type: ["string", "null"]
        delivered_extra_details:
          type: ["string", "null"]
        coupon_code:
          type: ["string", "null"]
        discount_amount:
          type: number
        created_at:
          type: string
      required: [id, order_code, user_phone, product_name, amount, status, created_at]

    # Identity-enrichment fields (user_display_name … user_has_whatsapp)
    # feed the admin display helper — same pattern as AdminOrder.
    AdminTopup:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        user_phone:
          type: string
        user_display_name:
          type: ["string", "null"]
        user_email:
          type: ["string", "null"]
        user_auth_provider:
          type: ["string", "null"]
        user_has_google:
          type: boolean
        user_has_telegram:
          type: boolean
        user_has_firebase:
          type: boolean
        user_has_whatsapp:
          type: boolean
        amount:
          type: number
        payment_method:
          type: string
          enum: [mobile_transfer, lypay]
        payment_network:
          type: ["string", "null"]
        sender_phone:
          type: ["string", "null"]
        sender_account:
          type: ["string", "null"]
        payment_reference:
          type: ["string", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        admin_note:
          type: ["string", "null"]
        created_at:
          type: string
      required: [id, user_id, user_phone, amount, payment_method, status, created_at]

    AdminTopupActionBody:
      type: object
      properties:
        admin_note:
          type: ["string", "null"]

    AdminProduct:
      type: object
      properties:
        id:
          type: integer
        slug:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
        cost_price:
          type: ["number", "null"]
          description: |
            Operator's procurement cost per unit. Used by the admin
            pricing calculator to compute margin. Nullable for products
            created before this field existed.
        category:
          type: ["string", "null"]
        is_active:
          type: boolean
        is_archived:
          type: boolean
        stock_count:
          type: integer
        order_count:
          type: integer
        usage_terms:
          type: ["string", "null"]
        created_at:
          type: string
        variants:
          type: array
          description: ADMIN-ONLY variant rows (incl. cost_price + sku). Never serialize to public APIs.
          items:
            $ref: "#/components/schemas/AdminProductVariant"
      required:
        [id, name, price, is_active, is_archived, stock_count, order_count, created_at, variants]

    AdminProductVariant:
      type: object
      description: |
        ADMIN-ONLY variant projection — includes internal fields
        (cost_price USD, sku). This schema must never be referenced by a
        public (non-/admin) path.
      properties:
        id:
          type: integer
        product_id:
          type: integer
        plan_label:
          type: ["string", "null"]
        duration_label:
          type: ["string", "null"]
        duration_days:
          type: ["integer", "null"]
        cost_price:
          type: number
          description: Supplier USD cost — internal, admin-only.
        price_lyd:
          type: number
          description: Retail LYD price (pricing-engine output).
        computed_price_lyd:
          type: number
          description: What the pricing engine WOULD price now (current config) — shows drift without recompute.
        sku:
          type: ["string", "null"]
          description: Internal stock-keeping label (admin-only).
        is_active:
          type: boolean
        sort_order:
          type: integer
        created_at:
          type: string
      required: [id, product_id, cost_price, price_lyd, is_active, sort_order]

    CreateVariantBody:
      type: object
      description: |
        At least one of plan_label / duration_label must be non-empty.
        Provide EITHER cost_price (price computed via the pricing engine)
        OR price_lyd directly (cost stored as 0 — discouraged).
      properties:
        plan_label:
          type: ["string", "null"]
          maxLength: 120
        duration_label:
          type: ["string", "null"]
          maxLength: 120
        duration_days:
          type: ["integer", "null"]
        cost_price:
          type: number
          minimum: 0.01
          maximum: 100000
          description: Supplier USD cost — retail price computed from it.
        price_lyd:
          type: ["number", "null"]
          minimum: 0.01
          maximum: 1000000
          description: Optional explicit retail override (LYD).
        sku:
          type: ["string", "null"]
          maxLength: 160
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        is_active:
          type: boolean
      required: [cost_price]

    UpdateVariantBody:
      type: object
      properties:
        plan_label:
          type: ["string", "null"]
          maxLength: 120
        duration_label:
          type: ["string", "null"]
          maxLength: 120
        duration_days:
          type: ["integer", "null"]
        cost_price:
          type: number
          minimum: 0.01
          maximum: 100000
          description: New USD cost — retail price recomputed from it via the engine.
        price_lyd:
          type: ["number", "null"]
          minimum: 0.01
          maximum: 1000000
          description: Explicit retail override (LYD).
        sku:
          type: ["string", "null"]
          maxLength: 160
        sort_order:
          type: integer
          minimum: 0
          maximum: 10000
        is_active:
          type: boolean

    DeleteVariantResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success]

    PricingConfig:
      type: object
      properties:
        usd_to_lyd:
          type: number
          description: Exchange rate — LYD per 1 USD (default 10).
        markup_percent:
          type: number
          description: Gross margin percent on cost (default 100 = cost × 2).
        max_total_discount_pct:
          type: number
          description: |
            R115: hard cap on the COMBINED transactional discount
            (flash % + coupon % vs list). Default 50 — the no-loss line
            at the catalog's uniform 100% markup. Enforced in the shared
            pricing pipeline; a coupon past the cap is rejected with a
            clean total_discount_cap reason.
        updated_at:
          type: string
      required: [usd_to_lyd, markup_percent, max_total_discount_pct]

    UpdatePricingConfigBody:
      type: object
      properties:
        usd_to_lyd:
          type: number
          minimum: 0.1
          maximum: 1000
        markup_percent:
          type: number
          minimum: 0
          maximum: 10000
        max_total_discount_pct:
          type: number
          minimum: 10
          maximum: 95
          description: R115 combined flash+coupon discount cap (default 50).

    RecomputeResult:
      type: object
      properties:
        variants_updated:
          type: integer
          description: Number of variant rows whose price_lyd changed.
        products_updated:
          type: integer
          description: Number of product display prices refreshed (MIN of variants).
        usd_to_lyd:
          type: number
        markup_percent:
          type: number
      required: [variants_updated, products_updated, usd_to_lyd, markup_percent]

    CreateProductBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: number
          # Money-perimeter bound (audit M1): an unbounded price is the
          # deepest money hole in the API — a negative price makes
          # checkout CREDIT the wallet on every purchase (finalPrice
          # negated flips the balance comparison), and Infinity/NaN
          # corrupts every storefront aggregate. 0.01 .. 1,000,000 LYD
          # covers every real product in the catalog with orders of
          # magnitude to spare.
          minimum: 0.01
          maximum: 1000000
        cost_price:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: boolean
      required: [name, price]

    UpdateProductBody:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        image_url:
          type: ["string", "null"]
        price:
          type: ["number", "null"]
          # Same money-perimeter bounds as CreateProductBody (audit M1).
          minimum: 0.01
          maximum: 1000000
        cost_price:
          type: ["number", "null"]
          minimum: 0
          maximum: 1000000
        category:
          type: ["string", "null"]
        usage_terms:
          type: ["string", "null"]
        is_active:
          type: ["boolean", "null"]

    # Identity fields (display_name … last_auth_at) let the admin users
    # page render provider badges and search by name when the phone is a
    # placeholder (e.g. tg_<id> for Telegram-first accounts).
    AdminUser:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        display_name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        photo_url:
          type: ["string", "null"]
        auth_provider:
          type: string
          description: |
            "firebase_phone" | "firebase_google" | "firebase" |
            "telegram" | "whatsapp_phone" | "legacy_password".
        has_google:
          type: boolean
        has_telegram:
          type: boolean
        has_firebase:
          type: boolean
        has_whatsapp:
          type: boolean
        last_auth_at:
          type: ["string", "null"]
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        lifetime_spend:
          type: number
        order_count:
          type: integer
          description: Completed-order count for this user.
        referral_code:
          type: ["string", "null"]
        created_at:
          type: string
      required:
        [
          id,
          phone,
          wallet_balance,
          loyalty_points,
          loyalty_tier,
          lifetime_spend,
          order_count,
          created_at,
        ]

    # PATCH /admin/users/{id} body. At least one editable field must
    # be supplied ("no updates" → 400). Wallet fields route through
    # AdjustmentService (ledger-backed); wallet_adjustment (relative
    # delta) takes precedence when both wallet fields are present.
    UpdateAdminUserBody:
      type: object
      properties:
        wallet_adjustment:
          type: number
          description: |
            Relative delta applied to wallet_balance via AdjustmentService
            (transaction + wallet_ledger type=adjustment). Rejected with
            400 on non-finite/oversized values (INVALID_AMOUNT), zero
            delta, or a resulting negative balance.
        wallet_balance:
          type: number
          description: |
            Absolute balance set via AdjustmentService (same ledger path).
            Ignored when wallet_adjustment is also present.
        loyalty_points:
          type: integer
          minimum: 0
          maximum: 10000000
          description: |
            R115: the edit is attributed — mutation + points_ledger
            admin_set row commit in ONE transaction; a note (reason) is
            REQUIRED (400 when missing); the finance scope is REQUIRED.
            Integer in [0, 10,000,000] — the cap exists because points
            convert to wallet credit via /loyalty/convert-points
            (100 pts/LYD).
        note:
          type: string
          description: |
            Operator note recorded on the wallet_ledger row for the
            adjustment and on the points_ledger admin_set row for loyalty
            edits. REQUIRED by the backend whenever wallet_adjustment,
            wallet_balance, OR loyalty_points is sent (R115 extended the
            rule to loyalty — the audit trail must explain WHY). Kept
            schema-optional because OpenAPI cannot express the conditional
            requirement. Trimmed and capped at 500 chars.
          
            loyalty_tier is NO LONGER EDITABLE (R115): tiers derive
            strictly from net qualifying spend; sending loyalty_tier is
            rejected with 400 INVALID_DATA.
      minProperties: 1

    # 200 body of PATCH /admin/users/{id} — the current post-edit state
    # of the mutated fields.
    AdminUserUpdateResult:
      type: object
      properties:
        id:
          type: integer
        phone:
          type: string
        wallet_balance:
          type: number
        loyalty_points:
          type: integer
        loyalty_tier:
          type: string
          enum: [bronze, silver, gold, platinum]
      required: [id, phone, wallet_balance, loyalty_points, loyalty_tier]

    # ── Admin flash sales ─────────────────────────────────────────────────
    AdminFlashSale:
      type: object
      description: |
        `is_currently_active` is derived (is_active AND ends_at in the
        future) — the admin UI can show historical rows without
        recomputing.
      properties:
        id:
          type: integer
        title:
          type: string
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
        is_active:
          type: boolean
        is_currently_active:
          type: boolean
        created_at:
          type: string
      required: [id, title, discount_percent, ends_at, is_active, is_currently_active, created_at]

    CreateFlashSaleBody:
      type: object
      description: |
        95% ceiling rationale: prevents a "free goods" state when a
        fixed-amount coupon stacks on the sale — use a coupon for deeper
        discounts.
      properties:
        title:
          type: string
          maxLength: 255
          description: Defaults to "Flash Sale" when omitted.
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
          description: ISO date-time — between 5 minutes and 30 days in the future.
      required: [discount_percent, ends_at]

    UpdateFlashSaleBody:
      type: object
      description: At least one field required — an empty body is a 400.
      properties:
        title:
          type: string
          maxLength: 255
        discount_percent:
          type: number
          minimum: 0
          maximum: 95
        ends_at:
          type: string
          description: ISO date-time — at least 5 minutes in the future.
        is_active:
          type: boolean

    # ── Admin bulk order status ────────────────────────────────────────────
    BulkUpdateOrderStatusBody:
      type: object
      description: |
        `ids` accepts numbers or numeric strings (coerced via Number());
        invalid entries and duplicates are dropped and reported
        (skipped_invalid on the 200 response).
      properties:
        ids:
          type: array
          minItems: 1
          items:
            oneOf:
              - type: integer
              - type: string
                description: Numeric string, coerced via Number().
        status:
          type: string
          enum: [pending, completed, failed, refunded]
        note:
          type: string
          description: Optional audit note (stored on refund ledger entries).
      required: [ids, status]

    BulkUpdateOrderStatusResult:
      type: object
      properties:
        success:
          type: boolean
        updated:
          type: integer
          description: Count of orders transitioned (or successfully refunded).
        skipped_invalid:
          type: integer
          description: |
            Count of non-numeric / duplicate ids dropped from the request
            — present only when non-zero.
      required: [success, updated]

    BulkUpdateOrderStatusPartial:
      type: object
      description: 207 (Multi-Status) body — refund batch with per-order failures.
      properties:
        success:
          type: boolean
          description: false — at least one refund failed.
        updated:
          type: integer
          description: Count of orders successfully refunded.
        failed:
          type: array
          items:
            type: object
            properties:
              orderId:
                type: integer
              code:
                type: string
                description: RefundError code for the failed order.
              message:
                type: string
            required: [orderId, code, message]
      required: [success, updated, failed]

