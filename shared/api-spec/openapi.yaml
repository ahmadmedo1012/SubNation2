  # ── Admin ───────────────────────────────────────────────────────────────────
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Get platform stats
      responses:
        "200":
          description: Admin stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: List all orders (requireAdmin + orders scope)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum:
              - pending
              - completed
              - failed
              - refunded
              - null
          description: |
            Optional order status filter (order_status pg-enum values —
            round-94 A5-03: out-of-enum values are 400 INVALID_DATA
            instead of the previous 500 from Postgres 22P02).
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
          description: 1-based page number (default 1).
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
          description: Page size, clamped to [1, 200] (default 100).
        - name: search
          in: query
          schema:
            type: ["string", "null"]
          description: |
            LOWER LIKE across order code, user phone / email / display
            name, or product name (the admin command palette filter).
      responses:
        "200":
          description: All orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing orders permission scope (requirePermission guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/orders/bulk-status:
    patch:
      operationId: bulkUpdateOrderStatus
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Bulk-update order statuses (requireAdmin + orders scope; mass refunds move wallet money)
      description: |
        status="refunded" processes each id through RefundService.refundOrder
        (status-guard + optimistic wallet credit + wallet_ledger type=refund)
        — partial failures return 207 with a per-order breakdown.
        Non-refund statuses use a direct UPDATE with two state-machine
        guards: `refunded` is terminal (an un-refund re-arms the
        double-refund protection), and (round-94 F3) `completed` is
        purchase-tx-only — failed/pending → completed is refused with
        `skipped_blocked_completion` / reason COMPLETED_IS_PURCHASE_ONLY,
        because a hand-completed order followed by a refund credits the
        wallet with no matching purchase debit. Mounted behind the
        idempotency middleware (routeKey admin.orders.bulk-status) — send
        an Idempotency-Key so a double-clicked bulk refund cannot
        double-credit.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Idempotency key (≥ 8 chars to engage; 24h dedup per admin +
            route). Same key with a different body → 409
            IDEMPOTENCY_KEY_REUSE; same key in flight → 409
            IDEMPOTENCY_IN_FLIGHT; replays carry Idempotent-Replayed /
            Idempotent-Original-At response headers.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkUpdateOrderStatusBody"
      responses:
        "200":
          description: |
            All requested transitions applied (non-refund path) or all
            refunds succeeded (refund path).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateOrderStatusResult"
        "207":
          description: |
            Multi-Status — some (but not all) refunds failed. Body carries
            a per-order breakdown so the admin UI can render exactly which
            orders were refunded and which were not.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkUpdateOrderStatusPartial"
        "400":
          description: ids missing/empty, invalid status, or no valid ids (INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session missing (UNAUTHORIZED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing orders permission scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Idempotency-key conflict — the same Idempotency-Key re-sent
            with a different body (IDEMPOTENCY_KEY_REUSE) or the same key
            while the original bulk request is still executing
            (IDEMPOTENCY_IN_FLIGHT). Bodies carry success:false and the
            legacy `message` alias alongside `error`.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/IdempotencyConflictResponse"

  /admin/topups:
    get:
      operationId: listAdminTopups
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: List all top-up requests (requireAdmin + finance scope)
      parameters:
        - name: status
          in: query
          schema:
            type: ["string", "null"]
            enum:
              - pending
              - approved
              - rejected
              - null
          description: |
            Optional topup status filter (topup_status pg-enum values —
            round-94 A5-03: out-of-enum values are 400 INVALID_DATA).
        - name: page
          in: query
          schema:
            type: ["integer", "null"]
          description: |
            1-based page number (default 1) — round-94 A2: the list was
            previously hard-capped at the newest 100 rows, hiding the
            oldest pending money queue entries.
        - name: limit
          in: query
          schema:
            type: ["integer", "null"]
          description: Page size, clamped to [1, 200] (default 100).
      responses:
        "200":
          description: All topups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminTopup"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope (requirePermission guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/topups/{id}/approve:
    post:
      operationId: approveTopup
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Approve a top-up request (requireAdmin + finance scope — moves wallet money)
      description: |
        Executes TopupService.approve inside a transaction: status guard
        (WHERE status='pending'), optimistic wallet credit, atomic
        wallet_ledger type=topup entry, referral credit, and user/admin
        notifications. Mounted behind the idempotency middleware
        (routeKey admin.topups.approve) — send an Idempotency-Key per
        click so a network retry / double-click cannot double-credit.
        A payment_reference already used by an approved topup is
        rejected with 409 (the same transfer cannot be credited twice).
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Idempotency key (≥ 8 chars to engage; 24h dedup per admin +
            route). Same key with a different body → 409
            IDEMPOTENCY_KEY_REUSE; same key in flight → 409
            IDEMPOTENCY_IN_FLIGHT; replays carry Idempotent-Replayed /
            Idempotent-Original-At response headers.
          schema:
            type: string
            maxLength: 100
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTopupActionBody"
      responses:
        "200":
          description: Approved — wallet credited + ledger row written
          headers:
            Idempotent-Replayed:
              description: |
                "true" when this body is a cached replay of the original
                request (same Idempotency-Key + body).
              schema:
                type: string
                enum: ["true"]
            Idempotent-Original-At:
              description: |
                ISO-8601 completion timestamp of the original request —
                present on idempotent replays.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: |
            Invalid (non-integer) id, malformed admin_note body, or the
            topup was already processed (ServiceError 400).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing finance permission scope (requirePermission guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Topup (or its user) not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            State conflict — topup flipped by a concurrent decision,
            wallet-deduction concurrency loss, payment-reference reuse,
            or an idempotency-key conflict (same key re-used with a
            different body / same key still in flight — those bodies
            carry success:false and a legacy `message` alias alongside
            `error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/IdempotencyConflictResponse"
        "500":
          description: Unexpected transaction failure (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

