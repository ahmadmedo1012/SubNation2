    # ── Telegram webhook ────────────────────────────────────────────────
    # Minimal subset of the Telegram Bot API "Update" object — only the
    # members this webhook reads. Full envelope reference:
    # https://core.telegram.org/bots/api#update (do not inline the whole
    # schema here; unknown members are ignored by the handler).
    TelegramWebhookUpdate:
      type: object
      properties:
        update_id:
          type: integer
        message:
          type: object
          description: |
            Plain message — only `/start` is meaningful (replies with the
            sender's chat/user ids so operators can build the
            TELEGRAM_ADMIN_IDS allowlist).
          properties:
            text:
              type: string
            chat:
              type: object
              properties:
                id:
                  type: number
                username:
                  type: string
                type:
                  type: string
            from:
              type: object
              properties:
                id:
                  type: number
                username:
                  type: string
        callback_query:
          type: object
          description: |
            Inline-button tap. `data` is the topup decision payload:
            "topup_app:{id}" (approve) or "topup_rej:{id}" (reject).
            Executed only when `from.id` is allowlisted in
            TELEGRAM_ADMIN_IDS.
          properties:
            id:
              type: string
            from:
              type: object
              properties:
                id:
                  type: number
                username:
                  type: string
              required: [id]
            message:
              type: object
              properties:
                chat:
                  type: object
                  properties:
                    id:
                      type: number
                  required: [id]
                message_id:
                  type: integer
                text:
                  type: string
            data:
              type: string
              description: 'Callback payload: "topup_app:<id>" | "topup_rej:<id>".'
          required: [id, from]

    # {ok: boolean} ack for POST /webhook/telegram — deliberately NOT the
    # standard {error, code} envelope: the caller is Telegram's delivery
    # machinery, which only looks at the HTTP status code.
    TelegramWebhookAck:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    # GET /admin/diagnostics/inventory-health (R93-DATA; documented
    # round-94 A5-01). Mirrors the route's response body exactly.
    AdminInventoryHealthReport:
      type: object
      properties:
        scanned_unsold:
          type: integer
          description: Number of unsold units actually scanned (≤ scanned_cap).
        scanned_cap:
          type: integer
          description: Scan bound (500) — the sequential scan is capped as the catalog grows.
        products_with_undeliverable_units:
          type: integer
        items:
          type: array
          items:
            type: object
            properties:
              product_id:
                type: integer
              product_name:
                type: string
              unsold:
                type: integer
              undeliverable:
                type: integer
              broken_unit_ids:
                type: array
                description: First ≤20 broken unit ids (re-upload worklist).
                items:
                  type: integer
            required: [product_id, product_name, unsold, undeliverable, broken_unit_ids]
        checked_at:
          type: string
          format: date-time
      required: [scanned_unsold, scanned_cap, products_with_undeliverable_units, items, checked_at]
