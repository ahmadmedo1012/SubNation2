  /admin/users/{id}:
    patch:
      operationId: updateAdminUser
      tags: [admin]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Edit a user — wallet adjustment/set, loyalty fields (requireAdmin + users scope; moves wallet money)
      description: |
        THE admin money-edit route. Wallet mutations
        (`wallet_adjustment` relative delta, or `wallet_balance` absolute
        set — send at most one of the two; `wallet_adjustment` wins if
        both are present) route through AdjustmentService: transactional
        optimistic-lock update + a wallet_ledger row of type=adjustment,
        so every monetary change stays reconstructable from the ledger
        (Constitution Principle I). Loyalty fields
        (`loyalty_points`, `loyalty_tier`) use a legacy direct-update
        path with no ledger.

        Mounted behind the idempotency middleware (routeKey
        admin.users.patch) so a network retry / admin double-click
        cannot double-credit — send a fresh Idempotency-Key per edit.
        The audit row records the fields changed and the resulting
        wallet balance.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: Idempotency-Key
          in: header
          required: false
          description: |
            Idempotency key (≥ 8 chars to engage; 24h dedup per admin +
            route). Currently advisory — absence logs a warning and the
            call proceeds; same key + different body → 409
            IDEMPOTENCY_KEY_REUSE, same key in flight → 409
            IDEMPOTENCY_IN_FLIGHT, replays carry Idempotent-Replayed /
            Idempotent-Original-At response headers.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminUserBody"
      responses:
        "200":
          description: Updated user (wallet/loyalty current state)
          headers:
            Idempotent-Replayed:
              description: |
                "true" when this body is a cached replay of the original
                request (same Idempotency-Key + body).
              schema:
                type: string
                enum: ["true"]
            Idempotent-Original-At:
              description: |
                ISO-8601 completion timestamp of the original request —
                present on idempotent replays.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserUpdateResult"
        "400":
          description: |
            Invalid (non-integer) id, no editable field supplied, an
            out-of-bounds loyalty_points value (integer 0..10,000,000),
            or a rejected wallet amount (INVALID_AMOUNT / ZERO_DELTA /
            NEGATIVE_BALANCE from AdjustmentService).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Admin session missing/invalid (requireAdmin guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Missing users permission scope (requirePermission guard)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found (NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: |
            Wallet balance (or loyalty fields) changed concurrently —
            optimistic-lock race; the body code is CONFLICT (round-93
            A8 F-7: previously mislabeled INVALID_DATA) — retry the
            read-then-edit. Idempotency-key conflicts (same key re-used
            with a different body / same key still in flight — those
            bodies carry success:false and a legacy `message` alias
            alongside `error`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ErrorResponse"
                  - $ref: "#/components/schemas/IdempotencyConflictResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      security: []
      summary: Admin login
      description: |
        Password login with an exponential-backoff lockout: repeated
        failures lock the account and return 429 ACCOUNT_LOCKED until
        the lock expires. Soft-disabled accounts answer 401 with the
        same body as a wrong password (no account-state leak). When
        TOTP is enabled the response is the requires_2fa variant
        (temp_token + requires_2fa) and the session is issued by the
        (undocumented) POST /admin/login/verify-2fa instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginBody"
      responses:
        "200":
          description: Logged in (or 2FA challenge issued)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuthResponse"
        "400":
          description: Validation error (AdminLoginBody zod parse, INVALID_DATA)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Account locked after repeated failed attempts (ACCOUNT_LOCKED)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ──────────────────────────────────────────────────────────────────────────
  # AI Admin Copilot (010-ai-admin-copilot)
  #
  # All routes require an authenticated admin session and are subject to the
  # per-admin copilot rate limit (30/min, 200/hour, sliding windows). Mutation
  # paths (/confirm, /double-confirm) are the ONLY ones that change domain
  # state via the copilot — the LLM never proposes execution.
  # ──────────────────────────────────────────────────────────────────────────
  /admin/copilot/ask:
    post:
      operationId: copilotAsk
      tags: [copilot]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Read-only natural-language query (Phase 1 — no writes)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: SSE stream of token / tool_use / tool_result / done events
          content:
            text/event-stream:
              schema:
                type: string
        "400":
          description: Missing/oversized intent_text (COPILOT_INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Admin has no tool scopes at all (COPILOT_OUT_OF_SCOPE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: |
            Copilot rate limit (30/min, 200/h sliding windows per admin) —
            body code COPILOT_RATE_LIMITED with retry_after_seconds +
            window extras (93-A8 F-8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRateLimitResponse"
        "502":
          description: LLM gateway error / secret-leak abort (COPILOT_LLM_ERROR / COPILOT_SECRET_LEAK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Copilot phase disabled or LLM unavailable (COPILOT_PHASE_DISABLED / COPILOT_LLM_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/copilot/draft:
    post:
      operationId: copilotDraft
      tags: [copilot]
      security:
        - adminCookieAuth: []
          adminBearerAuth: []
      summary: Draft an action and return a preview (Phase 2+)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                intent_text:
                  type: string
                  minLength: 1
                  maxLength: 4000
                context:
                  $ref: "#/components/schemas/CopilotAskContext"
              required: [intent_text]
      responses:
        "200":
          description: Draft accepted; preview persisted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotDraftResponse"
        "400":
          description: Missing/oversized intent_text (COPILOT_INVALID_INPUT)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Out of scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "409":
          description: Validation rejected the proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "422":
          description: Bulk row cap exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRefusalResponse"
        "429":
          description: |
            Copilot rate limit (30/min, 200/h sliding windows per admin) —
            body code COPILOT_RATE_LIMITED with retry_after_seconds +
            window extras (93-A8 F-8).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopilotRateLimitResponse"
        "502":
          description: LLM gateway error / secret-leak abort (COPILOT_LLM_ERROR / COPILOT_SECRET_LEAK)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: |
            LLM unavailable (COPILOT_LLM_UNAVAILABLE), or the model
            declined to draft and answered as plain text
            (COPILOT_UNEXPECTED_STATE — round-94 A5-07: this state
            previously returned 200 with `preview_id: null`, which
            violated CopilotDraftResponse's non-nullable preview_id for
            every orval-generated client).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

