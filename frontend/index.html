<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- 96-F5 (R96 P2-2a): interactive-widget=resizes-content — Android's
         default (resizes-visual) doesn't reflow the page when the
         virtual keyboard opens, so the focused wallet/checkout field
         could sit under the keyboard with only the browser's
         scroll-into-view fighting the layout (and losing inside
         Radix-locked dialogs). resizes-content makes the layout
         viewport shrink instead. iOS ignores the key (its own
         keyboard behavior applies) and zoom stays enabled either way
         (no user-scalable/maximum-scale). -->
    <meta
      data-rh="true"
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!-- google-site-verification meta is injected at build time by the
         seoHeadInject Vite plugin in vite.config.ts. When
         VITE_GSC_VERIFICATION is unset, the meta is emitted with
         content="" — harmless, ignored by Search Console. When set,
         the operator's token appears here. -->
    <!-- ── Static SEO defaults ────────────────────────────────────────
         These are the no-JS baseline (non-rendering crawlers, link
         unfurlers). At runtime MetaTags (components/seo/MetaTags.tsx)
         upserts each of these IN PLACE by selector — one <title>, one
         description, one og set — so no duplicates ever ship (V3-A1:
         react-helmet-async tripled these under React 19 and was
         removed). The legacy data-rh attributes are inert markers
         kept only for cache-busting safety. -->
    <meta data-rh="true" name="robots" content="index,follow" />
    <!-- 110-F (R110 — 109-n P2): absolute og:image. This static baseline is
         the only og:image a no-JS crawler/unfurler ever sees (WhatsApp and
         Facebook scrapers silently DROP relative image URLs); at runtime
         MetaTags upserts this very tag in place, so JS surfaces are
         unaffected. Baked to the canonical production origin — the same
         default seo-builders.ts DEFAULT_ORIGIN and the backend APP_ORIGIN
         resolution (APP_URL || https://subnation.ly) use — because Vite's
         %VAR% HTML substitution leaves the literal placeholder behind when
         the env is unset (the seoHeadInject rationale in vite.config.ts),
         and VITE_APP_ORIGIN is unset by default in the Docker build.
         subnation.ly is the PRODUCT domain regardless of hosting
         (docs/deployment/ENVIRONMENT_MATRIX.md). -->
    <meta data-rh="true" property="og:image" content="https://subnation.ly/opengraph.jpg" />
    <!-- R116-S1: og:image dimensions + twitter:card in the static
         no-JS baseline too — scrapers that never run JS (and WhatsApp's
         unfurler) size the card without a headless image fetch.
         MetaTags upserts each of these in place at runtime.
         R120-B3 (A7-F6): dims must always declare the REAL file size.
         R128-L2: /opengraph.jpg replaced with a crafted 1200×630 share
         card (dark #0a0c10, brand mark, SubNation wordmark, Arabic
         tagline) — the dims follow the new real size. -->
    <meta data-rh="true" property="og:image:width" content="1200" />
    <meta data-rh="true" property="og:image:height" content="630" />
    <meta data-rh="true" name="twitter:card" content="summary_large_image" />
    <!-- R117 (A4-P3-4): static canonical link for the no-JS baseline.
         The apex is the canonical host everywhere (sitemap, robots,
         og:image, runtime MetaTags canonical, seo-builders
         DEFAULT_ORIGIN) — but pre-R117 a no-JS crawler saw NO
         consolidation hint at all, because both apex and www served
         byte-identical 200s with no redirect at any layer (the R116
         f10bb9b Cloudflare-loop fix removed the in-app redirect and its
         external-307 premise measured false live). This link gives
         non-JS crawlers the consolidation signal the runtime already
         provides; MetaTags upserts it in place per route at runtime. -->
    <link data-rh="true" rel="canonical" href="https://subnation.ly/" />
    <title data-rh="true">SubNation — سوق الاشتراكات الرقمية</title>
    <!-- R120-B3 (A7-F5): the default description names what the catalog
         ACTUALLY sells — Netflix/منصات المشاهدة، VPN، تراخيص Windows
         والبرامج، أدوات AI (the seven live categories in
         lib/categories.ts). "PS Plus" advertised a retired family with
         zero results. ~140 chars, keeps the د.ل + ليبيا keywords. -->
    <meta
      data-rh="true"
      name="description"
      content="اشترِ Netflix ومنصات المشاهدة واشتراكات VPN وتراخيص Windows والبرامج وأدوات الذكاء الاصطناعي بالدينار الليبي (د.ل) — تسليم فوري في ليبيا."
    />
    <!-- Static pre-hydration tint matches the dark --primary (#dc1840 =
         hsl(348 80% 48%)); MetaTags re-upserts per-theme values at runtime. -->
    <meta data-rh="true" name="theme-color" content="#dc1840" />
    <meta data-rh="true" property="og:title" content="SubNation — سوق الاشتراكات الرقمية" />
    <!-- R120-B3 (A7-F23): the static og:description was a 41-char generic
         line that wasted the share-card copy — it now mirrors the default
         meta description (locale + offering + د.ل). -->
    <meta
      data-rh="true"
      property="og:description"
      content="اشترِ Netflix ومنصات المشاهدة واشتراكات VPN وتراخيص Windows والبرامج وأدوات الذكاء الاصطناعي بالدينار الليبي (د.ل) — تسليم فوري في ليبيا."
    />
    <meta data-rh="true" property="og:type" content="website" />
    <!-- R-140-p (140-h's flag): the static baseline was missing the three
         og identity tags the runtime MetaTags already emits on every
         route (og:locale / og:site_name / og:url — the per-route values
         below are the App-fallback home shape). No-JS link unfurlers
         and strict OG consumers read ONLY this static layer, so the
         shell now names its locale, site, and URL. og:locale is ar_LY —
         the territory-specific language_COUNTRY form, NOT Facebook's
         generic ar_AR pseudo-locale (the R-140-h verdict at the
         MetaTags emission site: a Libya-only storefront — Organization
         LD addressCountry LY, LYD pricing, ar-only sitemap discipline).
         og:url is baked to the canonical production origin exactly like
         the og:image line above (the R110-F / seoHeadInject rationale:
         Vite's %VAR% HTML substitution leaves the literal placeholder
         behind when the env is unset, and VITE_APP_ORIGIN is unset by
         default in the Docker build — subnation.ly is the PRODUCT
         domain; docs/deployment/ENVIRONMENT_MATRIX.md). MetaTags
         upserts each of these IN PLACE per route at runtime. -->
    <meta data-rh="true" property="og:locale" content="ar_LY" />
    <meta data-rh="true" property="og:site_name" content="SubNation" />
    <meta data-rh="true" property="og:url" content="https://subnation.ly/" />
    <!-- R128-L2 (brand-asset suite): favicon.svg is the canonical mark
         (red #dc1840 tile, white shield + play knockout — the solid
         variant of the header Logo.tsx shield), favicon-32x32.png is the
         legacy-browser fallback, apple-touch-icon.png is a dedicated
         180×180 full-bleed (no transparency — iOS requirement). The old
         apple-touch → pwa-192x192.png pointed at the banner lockup. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SubNation" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- ── Network hints ───────────────────────────────────────────────
         preconnect runs the DNS+TLS+TCP handshake during HTML parse so
         the first request to each origin starts ~150 ms sooner on a
         cold visit. No preconnect tags ship today: every first-paint
         resource is same-origin (JS/CSS/fonts under /assets/, catalog
         art /products/*.webp); the slot stays reserved for a future
         cross-origin image host. Origins that are only hit on
         a delayed action (Firebase popup on login click, recaptcha)
         get dns-prefetch — cheaper signal that doesn't burn an idle
         TLS slot.

         R-140-b — FONTS, the current truth (verified against the dist
         build AND the live site): the old PageSpeed "Google Fonts
         57 KB third-party" finding is fully retired — ZERO external
         font requests ship. Readex Pro is self-hosted via
         @fontsource/readex-pro (index.css imports 6 faces: arabic +
         latin × 400/600/700 — exactly the contract's loaded weights),
         emitted as content-hashed /assets/readex-pro-*.woff2 (~10 KB
         arabic / ~14 KB latin per face, 1y immutable cache) with
         font-display: swap baked into every @fontsource face CSS.

         R-140-b — why THIS file deliberately carries NO font preload
         link: the woff2 asset names carry content hashes that change
         on every font bump, so a statically hardcoded href would 404
         (wasted bytes + a console error on every boot after the next
         @fontsource update). The 4 critical-face preloads (arabic
         400/600/700 + latin 400 — the above-the-fold set: hero h1 +
         prose + Navbar labels + the hero's Latin glyphs) are injected
         at BUILD time by the criticalPreloadInject plugin in
         vite.config.ts, which reads the rollup bundle and emits the
         correct hashed URLs. Verified end-to-end in R-140-b: the
         dual-subset faces (arabic + latin, same family+weight, no
         unicode-range) resolve per codepoint inside the family — all
         6 faces reach status=loaded on a real boot, Arabic text
         renders from the arabic woff2 and Latin from the latin woff2.
         If the font preload set ever needs to change, it changes in
         vite.config.ts (criticalPreloadInject), never here. -->
    <!-- A7 (round-94): the crossorigin attribute is REMOVED. Product
         images are plain <img> (no-cors) requests — a crossorigin
         preconnect opens an ANONYMOUS CORS connection the image fetch
         never reuses, so the LCP image paid DNS+TLS twice. A no-cors
         preconnect is reused by the actual request. -->
    <link rel="dns-prefetch" href="https://apis.google.com" />
    <link rel="dns-prefetch" href="https://subnation-2571e.firebaseapp.com" />
    <link rel="dns-prefetch" href="https://www.google.com" />
    <link rel="dns-prefetch" href="https://www.gstatic.com" />

    <!-- R-140-b — BOOT ORDER (the critical path this tag sits on).
         R141 HOTFIX — THE TAG-SEQUENCE BAN (learned the hard way): this
         comment must NEVER spell out a literal head open/close tag
         sequence, not even as prose inside brackets. r140 shipped point
         3 below with the literal head-close tag text written out here —
         and every build-time injector in the pipeline (Vite's own
         head-end injection for the entry module + CSS + vendor
         modulepreloads, criticalPreloadInject's font preloads, the PWA
         registerSW injector) anchors on the FIRST such byte sequence in
         the raw HTML, comment or not. The decoy swallowed the ENTIRE
         injected payload into this comment: the deployed shell carried
         no entry script, no stylesheet, no font preloads and no SW
         registration — a dead shell that can never boot, surfacing live
         as the «يتطلب الموقع تشغيل JavaScript» reveal on desktop and a
         white screen on mobile (no CSS at all). The anchors our side
         owns are now comment-aware (indexOfOutsideComments in
         src/lib/seo.ts, used by vite.config.ts) and
         shell-head-anchors.test.ts pins both layers — but the prose
         here stays tag-sequence-free regardless: describe positions in
         words ("the head element opens / closes"), never in tags.
         1. [build-injected, right after the head element opens] the
            external preload-gate script — non-admin boots append the
            home chunk's modulepreload during head parse (vite.config.ts:
            PRELOAD_GATE_SOURCE; pinned by preload-gate.test.ts).
         2. THIS script (/init.js, below) — the theme class from
            localStorage lands BEFORE first paint, so light-mode users
            never see a dark flash.
         3. [build-injected, before the head element closes] the CSS
            link, vendor modulepreloads and the 4 critical woff2 font
            preloads.
         4. body — #root carries the static-offline no-JS fallback
            (6 s CSS reveal); a healthy main.tsx removes it
            synchronously during module evaluation.
         5. The entry module — ESM evaluation order: lib/boot-sentry
            (defines the error buffers) → App → app/boot-head-start
            (its module-scope gate fires HERE, before main.tsx's body:
            home-chunk warm-up + home-route-gated products prefetch +
            first-4 card-image warming) → the main body (error-buffer
            install, Sentry schedule, direction lock, offline-reveal
            removal, API config, idle analytics) → createRoot().
            render of App → AuthGate probe → home mounts on the
            already-warm chunk + seeded cache → hero/LCP paints with
            the preloaded fonts resident. -->
    <script src="/init.js"></script>
  </head>
  <body>
    <div id="root">
      <!-- 98-F7 (R98-08b — R98-08 offline gap): static no-JS fallback.
           A repeat offline visit after the browser evicts the HTTP cache
           (mobile storage pressure — SW caches survive, the HTTP cache
           does not) previously rendered this precached HTML with zero JS:
           a white screen with no Arabic message, and the only recovery
           (lazyWithRetry's one reload) also needs JS. This inline-styled
           div is the no-JS message. It is HIDDEN by default (opacity:0 +
           a delayed CSS reveal below) so a normal online boot — main.tsx
           removes it synchronously on module evaluation, long before the
           reveal — never flashes it; only a boot whose JS truly never
           arrives lets the reveal fire. R116-S1: the copy is the neutral
           «يتطلب الموقع تشغيل JavaScript» — without JS we cannot KNOW
           the user is offline (the old connection-error wording also
           fired for blocked/broken JS, which is a misleading diagnosis);
           the service worker's own offline handling stays authoritative
           once JS is up. Inline styles + the tiny <style> below:
           self-contained — no dependency on the CSS chunk or any JS
           loading.

           R128-IMP-4 (B5-F4): the reveal delay is 6s, not the original
           2.5s. The reveal is a pure CSS timer while removal happens
           only when the entry module EVALUATES — on a slow first visit
           (no SW yet) the entry + modulepreloaded vendors (~370 KB raw)
           can land after 2.5s on a bandwidth-bound Libyan mobile link,
           so the div flashed «يتطلب الموقع تشغيل JavaScript» and was
           then yanked out when JS arrived (live since R98, cosmetic).
           6s sits past every realistic online first paint while the
           truly-JS-never case still reveals (a degraded path can afford
           to wait). A navigator.onLine-conditional reveal would be
           tighter but needs an inline script — banned by the CSP
           src-less-script gate (A11-F1) — so the delay is the only
           self-contained mechanism. -->
      <style>
        #static-offline {
          min-height: 100dvh;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 24px;
          text-align: center;
          font-family:
            system-ui,
            -apple-system,
            "Segoe UI",
            sans-serif;
          font-size: 16px;
          font-weight: 700;
          line-height: 1.8;
          /* System keyword colors + color-scheme: follow the OS light/dark
             preference (sn_theme lives in localStorage — unreachable
             without JS). */
          color: canvastext;
          background: canvas;
          color-scheme: light dark;
          opacity: 0;
          /* R128-IMP-4 (B5-F4): 2.5s → 6s — see the div comment above.
             The reveal delay must sit past a bandwidth-bound ONLINE
             first paint (entry + vendors still in flight) or the no-JS
             message flashes on healthy slow boots. */
          animation: sn-offline-reveal 0.4s ease 6s forwards;
        }
        @keyframes sn-offline-reveal {
          to {
            opacity: 1;
          }
        }
      </style>
      <div id="static-offline" dir="rtl" role="status">يتطلب الموقع تشغيل JavaScript</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
